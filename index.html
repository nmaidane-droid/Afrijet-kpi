    window.addEventListener('load', function() {
      var bar = document.getElementById('load-bar');
      var lbl = document.getElementById('load-label');
      function prog(p, t){ if(bar){bar.style.width=p+'%';} if(lbl){lbl.textContent=t;} }
      try {
        prog(30, 'Chargement des bibliothèques...');
        var el = document.getElementById('app-code');
        var code = el.textContent;
        // Version compilée à l'avance par Vercel (data-compiled) : pas de Babel
        // dans le navigateur. Sinon, compilation sur place comme auparavant.
        var compiled;
        if (el.getAttribute('data-compiled') === '1') {
          compiled = code;
        } else {
          prog(50, 'Compilation de l\'application...');
          compiled = Babel.transform(code, { presets: ['react'] }).code;
        }
        prog(80, 'Démarrage...');
        var fn = new Function('React', 'ReactDOM', compiled + '\nreturn App;');
        var App = fn(React, ReactDOM);
        prog(95, 'Chargement des données...');
        var root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
      } catch(e) {
        document.getElementById('err').style.display = 'block';
        document.getElementById('err').textContent = 'Erreur: ' + e.message;
      }
    });
  </script>

class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(e){return {error:e?.message||String(e)};}
  render(){
    if(this.state.error) return (
      <div style={{padding:24,textAlign:"center"}}>
        <div style={{fontSize:24,marginBottom:8}}>⚠️</div>
        <div style={{fontWeight:700,color:"#DC2626"}}>Erreur : {this.state.error}</div>
        <button onClick={()=>{sessionStorage.clear();window.location.reload();}}
          style={{marginTop:16,padding:"10px 20px",background:"#0F1F3D",color:"white",border:"none",borderRadius:8,cursor:"pointer"}}>
          Retour à la connexion
        </button>
      </div>
    );
    return this.props.children;
  }
}

async function checkPassword(pwd, profileId) {
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest("SHA-256", enc.encode(pwd));
  const hex = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  const profile = PROFILES.find(p=>p.id===profileId);
  return hex === (profile ? profile.pwdHash : APP_PASSWORD_HASH);
}
const supabase = window.supabase?.createClient(SUPA_URL, SUPA_KEY);

async function sbGet(key) {
  if(!supabase) return null;
  try {
    const {data,error} = await supabase.from("kv_store").select("value").eq("key",key).single();
    if(error||!data) return null;
    return JSON.parse(data.value);
  } catch(e) { return null; }
}

// Retourne true si l'écriture a abouti, false sinon — l'appelant décide quoi faire.
async function sbSet(key, value) {
  if(!supabase) return false;
  try {
    const {error} = await supabase.from("kv_store").upsert({key, value: JSON.stringify(value)}, {onConflict:"key"});
    if(error){ console.warn("[persist] écriture refusée pour", key, error.message||error); return false; }
    return true;
  } catch(e) { console.warn("[persist] écriture impossible pour", key, e&&e.message); return false; }

const TOP=60, BOT=58, PFX="ajs135v1_";
const fmtMAD = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");

const lsGet = k => { try { return localStorage.getItem(k); } catch(_e) { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(_e){ logSilent(_e); } };


// ── Persistance locale + cloud, avec horodatage ──────────────────────────────
// Chaque valeur est stockée dans une enveloppe { __v: valeur, __t: horodatage }.
// Règle de fusion : la valeur la plus récente gagne, localement comme entre
// appareils. Une valeur héritée sans enveloppe vaut horodatage 0.
//
// Ce que cela corrige par rapport à la version précédente :
//  - le chargement distant n'écrase plus une saisie faite entre l'affichage
//    et la réponse du serveur ;
//  - deux appareils ne s'écrasent plus mutuellement à l'aveugle ;
//  - les écritures réseau sont regroupées (400 ms) au lieu d'une par frappe ;
//  - un échec d'écriture est journalisé, et la valeur locale — toujours plus
//    récente — est renvoyée à la prochaine ouverture.
function unwrapEnv(raw){
  if(raw && typeof raw==="object" && !Array.isArray(raw) && "__t" in raw && "__v" in raw)
    return {v:raw.__v, t:Number(raw.__t)||0};
  return {v:raw, t:0};
}

const PERSIST_DEBOUNCE_MS = 400;

// État de synchronisation partagé : nombre d'écritures en attente et
// fonctions de renvoi, pour l'indicateur du bandeau et le retour du réseau.
const SYNC = { pending:new Set(), flushers:new Set(), listeners:new Set(), lastError:null };
SYNC.notify = () => SYNC.listeners.forEach(fn=>{ try{ fn(); }catch(_e){ logSilent(_e); } });
SYNC.flushAll = () => SYNC.flushers.forEach(fn=>{ try{ fn(); }catch(_e){ logSilent(_e); } });
window.addEventListener("online", ()=>{ SYNC.lastError=null; SYNC.flushAll(); SYNC.notify(); });
window.addEventListener("offline", ()=>SYNC.notify());

// Abonnement React à cet état
function useSyncStatus(){
  const [,tick]=useState(0);
  useEffect(()=>{
    const fn=()=>tick(t=>t+1);
    SYNC.listeners.add(fn);
    return ()=>SYNC.listeners.delete(fn);
  },[]);
  return { pending:SYNC.pending.size, offline:typeof navigator!=="undefined"&&navigator.onLine===false, lastError:SYNC.lastError };
}

function usePersist(key, init) {
  const fk = PFX+key;
  const localT   = useRef(0);      // horodatage de la valeur affichée
  const dirty    = useRef(false);  // modifiée depuis le montage ?
  const timer    = useRef(null);   // anti-rebond
  const pending  = useRef(null);   // enveloppe en attente d'envoi

  const valRef = useRef(null);      // valeur courante, pour comparer avant / après (journal d'audit)
  const [val, setVal] = useState(() => {
    const s = lsGet(fk);
    if (!s) return init;
    try {
      const u = unwrapEnv(JSON.parse(s));
      localT.current = u.t;
      return u.v;
    } catch(_e) { return init; }
  });

  // Envoi immédiat de ce qui est en attente
  const flush = () => {
    if (timer.current) { clearTimeout(timer.current); timer.current = null; }
    const env = pending.current;
    if (!env) return;
    pending.current = null;
    sbSet(fk, env).then(ok => {
      // Échec : on garde l'enveloppe pour réessayer au retour du réseau,
      // au prochain changement ou à la prochaine ouverture.
      if (!ok) { if (!pending.current) pending.current = env; SYNC.lastError = fk; }
      else { SYNC.pending.delete(fk); if (SYNC.lastError===fk) SYNC.lastError=null; }
      SYNC.notify();
    });
  };
  const schedule = env => {
    pending.current = env;
    SYNC.pending.add(fk); SYNC.notify();
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(flush, PERSIST_DEBOUNCE_MS);
  };
  // Enregistré pour le renvoi global au retour du réseau
  useEffect(() => { SYNC.flushers.add(flush); return () => SYNC.flushers.delete(flush); }, [fk]);

  // Chargement distant au montage, avec fusion par horodatage
  useEffect(() => {
    let alive = true;
    sbGet(fk).then(remote => {
      if (!alive || remote === null) return;
      const u = unwrapEnv(remote);
      // Le distant l'emporte s'il est strictement plus récent, ou à égalité
      // si rien n'a été modifié ici entre-temps.
      const adopt = u.t > localT.current || (u.t === localT.current && !dirty.current);
      if (adopt) {
        localT.current = u.t;
        valRef.current = u.v;
        setVal(u.v);
        lsSet(fk, JSON.stringify({__v:u.v, __t:u.t}));
      } else {
        // Le local est plus récent : on le pousse.
        pending.current = {__v: JSON.parse(lsGet(fk)).__v, __t: localT.current};
        flush();
      }
    });
    return () => { alive = false; };
  }, [fk]);

  // Vider la file avant que la page ne disparaisse
  useEffect(() => {
    const onHide = () => { if (document.visibilityState === "hidden") flush(); };
    document.addEventListener("visibilitychange", onHide);
    window.addEventListener("pagehide", flush);
    return () => {
      document.removeEventListener("visibilitychange", onHide);
      window.removeEventListener("pagehide", flush);
    };
  }, [fk]);

  valRef.current = val;
  // Modification locale : calculée tout de suite (et non pendant le rendu), pour la journaliser
  // avec la personne connectée. Les données reçues d'un autre appareil ne passent pas par ici.
  const set = v => {
    const prev = valRef.current;
    const next = typeof v === "function" ? v(prev) : v;
    valRef.current = next;
    const t = Date.now();
    localT.current = t;
    dirty.current = true;
    const env = {__v: next, __t: t};
    lsSet(fk, JSON.stringify(env));
    schedule(env);
    setVal(next);
    auditDiff(key, prev, next);
  };
  return [val, set];
}

function clearStorage() {
  try {
    // La file du journal d'audit (entrées pas encore envoyées) et la copie des comptes sont conservées
    const keys = Object.keys(localStorage).filter(k => k.startsWith(PFX) && k!==PFX+"audit_queue" && k!==PFX+"users_cache");
    keys.forEach(k => localStorage.removeItem(k));
  } catch(_e){ logSilent(_e); }
}

// Champ heure « HH:MM » sans sélecteur natif : le picker d'Android déborde de
// l'écran sur certains appareils. Saisie au clavier numérique, deux-points
// insérés automatiquement, bornes 00-23 / 00-59. Valeur stockée : "HH:MM".
function TimeField({ value, onChange, style, placeholder }) {
  const [focused, setFocused] = useState(false);
  const [draft, setDraft] = useState(null);   // texte en cours de frappe
  const shown = draft!==null ? draft : (value||"");
  const format = raw => {
    const d = String(raw).replace(/\D/g,"").slice(0,4);
    if(d.length<=2) return d;
    return d.slice(0,2)+":"+d.slice(2);
  };
  const commit = txt => {
    const d = String(txt).replace(/\D/g,"");
    if(!d){ onChange(""); return; }
    let h = Number(d.slice(0,2)), m = Number((d.slice(2)+"00").slice(0,2));
    if(d.length===1){ h = Number(d); m = 0; }
    if(d.length===3){ h = Number(d[0]); m = Number(d.slice(1)); }
    if(isNaN(h)||isNaN(m)||h>23||m>59){ onChange(""); return; }
    onChange(String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"));
  };
  return (
    <input type="text" inputMode="numeric" pattern="[0-9:]*" autoComplete="off"
      value={shown} placeholder={placeholder||"HH:MM"}
      onFocus={()=>{ setFocused(true); setDraft(value||""); }}
      onChange={e=>setDraft(format(e.target.value))}
      onBlur={()=>{ setFocused(false); commit(draft===null?value:draft); setDraft(null); }}
      onKeyDown={e=>{ if(e.key==="Enter") e.currentTarget.blur(); }}
      style={{ width:"100%", height:48, boxSizing:"border-box",
               background:focused?"#FFF":C.bg, border:"1.5px solid "+(focused?C.gold:C.border),
               borderRadius:10, padding:"0 14px", color:C.text, fontSize:14,
               fontFamily:"inherit", outline:"none", letterSpacing:"0.06em",
               ...(style||{}) }}/>
  );
}

// Champ date « JJ/MM/AAAA » sans sélecteur natif, même principe que TimeField.
// Saisie au clavier numérique, barres insérées automatiquement, date impossible refusée,
// bornes min / max (AAAA-MM-JJ) ; valeur stockée inchangée : « AAAA-MM-JJ ».
function DateField({ value, onChange, min, max, style, placeholder }) {
  const [focused, setFocused] = useState(false);
  const [draft, setDraft] = useState(null);
  const [err, setErr] = useState("");
  const iso2fr = v => /^\d{4}-\d{2}-\d{2}$/.test(String(v||"")) ? v.slice(8,10)+"/"+v.slice(5,7)+"/"+v.slice(0,4) : "";
  const shown = draft!==null ? draft : iso2fr(value);
  const format = raw => { const d=String(raw).replace(/\D/g,"").slice(0,8);
    return d.length<=2?d:d.length<=4?d.slice(0,2)+"/"+d.slice(2):d.slice(0,2)+"/"+d.slice(2,4)+"/"+d.slice(4); };
  const commit = txt => {
    const d=String(txt).replace(/\D/g,"");
    if(!d){ setErr(""); onChange(""); return; }
    let j=Number(d.slice(0,2)), m=Number(d.slice(2,4)), y=d.slice(4);
    if(y.length===2) y="20"+y;
    const Y=Number(y), dt=new Date(Y, m-1, j);
    if(d.length<6||y.length!==4||!(dt.getFullYear()===Y&&dt.getMonth()===m-1&&dt.getDate()===j)){ setErr("Date invalide (JJ/MM/AAAA)"); onChange(""); return; }
    const iso=y+"-"+String(m).padStart(2,"0")+"-"+String(j).padStart(2,"0");
    if(max&&iso>max){ setErr(max===new Date().toISOString().slice(0,10)?"La date ne peut pas être dans le futur":"Date postérieure au "+iso2fr(max)); onChange(""); return; }
    if(min&&iso<min){ setErr("Date antérieure au "+iso2fr(min)); onChange(""); return; }
    setErr(""); onChange(iso);
  };
  return (<div style={{flex:(style||{}).flex,minWidth:0}}>
    <input type="text" inputMode="numeric" autoComplete="off" aria-invalid={!!err}
      value={shown} placeholder={placeholder||"JJ/MM/AAAA"}
      onFocus={()=>{ setFocused(true); setDraft(iso2fr(value)); }}
      onChange={e=>{ setErr(""); setDraft(format(e.target.value)); }}
      onBlur={()=>{ setFocused(false); commit(draft===null?iso2fr(value):draft); setDraft(null); }}
      onKeyDown={e=>{ if(e.key==="Enter") e.currentTarget.blur(); }}
      style={{ width:"100%", height:48, boxSizing:"border-box", background:focused?"#FFF":C.bg,
               border:"1.5px solid "+(err?"#DC2626":focused?C.gold:C.border), borderRadius:10, padding:"0 14px",
               color:C.text, fontSize:14, fontFamily:"inherit", outline:"none", letterSpacing:"0.04em", ...(style?{height:"auto"}:{}), ...(style||{}), flex:undefined,
               ...(err?{borderColor:"#DC2626"}:{}) }}/>
    {err&&<div role="alert" style={{fontSize:11,color:"#B91C1C",marginTop:3,fontWeight:600}}>{err}</div>}
  </div>);
}

function FAirport({ label, value, onChange }) {
  const [q, setQ]   = useState(value||"");
  const [open,setO] = useState(false);
  const res = q.length>=2
    ? WORLD_AIRPORTS.filter(a=>a.c.toUpperCase().startsWith(q.toUpperCase())||a.n.toLowerCase().includes(q.toLowerCase())).slice(0,8)
    : [];
  const pick = c => { onChange(c); setQ(c); setO(false); };
  const icaoKnown = q.length >= 3;
  return (
    <div style={{ position:"relative" }}>
      <FLabel>{label}</FLabel>
      <input value={q}
        onChange={e=>{setQ(e.target.value);setO(true);onChange(e.target.value.toUpperCase());}}
        onFocus={()=>setO(true)} onBlur={()=>setTimeout(()=>setO(false),150)}

function calcFlightCategory(metar) {
  if(!metar) return "?";
  // Extract visibility (statute miles from metres or sm)
  let vis = 99;
  const smMatch = metar.match(/\b(\d+(?:\/\d+)?SM)\b/);
  const mMatch  = metar.match(/\b(\d{4})\b/);
  if(smMatch) {
    const raw = smMatch[1].replace("SM","");
    if(raw.includes("/")) { const [n,d]=raw.split("/"); vis=Number(n)/Number(d); }
    else vis = Number(raw);
  } else if(mMatch) {
    vis = Number(mMatch[1]) / 1609.34;
  }
  // Extract ceiling (BKN or OVC)
  let ceil = 99999;
  const ceilMatches = [...metar.matchAll(/(?:BKN|OVC)(\d{3})/g)];
  ceilMatches.forEach(m => { const ft=Number(m[1])*100; if(ft<ceil) ceil=ft; });
  if(ceil===99999 && metar.includes("CAVOK")) ceil=99999;
  if(ceil < 500  || vis < 1)   return "LIFR";
  if(ceil < 1000 || vis < 3)   return "IFR";
  if(ceil < 3000 || vis < 5)   return "MVFR";
  return "VFR";
}

function useMetar(iata) {
  const [fc, setFc] = React.useState("?");
  const [raw, setRaw] = React.useState("");
  React.useEffect(() => {
    if(!iata||iata.length<3) return;
    setFc("?"); setRaw("");
    const icao = IATA_TO_ICAO[iata.toUpperCase()] || iata.toUpperCase();
    fetch(`${API_WX}?icao=${icao}`, { headers: {"Accept":"application/json"} })
      .then(r=>r.json())
      .then(data=>{
        const m = data?.data?.[0];
        if(!m) return;
        setRaw(m.raw_text||"");
        setFc(m.flight_category||calcFlightCategory(m.raw_text||""));
      })
      .catch(()=>setFc("?"));
  }, [iata]);
  return {fc, raw};
}

function simulateFlightState(icao24) {
  const now = Date.now();
  const seed  = Math.sin(now / 8000);
  const seed2 = Math.cos(now / 6000);
  const seed3 = Math.sin(now / 4000);

  // CN-KTB — RAK (Marrakech) -> VIL (Dakhla), position mi-chemin
  if(icao24 === "CN-KTB") {
    const elapsed = (now % (135 * 60 * 1000)) / (135 * 60 * 1000);
    const progress = 0.45 + elapsed * 0.1; // oscille autour de mi-chemin
    const lat = 31.607 + (23.7183 - 31.607) * progress + seed * 0.05;
    const lon = -8.036 + (-15.9320 - (-8.036)) * progress + seed2 * 0.05;
    const cruiseAlt = 9144; // FL300
    const altM = cruiseAlt + seed * 80;
    const speed_ms = 220 + seed2 * 8;
    const heading = 215 + seed3 * 3; // Cap SO vers Dakhla
    return {
      icao24,
      callsign:    "AJS07",
      country:     "Morocco",
      lat, lon,
      onGround:    false,
      heading,
      vertRate_ms: seed * 0.3,
      squawk:      "2342",
      lastContact: Math.floor(now / 1000),
      speed_kt:    Math.round(speed_ms * 1.94384),
      alt_ft:      Math.round(altM * 3.28084),
      flightLevel: Math.round(altM * 3.28084 / 100),
      simulated:   true,
    };
  }

  // CN-KTA — CMN (Casablanca) -> FEZ, position mi-chemin
  const elapsed = (now % (55 * 60 * 1000)) / (55 * 60 * 1000);
  const progress = 0.45 + elapsed * 0.1; // oscille autour de mi-chemin
  const lat = 33.3675 + (33.9273 - 33.3675) * progress + seed * 0.03;
  const lon = -7.5900 + (-4.9778 - (-7.5900)) * progress + seed2 * 0.03;
  const cruiseAlt = 8534; // FL280
  const altM = cruiseAlt + seed * 80;
  const speed_ms = 225 + seed2 * 8;
  const heading = 72 + seed3 * 3; // ENE vers FEZ
  return {
    icao24:      icao24 || "CN-KTA",
    callsign:    "AJS03",
    country:     "Morocco",
    lat, lon,
    onGround:    false,
    heading,
    vertRate_ms: elapsed < 0.15 ? 8.5 : elapsed > 0.85 ? -7.2 : seed * 0.5,
    squawk:      "2341",
    lastContact: Math.floor(now / 1000),
    speed_kt:    Math.round(speed_ms * 1.94384),
    alt_ft:      Math.round(altM * 3.28084),
    flightLevel: Math.round(altM * 3.28084 / 100),
    simulated:   true,
  };
}

// Generate ~10 simulated Morocco traffic blips (fallback when the live API is unavailable)
function simulateMoroccoTraffic() {
  const callsigns = ["RAM450","RAM800","TOM2201","VLG1234","EJU5678","DAH012","AFR1480","IBE3344","BAW9921","TAR550"];
  const now = Date.now();
  const blips = [];
  for (let i = 0; i < 10; i++) {
    const lat = 28.5 + ((now/90000 + i*37) % 100)/100 * 8;
    const lon = -10.5 + ((now/110000 + i*53) % 100)/100 * 9;
    blips.push({
      lat, lon,
      track: Math.round((now/1000 + i*47) % 360),
      alt: 18000 + (i*1500)%20000,
      gspeed: 380 + (i*23)%160,
      callsign: callsigns[i % callsigns.length],
      reg: "",
      hex: "",
      simulated: true,
    });
  }
  return blips;
}

function parseState(s) {
  if(!s||typeof s!=="object")return null;
  return {lat:s.lat,lon:s.lon,heading:s.track||0,alt_m:(s.alt||0)*0.3048,speed_ms:(s.gspeed||0)*0.51444,callsign:(s.callsign||s.flight||"").trim(),simulated:false};
}

async function fetchByIcao24(registration) {
  try {
    const r = await Promise.race([
      fetch(`${API_FR24}?registrations=${encodeURIComponent(registration)}`, {headers:{"Accept":"application/json"}}),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 4000))
    ]);
    if (r.ok) {
      const j = await r.json();
      if (j.data?.[0]) return j.data[0];
    }
  } catch(_e){ logSilent(_e); }
  return null;
}

async function fetchRegionalTraffic(lat, lon) {
  const d = 3; // ~3 degrees radius around the aircraft
  const bounds = `${lat+d},${lat-d},${lon-d},${lon+d}`;
  try {
    const r = await Promise.race([
      fetch(`${API_FR24}?bounds=${encodeURIComponent(bounds)}`, {headers:{"Accept":"application/json"}}),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 4000))
    ]);
    if (r.ok) {
      const j = await r.json();
      return j.data ?? [];
    }
  } catch(_e){ logSilent(_e); }
  return simulateMoroccoTraffic();
}

// ── Alerts ───────────────────────────────────────────────────────────────────
function computeAlerts(kpis, flights, maintData, aircraft, crew, sgsRed) {
  const a=[];
  // SGS 02-02 : risque intolérable → Dirigeant Responsable avisé immédiatement.
  // Seuls l'intitulé et le niveau sont diffusés, jamais le détail.
  (sgsRed||[]).forEach(h=>{ const r=sgsRisqueCourant(h);
    a.push({id:"sgs-"+h.id, sev:"danger", icon:"⛔", msg:"Risque intolérable "+h.ref+" ("+r.cell+") — "+h.titre});
  });
  // Vols planifiés compromis : réexaminés à chaque calcul, pour attraper un titre
  // ou un MEL devenu échu après la planification — bien avant le jour du départ.
  (flights||[]).filter(f=>f.status==="Planifie").forEach(f=>{
    const pb=[...volCompromis(f, crew, aircraft), ...chevauchements(f, flights)];
    if(!pb.length) return;
    const d=String(f.date||'').slice(0,10).split('-').reverse().join('/');
    a.push({id:"vc-"+f.num+"-"+f.date, sev:"danger", icon:"🛫",
            msg:"Vol "+f.num+" du "+d+" compromis — "+pb.map(p=>p.label).join(" · ")});
  });
  // Échéances équipage : titre échu, puis échéance sous 30 puis 90 jours.
  (crew||[]).forEach(m=>{
    const d=m.dates||{};
    const qui=m.nom+" "+m.prenom;
    crewItemsFor(m.role).forEach(it=>{
      const j=joursAvant(d[it.k]);
      if(j===null) return;
      if(j<0)        a.push({id:"cr-"+m.id+"-"+it.k, sev:"danger", icon:"🧑‍✈️",
                             msg:qui+" — "+it.label+" échu depuis "+(-j)+" j"+(it.bloquant?" (affectation interdite)":"")});
      else if(j<=30) a.push({id:"cr-"+m.id+"-"+it.k, sev:"danger", icon:"🧑‍✈️",
                             msg:qui+" — "+it.label+" expire dans "+j+" j"});
      else if(j<=90) a.push({id:"cr-"+m.id+"-"+it.k, sev:"warn", icon:"🧑‍✈️",
                             msg:qui+" — "+it.label+" expire dans "+j+" j"});
    });
  });
  // Calculate real OTP from flights
  const volsDone=flights.filter(f=>f.status==="Termine");
  const otpScore=f=>f.delayMin<=0?100:f.delayMin<=15?85:f.delayMin<=30?70:f.delayMin<=45?50:25;
  const otp=volsDone.length>0?Math.round(volsDone.reduce((s,f)=>s+otpScore(f),0)/volsDone.length):kpis.otp||0;
  const delayVols=volsDone.filter(f=>f.delayMin>0);
  const delayMin=delayVols.length>0?Math.round(delayVols.reduce((s,f)=>s+f.delayMin,0)/delayVols.length):kpis.delayMin||0;
  if(otp<85)a.push({id:"otp",sev:"danger",msg:"OTP critique: "+otp+"% (seuil 85%)",icon:"⏰"});
  else if(otp<90)a.push({id:"otp",sev:"warn",msg:"OTP en baisse: "+otp+"%",icon:"⏰"});
  if(delayMin>30)a.push({id:"del",sev:"danger",msg:"Retards: "+delayMin+" min",icon:"⚠"});
  else if(delayMin>15)a.push({id:"del",sev:"warn",msg:"Retards: "+delayMin+" min",icon:"⚠"});
  const lfComVols=volsDone.filter(f=>!f.flightType||f.flightType==="Commercial");const lfVal=lfComVols.length>0?Math.round(lfComVols.reduce((s,f)=>s+f.load,0)/lfComVols.length):kpis.loadFactor||0;
  if(lfVal<70)a.push({id:"lf",sev:"warn",msg:"Load Factor: "+lfVal+"%",icon:"💺"});
  // Per-aircraft checks and MEL alerts
  const acList=aircraft||[];
  acList.forEach(ac=>{
    const prefix=aircraft&&aircraft.length>1?"["+ac.immat+"] ":"";
    const id_prefix=ac.id||"ac";
    if((ac.nextCheckH||999)<50)a.push({id:id_prefix+"_achk",sev:"danger",msg:prefix+"A-Check dans "+(ac.nextCheckH||0)+"h",icon:"🔧"});
    else if((ac.nextCheckH||999)<100)a.push({id:id_prefix+"_achk",sev:"warn",msg:prefix+"A-Check dans "+(ac.nextCheckH||0)+"h",icon:"🔧"});
    if(ac.bCheckH&&ac.bCheckH<100)a.push({id:id_prefix+"_bchk",sev:"danger",msg:prefix+"B-Check dans "+ac.bCheckH+"h",icon:"🔩"});
    else if(ac.bCheckH&&ac.bCheckH<300)a.push({id:id_prefix+"_bchk",sev:"warn",msg:prefix+"B-Check dans "+ac.bCheckH+"h",icon:"🔩"});
    if(ac.cCheckH&&ac.cCheckH<200)a.push({id:id_prefix+"_cchk",sev:"danger",msg:prefix+"C-Check dans "+ac.cCheckH+"h",icon:"🛠"});
    else if(ac.cCheckH&&ac.cCheckH<500)a.push({id:id_prefix+"_cchk",sev:"warn",msg:prefix+"C-Check dans "+ac.cCheckH+"h",icon:"🛠"});
    (ac.mels||[]).forEach((m,i)=>{
      const parts=(m.exp||"").split("/");
      const expDate=parts.length===3?new Date(parseInt(parts[2])<100?2000+parseInt(parts[2]):parseInt(parts[2]),parseInt(parts[1])-1,parseInt(parts[0])):null;
      const today=new Date(); today.setHours(0,0,0,0);
      const expired=expDate&&expDate<today;
      const sev=m.sev==="A"?"danger":m.sev==="B"?"danger":"warn";
      const msg=prefix+"MEL Cat."+m.sev+(expired?" ⚠️ EXPIRÉ":"")+' — '+m.sys+' ('+(m.mel||m.ref||"")+') · Exp: '+m.exp;
      a.push({id:id_prefix+"_mel_"+i,sev,expired,msg,icon:"🔧"});
    });
  });
  return a;
}

// ── Échéances équipage ──────────────────────────────────────────────────────
// La date saisie est celle imprimée sur le document. Elle n'est jamais calculée :
// les règles de validité varient selon l'âge, le niveau obtenu ou la date de
// revalidation, et les coder reviendrait à présumer d'une réglementation qui
// n'est pas nécessairement celle applicable ici.
// bloquant : un titre échu interdit l'affectation du membre à un vol.
const CREW_ITEMS = [
  {k:'qt',   label:'Qualification de type EMB-145',   roles:['TRI','CM1','CM2'], bloquant:true},
  {k:'med',  label:'Certificat médical',              roles:['TRI','CM1','CM2','CC'], bloquant:true},
  {k:'opc',  label:'Contrôle hors ligne (OPC)',       roles:['TRI','CM1','CM2'], bloquant:true},
  {k:'cc',   label:'Certificat membre équipage cabine', roles:['CC'], bloquant:true},
  {k:'sep',  label:'Formation SEP',                   roles:['CC'], bloquant:true},
  {k:'ir',   label:'Qualification vol aux instruments', roles:['TRI','CM1','CM2'], bloquant:false},
  {k:'ln',   label:'Contrôle en ligne',               roles:['TRI','CM1','CM2'], bloquant:false},
  {k:'lang', label:'Compétence linguistique anglais', roles:['TRI','CM1','CM2'], bloquant:false},
  {k:'crm',  label:'CRM',                             roles:['TRI','CM1','CM2','CC'], bloquant:false},
  {k:'dg',   label:'Marchandises dangereuses',        roles:['TRI','CM1','CM2','CC'], bloquant:false},
];
const crewItemsFor = (role) => CREW_ITEMS.filter(i=>i.roles.includes(role));

// Jours restants avant échéance ; null si la date est absente ou illisible.
function joursAvant(d){
  if(!d) return null;
  const t=new Date(d+'T00:00:00');
  if(isNaN(t)) return null;
  const n=new Date(); n.setHours(0,0,0,0);
  return Math.round((t-n)/86400000);
}
// vert au-delà de 90 j · ambre de 90 à 31 j · orange de 30 à 0 j · rouge échu
function statutEcheance(d){
  const j=joursAvant(d);
  if(j===null) return {code:'vide',  color:'#94A3B8', bg:'#F4F7FB', label:'Non renseigné'};
  if(j<0)      return {code:'echu',  color:'#FFFFFF', bg:'#DC2626', label:'Échu · '+(-j)+' j'};
  if(j<=30)    return {code:'proche',color:'#FFFFFF', bg:'#D97706', label:j+' j restants'};
  if(j<=90)    return {code:'alerte',color:'#92400E', bg:'#FEF3C7', label:j+' j restants'};
  return              {code:'ok',    color:'#065F46', bg:'#D1FAE5', label:j+' j restants'};
}
// Titres bloquants échus pour un membre donné
function titresEchus(m){
  if(!m) return [];
  const d=m.dates||{};
  return crewItemsFor(m.role).filter(i=>i.bloquant && joursAvant(d[i.k])!==null && joursAvant(d[i.k])<0);
}

// ── Contrôle d'un vol planifié à sa date ──────────────────────────────────────
// Un vol est « compromis » si, à la date où il doit avoir lieu, l'appareil porte
// un MEL échu ou un membre d'équipage un titre bloquant échu. Utilisé à la
// planification, dans les alertes et dans la liste des vols.
function melDateToISO(exp){
  // « JJ/MM/AA » ou « JJ/MM/AAAA » → « AAAA-MM-JJ »
  const p=String(exp||'').split('/');
  if(p.length!==3) return null;
  const yr=p[2].length===2 ? 2000+Number(p[2]) : Number(p[2]);
  if(isNaN(yr)||isNaN(Number(p[1]))||isNaN(Number(p[0]))) return null;
  return yr+'-'+String(p[1]).padStart(2,'0')+'-'+String(p[0]).padStart(2,'0');
}
function volCompromis(vol, crew, aircraft){
  const pb=[];
  const dateVol=String(vol.date||'').slice(0,10);
  if(!dateVol) return pb;
  // MEL de l'appareil, échus à la date du vol
  const ac=(aircraft||[]).find(a=>a.id===vol.acId);
  if(ac&&Array.isArray(ac.mels)){
    ac.mels.forEach(m=>{
      const iso=melDateToISO(m.exp);
      if(iso && iso<dateVol)
        pb.push({type:'mel', label:`MEL ${m.mel||''} ${m.sys||''} (Cat.${m.sev||'?'}) expiré le ${m.exp}`.replace(/\s+/g,' ').trim()});
    });
  }
  // Titres bloquants de l'équipage, échus à la date du vol
  const nomComplet=m=>m.nom+' '+m.prenom;
  [vol.cm1,vol.cm2,vol.cc].filter(Boolean).forEach(n=>{
    const m=(crew||[]).find(x=>nomComplet(x)===n);
    if(!m) return;
    const d=m.dates||{};
    crewItemsFor(m.role).filter(i=>i.bloquant).forEach(i=>{
      const exp=String(d[i.k]||'').slice(0,10);
      if(exp && exp<dateVol) pb.push({type:'crew', label:`${n} : ${i.label} échu le ${exp.split('-').reverse().join('/')}`});
    });
  });
  return pb;
}

// ── Chevauchement d'équipage ──────────────────────────────────────────────────
// Un membre ne peut pas être sur deux vols dont les plages horaires se
// recouvrent le même jour. Plage = départ prévu → arrivée prévue ; à défaut
// d'arrivée, durée planifiée ou 2 h par défaut.
function plageVol(v){
  const toMin=t=>{ if(!t||!String(t).includes(":")) return null; const [h,m]=String(t).split(":").map(Number); return h*60+m; };
  const d=toMin(v.dep); if(d===null) return null;
  let a=toMin(v.arr);
  if(a===null) a = d + (Number(v.dureeMin)>0 ? Number(v.dureeMin) : 120);
  if(a<=d) a+=1440;   // passage minuit
  return {d,a};
}
function chevauchements(vol, flights){
  const pb=[];
  const p=plageVol(vol); if(!p) return pb;
  const membres=[vol.cm1,vol.cm2,vol.cc].filter(Boolean);
  (flights||[]).forEach(f=>{
    if(f===vol || f.num===vol.num && f.date===vol.date && f.dep===vol.dep) return;
    if(f.date!==vol.date) return;
    if(f.status!=="Planifie" && f.status!=="En vol") return;
    const q=plageVol(f); if(!q) return;
    if(p.d>=q.a || q.d>=p.a) return;   // pas de recouvrement
    [f.cm1,f.cm2,f.cc].filter(Boolean).forEach(n=>{
      if(membres.includes(n)) pb.push({type:'overlap', label:`${n} déjà affecté au vol ${f.num} (${f.from}→${f.to}, ${f.dep}–${f.arr||'?'})`});
    });
  });
  return pb;
}

// ── Forms ────────────────────────────────────────────────────────────────────
function FormVol({ onSubmit, crew, aircraft, saved, clients, onBack, flights }) {
  const today=new Date().toISOString().slice(0,10);
  const [acId,setAcId]=useState(aircraft&&aircraft.length>0?aircraft[0].id:"");

  // Auto-remplir le numéro de vol avec l'immatriculation de l'avion sélectionné
  React.useEffect(()=>{
    const ac=aircraft?.find(a=>a.id===acId);
    if(ac) setNum(ac.immat||"");
  },[acId]);
  const ac=aircraft?.find(a=>a.id===acId)||aircraft?.[0]||{immat:"CN-KTA",type:"EMB-140 LR",sieges:18,capa:5700,id:"AC001"};
  const SIEGES=ac.sieges||18;
  const [num,setNum]=useState("");
  const [from_,setFrom]=useState("");
  const [to,setTo]=useState("");
  const [dep,setDep]=useState("");
  const [arr,setArr]=useState("");
  const [pax,setPax]=useState("");
  const [date,setDate]=useState(today);
  const [cm1,setCm1]=useState("");
  const [cm2,setCm2]=useState("");
  const [flightType,setFlightType]=useState("Commercial");
  const [cc,setCc]=useState("");
  const [clientId,setClientId]=useState("");

  const pn=Math.min(SIEGES,Math.max(0,Number(pax)||0));
  const load=Math.round(pn/SIEGES*100);

  const submit=()=>{
    if(!num.trim()||!dep){uiAlert("N° vol et départ requis");return;}
    // Contrôles de cohérence de saisie
    const paxSaisi=Number(pax)||0;
    if(paxSaisi>SIEGES){ uiAlert("⚠️ "+paxSaisi+" passagers pour un appareil de "+SIEGES+" sièges.\n\nCorrigez le nombre de passagers."); return; }
    if(paxSaisi<0){ uiAlert("⚠️ Le nombre de passagers ne peut pas être négatif."); return; }
    const o=String(from_||"").trim().toUpperCase(), d2=String(to||"").trim().toUpperCase();
    if(o && d2 && o===d2){ uiAlert("⚠️ L'aérodrome de départ et d'arrivée sont identiques ("+o+")."); return; }
    // Le client est obligatoire pour un vol commercial ; ferry et positionnement en sont dispensés.
    if(flightType==="Commercial" && !clientId){
      uiAlert("⚠️ Un client est requis pour un vol commercial.\n\nSélectionnez un client, ou choisissez le type FRY (ferry) ou POS (positionnement).");
      return;
    }
    const todayStr=new Date().toISOString().slice(0,10);
    if(date<todayStr){uiAlert("⚠️ La date du vol ne peut pas être dans le passé.");return;}
    // MEL et titres équipage sont contrôlés À LA DATE DU VOL, pas à la date du
    // jour : un titre qui expire entre aujourd'hui et le vol bloque dès maintenant.
    const projet={date,acId,dep,arr,cm1:cm1.trim(),cm2:cm2.trim(),cc:cc.trim()};
    const pb=[...volCompromis(projet, crew, aircraft), ...chevauchements(projet, flights)];
    if(pb.length){
      const mel=pb.filter(p=>p.type==='mel'), eq=pb.filter(p=>p.type==='crew'), ov=pb.filter(p=>p.type==='overlap');
      let msg="⛔ Planification impossible pour le "+date.split('-').reverse().join('/')+" :\n";
      if(mel.length) msg+="\nAppareil :\n"+mel.map(p=>"• "+p.label).join("\n")+"\n";
      if(eq.length)  msg+="\nÉquipage :\n"+eq.map(p=>"• "+p.label).join("\n")+"\n";
      if(ov.length)  msg+="\nChevauchement :\n"+ov.map(p=>"• "+p.label).join("\n")+"\n";
      msg+="\nRésolvez ces points, choisissez une autre date, ou désignez un autre membre.";
      uiAlert(msg); return;
    }
    // Pre-calculate planned duration
    let planDuree=0;
    if(dep&&arr){
      const [dh,dm]=dep.split(":").map(Number);
      const [ah,am]=arr.split(":").map(Number);
      const diff=(ah*60+am)-(dh*60+dm);
      if(diff>0) planDuree=diff;
    }
    onSubmit({num:num.trim().toUpperCase(),from:from_,to,dep,arr,depReal:"",arrReal:"",
      status:"Planifie",pax:pn,load,date,acId,sieges:SIEGES,flightType:flightType||"Commercial",clientId:clientId||"",
      carbDep:0,carbArr:0,consomme:0,consoH:0,fuelPct:0,delayMin:0,
      cm1:cm1.trim(),cm2:cm2.trim(),cc:cc.trim(),nps:0,dureeMin:planDuree});
    setNum("");setFrom("");setTo("");setDep("");setPax("");setFlightType("Commercial");
    setCm1("");setCm2("");setCc("");
  };
  return (
    <Card accent="#0F1F3D">
      <FHeader icon="🛫" title="Preparation du vol" subtitle="Donnees planifiees avant depart" color="#0369A1"/>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div>
          <FLabel>Type de vol</FLabel>
          <div style={{display:"flex",gap:8}}>
            {[{v:"Commercial",c:"#00936A",code:"COM"},{v:"Ferry",c:"#0369A1",code:"FRY"},{v:"Positioning",c:"#D97706",code:"POS"}].map(t=>(
              <button key={t.v} onClick={()=>setFlightType(t.v)}
                style={{flex:1,height:40,borderRadius:10,border:"2px solid "+(flightType===t.v?t.c:"#CBD5E1"),
                  background:flightType===t.v?t.c:"white",color:flightType===t.v?"white":C.slate,
                  fontWeight:700,fontSize:12,...TAP}}>
                {t.code}
              </button>
            ))}
          </div>
        </div>
        {/* Client selector - custom dropdown */}
        {clients&&clients.length>0&&(
          <div>
            <FLabel>{flightType==="Commercial"?"Client *":"Client (optionnel)"}</FLabel>
            <CustomSelect
              value={clientId} onChange={setClientId} searchable
              icon="🏢" placeholder={flightType==="Commercial"?"-- Sélectionner un client --":"-- Aucun client --"}
              options={(clients||[]).map(c=>({value:c.id,label:c.nom,sub:c.type+' · '+c.ville}))}
            />
          </div>
        )}
        {/* Aircraft selector */}
        {aircraft&&aircraft.length>0&&(
          <div>
            <FLabel>Avion</FLabel>
            <CustomSelect value={acId} onChange={setAcId} placeholder='-- Choisir un avion --' icon='🛩'
              options={(aircraft||[]).map(a=>({value:a.id,label:a.immat+' · '+a.type,sub:a.sieges+' sièges · TTAF '+(a.ttaf||0).toFixed(1)+'h'}))}/>
          </div>
        )}
        <FGrid><FField label="N Vol *" value={num} onChange={setNum}/><FField label="Date" value={date} onChange={setDate} type="date"/></FGrid>
        <FSection title="Route" color="#0F1F3D"/>
        <FGrid><FAirport label="Depart — Code IATA" value={from_} onChange={setFrom}/><FAirport label="Arrivee — Code IATA" value={to} onChange={setTo}/></FGrid>
        <FSection title="Horaires planifies" color="#0F1F3D"/>
        <FGrid><FField label="Depart prevu * (GMT)" value={dep} onChange={setDep} type="time"/></FGrid>
        <FSection title="Passagers prevus" color="#0F1F3D"/>
        <FGrid>
          <FField label={"PAX (0-"+SIEGES+")"} value={pax} onChange={v=>setPax(String(Math.min(SIEGES,Math.max(0,Number(v)||0))))} type="number" min={0} max={SIEGES}/>
          <FCalc label="Remplissage" value={pax===''?'--':load+"%"} color={pax===''?C.border:load>=80?"#00936A":load>=60?"#D97706":"#DC2626"}/>
        </FGrid>
        <FSection title="Equipage" color="#0F1F3D"/>
        <div style={{display:'flex',gap:8}}>
          <div style={{flex:1,minWidth:0}}>
            <FLabel>CM1</FLabel>
            <CustomSelect value={cm1} onChange={setCm1} placeholder='-- --' icon='👨‍✈️' searchable
              options={(crew||[]).filter(m=>(m.role==='CM1'||m.role==='TRI')&&m.nom+' '+m.prenom!==cm2).map(m=>({value:m.nom+' '+m.prenom,label:m.nom+' '+m.prenom,sub:(titresEchus(m).length?'⛔ INAPTE — titre échu':(m.role==='TRI'?'TRI':'CDB'))}))}/>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <FLabel>CM2</FLabel>
            <CustomSelect value={cm2} onChange={setCm2} placeholder='-- --' icon='👨‍✈️' searchable
              options={(crew||[]).filter(m=>(m.role==='CM1'||m.role==='CM2'||m.role==='TRI')&&m.nom+' '+m.prenom!==cm1).map(m=>({value:m.nom+' '+m.prenom,label:m.nom+' '+m.prenom,sub:(titresEchus(m).length?'⛔ INAPTE — titre échu':(m.role==='TRI'?'TRI':'OPL'))}))}/>
          </div>
        </div>
        <div>
          <FLabel>CC — Hotesse / Steward</FLabel>
          <CustomSelect value={cc} onChange={setCc} placeholder='-- Choisir --' icon='🧑‍✈️'
            options={(crew||[]).filter(m=>m.role==='CC').map(m=>({value:m.nom+' '+m.prenom,label:m.nom+' '+m.prenom,sub:(titresEchus(m).length?'⛔ INAPTE — titre échu':'CC')}))}/>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={onBack}
            style={{flex:1,height:52,background:C.bg,border:"1.5px solid "+C.border,borderRadius:10,color:C.slate,fontSize:13,fontWeight:600,...TAP}}>
            ← Retour
          </button>
          <div style={{flex:2}}><FSubmit label="Planifier le vol" onClick={submit} saved={saved}/></div>
        </div>
      </div>
    </Card>
  );
}


// ── Registre Equipage ────────────────────────────────────────────────────────
function FormEquipage({ crew, setCrew, saved: parentSaved }) {
  const [localSaved, setLocalSaved] = useState(false);
  const saved = localSaved;
  const triggerSaved = () => { setLocalSaved(true); setTimeout(()=>setLocalSaved(false),2500); };
  const ROLES = ["TRI","CM1","CM2","CC"];
  const [nom,setNom]       = useState("");
  const [prenom,setPrenom] = useState("");
  const [role,setRole]     = useState("");
  const [licence,setLic]   = useState("");
  const [dates,setDates]   = useState({});     // échéances saisies
  const [editing,setEditing] = useState(null); // id en cours d edition
  const ficheRef = useRef(null);               // pour remonter à la fiche en modification

  const addOrUpdate = () => {
    if (!nom.trim()||!prenom.trim()) { uiAlert("Nom et prenom requis"); return; }
    if (editing !== null) {
      setCrew(c => c.map(m => m.id===editing
        ? {...m,nom:nom.trim(),prenom:prenom.trim(),role,licence:licence.trim(),dates:{...dates}}
        : m));
      setEditing(null);
    } else {
      const newId = Math.max(0,...(crew||[]).map(m=>m.id))+1;
      setCrew(c => [...c, {id:newId,nom:nom.trim(),prenom:prenom.trim(),role,licence:licence.trim(),dates:{...dates}}]);
    }
    setNom("");setPrenom("");setRole("");setLic("");setDates({});
    triggerSaved();
  };

  const startEdit = m => {
    setEditing(m.id); setNom(m.nom); setPrenom(m.prenom);
    setRole(m.role); setLic(m.licence||""); setDates({...(m.dates||{})});
    // Le formulaire est au-dessus de la liste : on y remonte pour éviter
    // que l'utilisateur ait à faire défiler l'écran.
    setTimeout(()=>{
      if(ficheRef.current&&ficheRef.current.scrollIntoView)
        ficheRef.current.scrollIntoView({behavior:"smooth",block:"start"});
    },60);
  };

  const remove = id => setCrew(c => c.filter(m => m.id!==id));
  const cancel = () => { setEditing(null);setNom("");setPrenom("");setRole("");setLic("");setDates({}); };

  const roleColor = r => r==="TRI"?"#7C3AED":r==="CM1"?"#0F1F3D":r==="CM2"?"#0369A1":"#00936A";
  const roleBg    = r => r==="TRI"?"#EDE9FE":r==="CM1"?"#E0E7FF":r==="CM2"?"#E0F2FE":"#D1FAE5";

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div ref={ficheRef} style={{scrollMarginTop:70}}/>
      <Card accent="#0369A1">
        <FHeader icon="👨‍✈️" title={editing!==null?"Modifier membre":"Ajouter membre"} subtitle="Registre equipage CN-KTA" color="#0369A1"/>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <FGrid>
            <FField label="Nom *" value={nom} onChange={setNom}/>
            <FField label="Prenom *" value={prenom} onChange={setPrenom}/>
          </FGrid>
          <div style={{display:'flex',gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <FLabel>Rôle</FLabel>
              <CustomSelect value={role} onChange={setRole} placeholder='-- Choisir --'
                options={ROLES.map(r=>({
                  value:r,
                  label:r==="CM1"?"CDB":r==="CM2"?"OPL":r,
                  sub:r==="TRI"?"Instructeur":r==="CM1"?"Commandant de bord":r==="CM2"?"Co-pilote":"Hôtesse / Steward"
                }))}/>
            </div>
            <div style={{flex:1,minWidth:0}}>
              <FLabel>N° de licence</FLabel>
              <FField label='' value={licence} onChange={setLic} raw small/>
            </div>
          </div>

          {/* Échéances — dates telles qu'imprimées sur les documents */}
          {role&&(
            <div>
              <FSection title="Échéances" color="#0F1F3D"/>
              <div style={{fontSize:10,color:C.slate,marginBottom:8,lineHeight:1.5}}>
                Saisissez la date de fin de validité figurant sur chaque document.
                La licence marocaine n'ayant pas de terme, elle n'apparaît pas ici.
              </div>
              {crewItemsFor(role).map(it=>{
                const st=statutEcheance(dates[it.k]);
                return (
                  <div key={it.k} style={{display:"flex",alignItems:"center",gap:8,marginBottom:7}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:10.5,color:C.slate,marginBottom:2}}>
                        {it.label}{it.bloquant&&<span style={{color:"#DC2626"}}> *</span>}
                      </div>
                      <DateField value={dates[it.k]||""} onChange={v=>setDates(d=>({...d,[it.k]:v}))}
                        style={{height:38,borderRadius:9,padding:"0 10px",fontSize:12.5}}/>
                    </div>
                    <div style={{width:100,height:38,flexShrink:0,alignSelf:"flex-end",
                      background:st.bg,color:st.color,borderRadius:9,
                      display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:9.5,fontWeight:700,whiteSpace:"nowrap"}}>
                      {st.label}
                    </div>
                  </div>
                );
              })}
              <div style={{fontSize:9.5,color:C.slate,marginTop:6}}>
                <span style={{color:"#DC2626",fontWeight:700}}>*</span> Un titre échu interdit l'affectation à un vol.
              </div>
            </div>
          )}

          <div style={{display:"flex",gap:10}}>
            {editing!==null && (
              <button onClick={cancel}
                style={{flex:1,height:48,background:C.bg,border:"1.5px solid "+C.border,borderRadius:10,color:C.slate,fontSize:14,fontWeight:700,...TAP}}>
                Annuler
              </button>
            )}
            <button onClick={addOrUpdate}
              style={{flex:2,height:48,background:saved?"#00936A":"#DC2626",border:"none",borderRadius:10,color:"white",fontSize:14,fontWeight:700,...TAP,transition:"background 0.3s"}}>
              {saved?"✅ Enregistré":editing!==null?"Enregistrer modifications":"+ Ajouter"}
            </button>
          </div>
        </div>
      </Card>

      <div style={{background:"white",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}}>
        <div style={{padding:"9px 14px",background:C.bg,borderBottom:"1px solid "+C.border,fontSize:10,fontWeight:700,color:C.slate,textTransform:"uppercase"}}>
          {(crew||[]).length} membres enregistres
        </div>
        {(crew||[]).length===0 && (
          <div style={{padding:20,textAlign:"center",color:C.slateL,fontSize:13}}>Aucun membre enregistre</div>
        )}
        {ROLES.map(r => {
          const members = (crew||[]).filter(m=>m.role===r);
          if (members.length===0) return null;
          return (
            <div key={r}>
              <div style={{padding:"6px 14px",background:roleBg(r),fontSize:9,fontWeight:800,color:roleColor(r),textTransform:"uppercase",letterSpacing:"0.1em"}}>
                {r==="TRI"?"Type Rating Instructors":r==="CM1"?"Commandants de bord":r==="CM2"?"Officiers Pilotes de Ligne":"Hotesses / Stewards"}
              </div>
              {members.map((m,i)=>(
                <div key={m.id} style={{display:"flex",alignItems:"center",padding:"10px 14px",borderBottom:"1px solid "+C.border,gap:10}}>
                  <div style={{width:34,height:34,borderRadius:"50%",background:roleBg(r),flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:13,color:roleColor(r)}}>
                    {m.prenom[0]}{m.nom[0]}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                      <span style={{fontWeight:700,fontSize:13,color:C.text}}>{m.prenom} {m.nom}</span>
                      {(()=>{
                        const echus=titresEchus(m);
                        if(echus.length) return (
                          <span style={{background:"#DC2626",color:"white",borderRadius:6,padding:"1px 6px",
                            fontSize:8.5,fontWeight:800,whiteSpace:"nowrap"}}>
                            INAPTE — {echus.length} titre{echus.length>1?"s":""} échu{echus.length>1?"s":""}
                          </span>
                        );
                        // Titre le plus proche de l'échéance, tous types confondus
                        const d=m.dates||{};
                        const js=crewItemsFor(m.role).map(i=>joursAvant(d[i.k])).filter(v=>v!==null);
                        if(!js.length) return null;
                        const mn=Math.min(...js);
                        if(mn>90) return null;
                        const st=statutEcheance(new Date(Date.now()+mn*86400000).toISOString().slice(0,10));
                        return (
                          <span style={{background:st.bg,color:st.color,borderRadius:6,padding:"1px 6px",
                            fontSize:8.5,fontWeight:800,whiteSpace:"nowrap"}}>
                            échéance dans {mn} j
                          </span>
                        );
                      })()}
                    </div>
                    <div style={{fontSize:10,color:roleColor(r),fontWeight:600}}>{r==="TRI"?"Type Rating Instructor":r==="CM1"?"Commandant de Bord":r==="CM2"?"Officier Pilote de Ligne":"Hôtesse / Steward"}</div>
                    <div style={{fontSize:10,color:C.slate}}>{m.licence||"—"}</div>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={()=>startEdit(m)}
                      style={{background:C.bg,border:"1px solid "+C.border,borderRadius:7,padding:"5px 10px",fontSize:11,color:C.slate,...TAP}}>
                      ✏
                    </button>
                    <button onClick={()=>remove(m.id)}
                      style={{background:"#FEE2E2",border:"1px solid #DC2626",borderRadius:7,padding:"5px 10px",fontSize:11,color:"#DC2626",...TAP}}>
                      ✕
                    </button>
                  </div>
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function FormMaint({ onSubmit, onResolveMel, maintData, aircraft, saved }) {
  const md=maintData||{};
  const initAc=aircraft&&aircraft.length>0?aircraft[0]:{};
  const [acId,setAcId]=useState(initAc.id||"");
  const [ttaf,setTtaf]=useState(String(initAc.ttaf||""));
  const [cycles,setCycles]=useState(String(initAc.cycles||""));
  const [nextH,setNextH]=useState(String(initAc.nextCheckH||""));
  const [bCheckH,setBCheckH]=useState(String(initAc.bCheckH||""));
  const [cCheckH,setCCheckH]=useState(String(initAc.cCheckH||""));
  const [evtMoteur,setEvtMoteur]=useState(String(initAc.evtMoteur||""));
  const [mels,setMels]=useState(initAc.mels||[]);

  // Reload when aircraft selection changes
  useEffect(()=>{
    const ac=aircraft?.find(a=>a.id===acId)||{};
    setTtaf(String(ac.ttaf||""));
    setCycles(String(ac.cycles||""));
    setNextH(String(ac.nextCheckH||""));
    setBCheckH(String(ac.bCheckH||""));
    setCCheckH(String(ac.cCheckH||""));
    setEvtMoteur(String(ac.evtMoteur||""));
    setMels(ac.mels||[]);
  },[acId]);
  const [showMelForm,setShowMelForm]=useState(false);
  const [editIdx,setEditIdx]=useState(null);
  const [mSys,setMSys]=useState("");
  const [mMel,setMMel]=useState("");
  const [mExp,setMExp]=useState("");
  const [mSev,setMSev]=useState("");
  const [mMotif,setMMotif]=useState("");
  const [mRef,setMRef]=useState("");
  const [showResolve,setShowResolve]=useState(false);
  const [resolveIdx,setResolveIdx]=useState(null);
  const [rDate,setRDate]=useState("");
  const [rTech,setRTech]=useState("");
  const [rAction,setRAction]=useState("");
  const [rOT,setROT]=useState("");
  const [resolveSaved,setResolveSaved]=useState(false);

  const openAdd=()=>{setMSys("");setMMel("");setMExp("");setMSev("");setMMotif("");setMRef("");setEditIdx(null);setShowMelForm(true);};
  const openEdit=(m,i)=>{setMSys(m.sys);setMMel(m.mel);setMExp(m.exp);setMSev(m.sev);setMMotif("");setMRef("");setEditIdx(i);setShowMelForm(true);};
  const saveMel=()=>{
    if(!mSys.trim())return;
    const today=new Date().toLocaleDateString("fr-FR");
    if(editIdx!==null){
      const old=mels[editIdx];
      const newMel={...old,sys:mSys.trim(),mel:mMel.trim(),exp:mExp.trim(),sev:mSev};
      // Record extension if expiry date changed
      if(old.exp!==mExp.trim()&&mExp.trim()){
        const ext={date:today,oldExp:old.exp,newExp:mExp.trim(),motif:mMotif.trim()||"—",ref:mRef.trim()||"—"};
        newMel.extensions=[...(old.extensions||[]),ext];
      }
      setMels(mels.map((m,i)=>i===editIdx?newMel:m));
    } else {
      setMels([...mels,{sys:mSys.trim(),mel:mMel.trim(),exp:mExp.trim(),sev:mSev,extensions:[]}]);
    }
    setShowMelForm(false);
  };
  const deleteMel=i=>setMels(mels.filter((_,idx)=>idx!==i));
  const openResolve=(m,i)=>{
    setResolveIdx(i);setRDate("");setRTech("");setRAction("");setROT("");
    setShowResolve(true);
  };
  const saveResolve=()=>{
    if(!rDate.trim()||!rTech.trim()||!rAction.trim()||!rOT.trim()){
      uiAlert("Tous les champs sont obligatoires");return;
    }
    const ac=aircraft?.find(a=>a.id===acId)||aircraft?.[0];
    const mel=mels[resolveIdx];
    const resolved={
      ...mel,
      acId, acImmat:ac?.immat||"",
      dateResolution:rDate.trim(),
      technicien:rTech.trim().toUpperCase(),
      action:rAction.trim().toUpperCase(),
      ot:rOT.trim().toUpperCase(),
      resolvedAt:new Date().toISOString(),
    };
    // Add to melHist via onSubmit signal
    const newMels=mels.filter((_,idx)=>idx!==resolveIdx);
    setMels(newMels);
    setResolveSaved(true);
    setTimeout(()=>{setResolveSaved(false);setShowResolve(false);},2000);
    // Pass resolved MEL to parent via onSubmit
    if(onResolveMel) onResolveMel(resolved);
  };
  const sevColor=s=>s==="A"?"#DC2626":s==="B"?"#D97706":"#64748B";
  const sevBg=s=>s==="A"?"#FEE2E2":s==="B"?"#FEF3C7":"#F1F5F9";
  const isMelExpired=m=>{if(!m.exp)return false;const p=m.exp.split("/");if(p.length!==3)return false;const d=new Date(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));const t=new Date();t.setHours(0,0,0,0);return d<t;};

  const submit=async()=>{
    // Compteurs : jamais négatifs, et le TTAF ne recule pas sans raison
    const nums={"TTAF":ttaf,"Cycles":cycles,"Prochaine visite":nextH,"B-Check":bCheckH,"C-Check":cCheckH};
    const neg=Object.entries(nums).filter(([,v])=>v!==""&&v!==undefined&&Number(v)<0).map(([k])=>k);
    if(neg.length){ uiAlert("⚠️ Valeur négative refusée : "+neg.join(", ")+"."); return; }
    const acCur=(aircraft||[]).find(a=>a.id===acId);
    if(acCur && Number(ttaf)>0 && Number(ttaf)<Number(acCur.ttaf||0)){
      if(!(await uiConfirm("⚠️ Le TTAF saisi ("+ttaf+" h) est inférieur au TTAF actuel de "+acCur.immat+" ("+acCur.ttaf+" h).\n\nConfirmer cette correction ?"))) return;
    }
    const volsDone=Number(md.volsDone||0);
    const evt=Number(evtMoteur)||0;
    const fiabCalc=volsDone>0?Math.round(((volsDone-evt)/volsDone)*1000)/10:0;
    onSubmit({acId,ttaf:Number(ttaf)||0,cycles:Number(cycles)||0,melCount:mels.length,nextCheckH:Number(nextH)||0,
      bCheckH:Number(bCheckH)||0,cCheckH:Number(cCheckH)||0,
      evtMoteur:evt,fiabMoteurs:fiabCalc,mels});
  };

  return (
    <Card accent="#00936A">
      <FHeader icon="🔧" title="Maintenance CAMO" subtitle="Rapport hebdomadaire CAMO" color="#00936A"/>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        {aircraft&&aircraft.length>0&&(
          <div>
            <FLabel>Avion</FLabel>
            <CustomSelect value={acId} onChange={setAcId} placeholder='-- Choisir un avion --' icon='🛩'
              options={(aircraft||[]).map(a=>({value:a.id,label:a.immat+' · '+a.type,sub:'TTAF '+(a.ttaf||0).toFixed(1)+'h · '+a.sieges+' sièges'}))}/>
          </div>
        )}
        <FSection title="Cellule" color="#00936A"/>
        <FGrid>
          <FField label="TTAF (heures)" value={ttaf} onChange={setTtaf} type="number" min={0} step={0.1}/>
          <FField label="Cycles" value={cycles} onChange={setCycles} type="number" min={0} step={1}/>
        </FGrid>
        <FSection title="Visites périodiques" color="#00936A"/>
        <FGrid>
          <FField label="A-Check dans (h)" value={nextH} onChange={setNextH} type="number" min={0}/>
          <FCalc label="Statut A-Check" value={!nextH||nextH==="0"?"--":Number(nextH)<50?"URGENT":Number(nextH)<100?"Proche":"OK"} color={!nextH||nextH==="0"?C.slate:Number(nextH)<50?C.danger:Number(nextH)<100?C.warn:C.emerald}/>
        </FGrid>
        <FGrid>
          <FField label="B-Check dans (h)" value={bCheckH} onChange={setBCheckH} type="number" min={0}/>
          <FCalc label="Statut B-Check" value={!bCheckH||bCheckH==="0"?"--":Number(bCheckH)<100?"URGENT":Number(bCheckH)<300?"Proche":"OK"} color={!bCheckH||bCheckH==="0"?C.slate:Number(bCheckH)<100?C.danger:Number(bCheckH)<300?C.warn:C.emerald}/>
        </FGrid>
        <FGrid>
          <FField label="C-Check dans (h)" value={cCheckH} onChange={setCCheckH} type="number" min={0}/>
          <FCalc label="Statut C-Check" value={!cCheckH||cCheckH==="0"?"--":Number(cCheckH)<200?"URGENT":Number(cCheckH)<500?"Proche":"OK"} color={!cCheckH||cCheckH==="0"?C.slate:Number(cCheckH)<200?C.danger:Number(cCheckH)<500?C.warn:C.emerald}/>
        </FGrid>
        <FSection title="Fiabilite" color="#00936A"/>
        <FGrid>
          <FField label="Evenements moteur" value={evtMoteur} onChange={setEvtMoteur} type="number" min={0}/>
          <FCalc label="Fiabilite calculee"
            value={(()=>{
              const v=Number(md.volsDone||0);
              const e=Number(evtMoteur)||0;
              return v>0?(Math.round(((v-e)/v)*1000)/10)+"%":"--";
            })()}
            color={(()=>{
              const v=Number(md.volsDone||0);
              const e=Number(evtMoteur)||0;
              const f=v>0?((v-e)/v)*100:100;
              return f>=99.5?C.emerald:f>=98?C.warn:C.danger;
            })()}
          />
        </FGrid>
        <FSection title={"MEL actifs ("+mels.length+")"} color="#00936A"/>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {mels.length===0&&<div style={{textAlign:"center",color:C.slateL,fontSize:12,padding:"8px 0"}}>Aucun MEL — appuyez sur + pour ajouter</div>}
          {mels.map((m,i)=>(
            <div key={i} style={{background:isMelExpired(m)?"#DC2626":C.bg,border:isMelExpired(m)?"1.5px solid #DC2626":"1.5px solid transparent",borderRadius:10,padding:"10px 12px",display:"flex",gap:10,alignItems:"center"}}>
              <span style={{background:sevBg(m.sev),color:sevColor(m.sev),padding:"2px 8px",borderRadius:8,fontSize:10,fontWeight:700,flexShrink:0}}>Cat.{m.sev}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:600,color:isMelExpired(m)?"white":C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.sys}</div>
                <div style={{fontSize:10,color:isMelExpired(m)?"rgba(255,255,255,0.8)":C.slate}}>{m.mel}{m.exp?" · Exp: "+m.exp:""}{isMelExpired(m)&&<span style={{fontWeight:700}}> ⚠️ EXPIRÉ</span>}</div>
              </div>
              <div style={{display:"flex",gap:6,flexShrink:0}}>
                <button onClick={()=>openEdit(m,i)}
                  style={{width:36,height:36,background:"white",border:"1.5px solid "+C.border,borderRadius:8,fontSize:16,cursor:"pointer",color:C.slate,...NOTAP,display:"flex",alignItems:"center",justifyContent:"center"}}>
                  ✏
                </button>
                <button onClick={()=>openResolve(m,i)}
                  style={{width:36,height:36,background:"#00936A",border:"none",borderRadius:8,fontSize:16,fontWeight:700,color:"white",...TAP,display:"flex",alignItems:"center",justifyContent:"center"}}>
                  ✓
                </button>
              </div>
            </div>
          ))}
          <button onClick={openAdd}
            style={{height:42,background:"white",border:"1.5px dashed #00936A",borderRadius:10,color:"#00936A",fontSize:13,fontWeight:700,...TAP}}>
            + Ajouter un MEL
          </button>
        </div>

        <FSubmit label="Enregistrer Maintenance" onClick={submit} saved={saved}/>
      </div>

      {showResolve&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:300,display:"flex",alignItems:"flex-end"}}>
          <div style={{background:"white",width:"100%",borderRadius:"16px 16px 0 0",padding:"20px 16px 32px",maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{fontWeight:800,fontSize:16,color:C.navy,marginBottom:4}}>Résolution MEL</div>
            <div style={{fontSize:12,color:C.slate,marginBottom:16}}>{mels[resolveIdx]?.sys||""}</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {[["DATE DE RÉSOLUTION",rDate,setRDate,"text","JJ/MM/AAAA"],
                ["TECHNICIEN",rTech,setRTech,"text","NOM PRÉNOM"],
                ["ACTION EFFECTUÉE",rAction,setRAction,"text","DESCRIPTION DES TRAVAUX"],
                ["N° ORDRE DE TRAVAIL",rOT,setROT,"text","OT-XXXXX"]
              ].map(([lbl,val,setter,type,ph])=>(
                <div key={lbl}>
                  <div style={{fontSize:11,fontWeight:700,color:C.slate,marginBottom:4}}>{lbl} *</div>
                  <input value={val} onChange={e=>setter(e.target.value.toUpperCase())}
                    placeholder={ph} autoComplete="off"
                    style={{width:"100%",height:44,background:C.bg,border:"1.5px solid "+C.border,borderRadius:10,padding:"0 12px",fontSize:13,outline:"none",boxSizing:"border-box"}}/>
                </div>
              ))}
              <div style={{display:"flex",gap:10,marginTop:6}}>
                <button onClick={()=>setShowResolve(false)}
                  style={{flex:1,height:46,background:"white",border:"1.5px solid "+C.border,borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",color:C.slate}}>
                  Annuler
                </button>
                <button onClick={saveResolve}
                  style={{flex:2,height:46,background:resolveSaved?"#00936A":"#DC2626",border:"none",borderRadius:10,fontSize:14,fontWeight:700,color:"white",cursor:"pointer",transition:"background 0.3s"}}>
                  {resolveSaved?"✅ Enregistré":"✓ Confirmer résolution"}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
      {showMelForm&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:300,display:"flex",alignItems:"flex-end"}}>
          <div style={{background:"white",width:"100%",borderRadius:"16px 16px 0 0",padding:"20px 16px 32px"}}>
            <div style={{fontWeight:800,fontSize:16,color:C.navy,marginBottom:16}}>{editIdx!==null?"Modifier MEL":"Nouveau MEL"}</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <div>
                <div style={{fontSize:11,fontWeight:700,color:C.slate,marginBottom:4}}>SYSTÈME</div>
                <input value={mSys} onChange={e=>setMSys(e.target.value)}
                  style={{width:"100%",height:44,background:C.bg,border:"1.5px solid "+C.border,borderRadius:10,padding:"0 12px",fontSize:13,outline:"none"}}/>
              </div>
              <div>
                <div style={{fontSize:11,fontWeight:700,color:C.slate,marginBottom:4}}>RÉFÉRENCE MEL</div>
                <input value={mMel} onChange={e=>setMMel(e.target.value)}
                  style={{width:"100%",height:44,background:C.bg,border:"1.5px solid "+C.border,borderRadius:10,padding:"0 12px",fontSize:13,outline:"none"}}/>
              </div>

const SGS_ROLE_L={TRI:'TRI — instructeur',CM1:'CDB',CM2:'OPL',CC:'CC'};

const SGS_CREW_ROLES={cdb:['CM1','TRI'],opl:['CM1','CM2','TRI'],pnc:['CC'],tous:['TRI','CM1','CM2','CC']};
function sgsCrewOpts(crew, kind, cur){
  const L=(crew||[]).filter(m=>SGS_CREW_ROLES[kind].includes(m.role)).map(m=>({value:sgsCrewNom(m),label:sgsCrewNom(m),
    sub:SGS_ROLE_L[m.role]+(typeof titresEchus==='function'&&titresEchus(m).length?' · ⛔ INAPTE — titre échu':'')}));
  // Nom déjà enregistré sur un ancien compte rendu mais absent du registre : conservé, non modifiable à la main
  if(cur&&!L.some(o=>o.value===cur)) L.unshift({value:cur,label:cur,sub:'Nom enregistré, absent du registre Équipage'});
  return L;
}
const sgsCrewRole=(crew,nom)=>{ const m=(crew||[]).find(x=>sgsCrewNom(x)===nom); return m?SGS_ROLE_L[m.role]:''; };

// CRTSV : au-delà d'une heure, copie à la DAC au plus tard 28 jours après l'événement (SMS-17)
const sgsDureeMin=s=>{ const m=String(s||'').trim().match(/^(\d{1,2})(?:[h:](\d{1,2}))?/); return m?Number(m[1])*60+Number(m[2]||0):0; };
const sgsCrtsvDac=e=>e&&e.form==='SMS-17'&&sgsDureeMin((e.fx||{}).duree)>60;
function SgsAssessment({ rows, setRows, risk, setRisk }){

  const inp={width:"100%",boxSizing:"border-box",background:C.bg,border:"1.5px solid "+C.border,borderRadius:8,padding:"7px 9px",fontSize:12.5,fontFamily:"inherit",outline:"none"};
  const set=(i,p)=>setRows(R.map((r,k)=>k===i?{...r,...p}:r));
  const r1=sgsRisque(risk.P,risk.G), r2=sgsRisque(risk.P2,risk.G2);

      {[['hazard','Danger (hazard)'],['comp','Composant spécifique'],['cons','Conséquence'],['mit','Mesure de maîtrise / atténuation']].map(([k,l])=>

      {R.length>1&&<button onClick={()=>setRows(R.filter((_,k)=>k!==i))} style={{gridColumn:"1/3",border:"none",background:"none",color:C.slate,fontSize:11.5,textAlign:"right",...TAP}}>Retirer cette ligne</button>}
    </div>)}
    <button onClick={()=>setRows([...R,{hazard:'',comp:'',cons:'',mit:''}])} style={{height:36,borderRadius:9,border:"1.5px dashed "+C.border,background:"white",color:C.slate,fontWeight:700,fontSize:12,...TAP}}>+ Ajouter un danger</button>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <div><div style={{fontSize:10.5,fontWeight:700,color:C.slate,marginBottom:4}}>Risque</div><SgsMatrice P={risk.P} G={risk.G} onPick={(P,G)=>setRisk({...risk,P,G})} small/>
        {r1&&<div style={{marginTop:4}}><SgsBadge r={r1}/></div>}</div>
      <div><div style={{fontSize:10.5,fontWeight:700,color:C.slate,marginBottom:4}}>Risque résiduel</div><SgsMatrice P={risk.P2} G={risk.G2} onPick={(P2,G2)=>setRisk({...risk,P2,G2})} small/>

function FormSafety({ onSubmit, flights, aircraft, crew, saved, profil }) {
  // Équipage : seuls les formulaires qui le concernent ; le SGS et l'Administrateur les ont tous
  const FORMS_EQP=["SMS-19","SMS-09","SMS-13","SMS-16","SMS-17"];
  const FORMS_VUS=profil==="eqp"?SGS_CR_FORMS.filter(f=>FORMS_EQP.includes(f.k)):SGS_CR_FORMS;
  const now=new Date();
  const today=now.toISOString().slice(0,10);

  // Rattachement : à un vol, à un appareil seul, ou hors vol (sol, fret…)
  const [mode,setMode]=useState("vol");
  const [volNum,setVolNum]=useState("");
  const [acId,setAcId]=useState("");
  const [dateEv,setDateEv]=useState(today);
  const [secuPeriod,setSecuPeriod]=useState("Tout");   // un rapport papier peut arriver tard : tous les vols par défaut
  const [secuSearch,setSecuSearch]=useState("");
  // Événements cochés, précision passager, description, confidentialité
  const [sel,setSel]=useState(()=>{ try{ const p=sessionStorage.getItem("sgs_cr_preset"); const d=p&&SGS_CR_BY[p]; if(d&&d.auto){ const n={}; d.auto.forEach(a=>n[a]=true); return n; } }catch(_e){ logSilent(_e); } return {}; });
  const [unrulyType,setUnrulyType]=useState("");
  const [desc,setDesc]=useState("");
  const [conf,setConf]=useState(false);
  const [anon,setAnon]=useState(false);
  // Anonyme : noms, vol et date exacte ne sont pas enregistrés (seul le mois est conservé).
  // Masquer à l'écran ne suffirait pas : le vol permettrait de retrouver l'équipage.
  const ANON_FX=["nomCdb","nomOpl","nomCc","nomPnc","roleCdb","roleOpl","depart","arrivee"];
  useEffect(()=>{ if(!anon) return; setRedac(""); setMode("hors"); setVolNum(""); setAcId("");
    setFx(o=>{ const n={...o}; ANON_FX.forEach(k=>delete n[k]); return n; }); },[anon]);
  const [open,setOpen]=useState({FLT:true});
  // Formulaire officiel et ses champs (Manuel SGS 05-01)
  // Formulaire choisi depuis « Formulaires SMS » : présélectionné à l'ouverture
  const [form,setForm]=useState(()=>{ try{ const p=sessionStorage.getItem("sgs_cr_preset"); if(p&&SGS_CR_BY[p]){ sessionStorage.removeItem("sgs_cr_preset"); return p; } }catch(_e){ logSilent(_e); } return "SMS-19"; });
  const [fx,setFx]=useState({});
  const [titre,setTitre]=useState(""), [redac,setRedac]=useState(""), [motif,setMotif]=useState("evenement"), [enquete,setEnquete]=useState(false);
  const [assess,setAssess]=useState([]), [risk,setRisk]=useState({});
  const FD=SGS_CR_BY[form];
  // Compte rendu rattaché à un vol : équipage du vol proposé d'office (reste modifiable)
  useEffect(()=>{ if(mode!=="vol"||!volNum) return; const [n,d]=volNum.split("|"); const fl=(flights||[]).find(x=>x.num===n&&x.date===d); if(!fl) return;
    const ac=(aircraft||[]).find(a=>a.id===fl.acId||a.immat===fl.num);
    setFx(o=>({...o,nomCdb:o.nomCdb||fl.cm1||"",nomOpl:o.nomOpl||fl.cm2||"",nomCc:o.nomCc||fl.cc||"",
      immat:o.immat||(ac?ac.immat:fl.num)||"",typeAv:o.typeAv||(ac?ac.type:"")||""})); },[volNum,mode]);
  // Rattachement à un appareil : immatriculation et type repris du registre Avion
  useEffect(()=>{ if(mode!=="appareil"||!acId) return; const ac=(aircraft||[]).find(a=>a.id===acId||a.immat===acId); if(!ac) return;
    setFx(o=>({...o,immat:ac.immat||"",typeAv:ac.type||o.typeAv||""})); },[acId,mode]);
  const pickForm=k=>{ setForm(k); const d=SGS_CR_BY[k]; if(d.auto) setSel(s=>{ const n={...s}; d.auto.forEach(a=>n[a]=true); return n; }); };

  const reset=()=>{ setVolNum(""); setAcId(""); setDateEv(today); setSel({}); setUnrulyType(""); setDesc(""); setConf(false); setAnon(false);
    setFx({}); setTitre(""); setRedac(""); setMotif("evenement"); setEnquete(false); setAssess([]); setRisk({}); if(FD.auto) setSel(()=>{ const n={}; FD.auto.forEach(a=>n[a]=true); return n; }); };
  const toggle=k=>setSel(s=>({...s,[k]:!s[k]}));
  const nbSel=Object.values(sel).filter(Boolean).length;

  const submit=()=>{
    if(mode==="vol" && !volNum){ uiAlert("⚠️ Sélectionnez le vol concerné."); return; }
    if(mode==="appareil" && !acId){ uiAlert("⚠️ Sélectionnez l'appareil concerné."); return; }
    if(mode!=="vol" && !dateEv){ uiAlert("⚠️ Indiquez la date de l'événement."); return; }
    if(mode!=="vol" && dateEv>today){ uiAlert("⚠️ La date de l'événement ne peut pas être dans le futur."); return; }
    if(!titre.trim()){ uiAlert("⚠️ Indiquez le titre de l'événement ("+form+")."); return; }
    const sansNature=FD.danger||motif==="danger"||form==="SMS-16";
    if(!nbSel&&!sansNature){ uiAlert("⚠️ Cochez au moins une nature d'événement."); return; }
    if(form==="SMS-17"&&!sgsDureeMin(fx.duree)){ uiAlert("⚠️ Indiquez la durée de la prolongation ou de la réduction (format h:mm)."); return; }
    if(sel.unruly && !unrulyType){ uiAlert("⚠️ Précisez la suite donnée au passager indiscipliné."); return; }
    let base;
    if(mode==="vol"){
      const parts=volNum.split("|");
      const f=flights.find(x=>x.num===parts[0]&&x.date===parts[1])||flights.find(x=>x.num===parts[0]);
      base={num:parts[0], date:f?.date||today, from:f?.from||"", to:f?.to||""};
    } else if(mode==="appareil"){
      const ac=(aircraft||[]).find(a=>a.id===acId);
      base={num:ac?ac.immat:"", acId, date:dateEv, from:"", to:""};
    } else {
      base={num:"", date:dateEv, from:"", to:""};
    }
    const flags={}; SAFETY_EVENTS.forEach(x=>{ if(sel[x.k]) flags[x.k]=true; });
    onSubmit({
      ...base, ...flags, rattachement:mode,
      ...(sel.unruly?{unrulyType}:{}),
      ...(anon?{num:"",from:"",to:"",acId:undefined,rattachement:"hors",date:String(dateEv||today).slice(0,7)+"-01"}:{}),
      description:desc.trim(), confidentiel:conf, anonyme:anon,
      form, titre:titre.trim(), ...(FD.redac&&!anon?{redacteur:redac.trim()}:{}), ...(FD.motif?{motif}:{}),
      fx:anon?Object.fromEntries(Object.entries(fx).filter(([k])=>!ANON_FX.includes(k))):fx, enquete,
      assess:assess.filter(r=>Object.values(r).some(v=>String(v||'').trim())), risk,
      timestamp:new Date().toISOString()
    });
    reset();
  };

  // Vols terminés proposés, filtrés par période et recherche
  const cutoff=new Date(now);
  if(secuPeriod==="7j") cutoff.setDate(cutoff.getDate()-7);
  else if(secuPeriod==="30j") cutoff.setDate(cutoff.getDate()-30);
  else cutoff.setFullYear(2000);
  cutoff.setHours(0,0,0,0);
  const filteredSecuFlights = flights
    .filter(f=>(f.status==="Termine"||f.status==="En vol")&&f.date&&new Date(f.date)>=cutoff)
    .filter(f=>{
      const q=secuSearch.trim().toUpperCase();
      if(!q) return true;
      const dateFull=f.date?f.date.slice(8)+"/"+f.date.slice(5,7)+"/"+f.date.slice(0,4):"";
      return q.split(/\s+/).every(t=>(f.num||"").toUpperCase().includes(t)||dateFull.includes(t));
    })
    .sort((a,b)=>b.date.localeCompare(a.date));

  const Seg=({v,l})=>(
    <button onClick={()=>setMode(v)}
      style={{flex:1,height:38,borderRadius:9,fontSize:12,fontWeight:700,...TAP,
        border:"1.5px solid "+(mode===v?C.navy:C.border),background:mode===v?C.navy:"white",color:mode===v?"white":C.slate}}>{l}</button>
  );
  const Box=({on,color,onClick,children})=>(
    <div onClick={onClick}
      style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",background:on?color+"12":"white",
        border:"1.5px solid "+(on?color:C.border),borderRadius:10,...TAP}}>
      <div style={{width:20,height:20,marginTop:1,borderRadius:5,border:"2px solid "+(on?color:C.border),background:on?color:"white",
        display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
        {on&&<span style={{color:"white",fontSize:13,fontWeight:800}}>✓</span>}
      </div>
      <div style={{flex:1,minWidth:0}}>{children}</div>
    </div>
  );

  return (
    <Card accent="#DC2626">
      <FHeader icon="🛡" title={FD.l} subtitle={"Formulaire ENR/SGS-FOR/"+FD.k+" — Manuel SGS 05-01"} color="#DC2626"/>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>

        <FSection title="Rattachement" color="#DC2626"/>
        <div style={{display:"flex",gap:6}}>
          <Seg v="vol" l="Vol"/><Seg v="appareil" l="Appareil"/><Seg v="hors" l="Hors vol"/>
        </div>

        {mode==="vol"&&(<>
          <div style={{display:"flex",gap:6}}>
            {["7j","30j","Tout"].map(p=>(
              <button key={p} onClick={()=>{setSecuPeriod(p);setVolNum("");}}
                style={{padding:"6px 14px",borderRadius:8,border:"1px solid "+C.border,fontSize:11,fontWeight:600,cursor:"pointer",
                  background:secuPeriod===p?C.navy:"white",color:secuPeriod===p?"white":C.slate}}>{p}</button>
            ))}
          </div>
          <input value={secuSearch} onChange={e=>setSecuSearch(e.target.value)} placeholder="🔍  CN-KTA  /  30/06/2026"
            style={{width:"100%",height:42,borderRadius:10,border:"1.5px solid "+C.border,padding:"0 14px",fontSize:13,outline:"none",background:C.bg,color:C.text,boxSizing:"border-box"}}/>
          <CustomSelect value={volNum} onChange={setVolNum} placeholder={'-- Sélectionner un vol ('+filteredSecuFlights.length+') --'} icon='✈️' searchable
