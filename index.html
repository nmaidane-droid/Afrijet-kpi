// ── Connexion vérifiée par le serveur (lot S1) ──
// La page envoie le nom, le mot de passe puis le code ; le serveur vérifie et renvoie un jeton
// de session signé, valable 12 h. Si le serveur n'est pas joignable — fichier ouvert seul, ou
// profil encore à mot de passe partagé — on revient au fonctionnement précédent.
const SESSION_KEY=PFX+"session_token";
async function authApi(action, body){
  try{
    const r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,...body})});
    if(r.status===404) return null;
    const j=await r.json().catch(()=>({}));
    return {status:r.status, ...j};
  }catch(e){ logSilent(e); return null; }
}
const sessionToken=()=>{ try{ return sessionStorage.getItem(SESSION_KEY)||""; }catch(e){ return ""; } };
const sessionSet=t=>{ try{ t?sessionStorage.setItem(SESSION_KEY,t):sessionStorage.removeItem(SESSION_KEY); }catch(e){ logSilent(e); } };
// ── Limitation des tentatives de connexion ──
// 3 et 4 échecs : 30 s d'attente ; 5 échecs : blocage 15 min (journalisé). Réussite : compteur remis à zéro.
// Compteur dans Supabase (clé auth_locks), par compte (« u:<id> ») ou par profil à mot de passe partagé (« p:<profil> »).
const LOCK_KEY=PFX+"auth_locks";
const LOCK_RULE={delayAfter:3,delayS:30,lockAfter:5,lockMin:15};
async function locksAll(){ const r=await sbGet(LOCK_KEY); if(r&&typeof r==="object"){ try{ localStorage.setItem(LOCK_KEY+"_c",JSON.stringify(r)); }catch(_e){ logSilent(_e); } return r; }
  try{ return JSON.parse(localStorage.getItem(LOCK_KEY+"_c")||"{}")||{}; }catch(_e){ return {}; } }
async function lockSet(id,v){ const L={...(await locksAll())}; if(v) L[id]=v; else delete L[id]; await sbSet(LOCK_KEY,L); try{ localStorage.setItem(LOCK_KEY+"_c",JSON.stringify(L)); }catch(_e){ logSilent(_e); } }
async function authWait(id){ const s=(await locksAll())[id]||{}; return Math.max(0,(s.until||0)-Date.now()); }
async function authFail(id,label){
  const s=(await locksAll())[id]||{}; const fails=(s.fails||0)+1; let until=0;
  if(fails>=LOCK_RULE.lockAfter) until=Date.now()+LOCK_RULE.lockMin*60000; else if(fails>=LOCK_RULE.delayAfter) until=Date.now()+LOCK_RULE.delayS*1000;
  await lockSet(id,{fails,until,last:new Date().toISOString(),label});
  if(fails===LOCK_RULE.lockAfter) auditLog("connexion",label,"blocage après "+fails+" échecs",{duree:[null,LOCK_RULE.lockMin+" min"]});
  return {fails,until};
}
async function authOk(id){ const s=(await locksAll())[id]; if(s) await lockSet(id,null); }
const fmtWait=ms=>{ const s=Math.ceil(ms/1000); return s>=60?Math.floor(s/60)+" min "+String(s%60).padStart(2,"0")+" s":s+" s"; };
const failMsg=(r,base)=>r.until?(r.fails>=LOCK_RULE.lockAfter?"Trop d'essais : accès bloqué "+LOCK_RULE.lockMin+" minutes.":"Trop d'essais : patientez "+LOCK_RULE.delayS+" secondes."):base+(r.fails>=1?" ("+(LOCK_RULE.delayAfter-r.fails)+" essai(s) avant un délai)":"");
// Compte à rebours affiché tant que l'attente court
function useCountdown(){ const [until,setUntil]=useState(0), [,tick]=useState(0);
  useEffect(()=>{ if(until<=Date.now()) return; const t=setInterval(()=>{ tick(x=>x+1); if(until<=Date.now()) clearInterval(t); },1000); return ()=>clearInterval(t); },[until]);
  return [Math.max(0,until-Date.now()),setUntil]; }

// ══ Journal d'audit (lot 2) ═════════════════════════════════════════
// Chaque modification locale d'un registre est comparée à l'état précédent ; les champs changés
// sont notés avec leur valeur avant et après, avec la personne connectée. Les entrées partent,
// dans l'ordre, vers la fonction Supabase audit_append (horodatage serveur, chaînage SHA-256,
// table inaltérable). Sans réseau, elles attendent dans une file locale.
const AUDIT_QKEY=PFX+"audit_queue";
const AUDIT_SKIP=/demo|backup|lastBackup|pref|draft|filter|period|users|totp|audit|alertHist|dismissed|kpis/i;   // réglages, calculs et alertes automatiques : non journalisés
let AUDIT_SYSTEM=0;   // > 0 : opérations automatiques (corrections, démonstration), attribuées au « système »
function auditAsSystem(fn){ AUDIT_SYSTEM++; try{ return fn(); } finally { AUDIT_SYSTEM--; } }
function auditDevice(){ try{ const u=navigator.userAgent||""; return (/iPhone|iPad/.test(u)?"iOS":/Android/.test(u)?"Android":/Windows/.test(u)?"Windows":/Mac/.test(u)?"Mac":"Autre")+(window.innerWidth<700?" · téléphone":" · grand écran"); }catch(_e){ return ""; } }
function auditQueueGet(){ try{ return JSON.parse(localStorage.getItem(AUDIT_QKEY)||"[]"); }catch(_e){ return []; } }
function auditQueueSet(q){ try{ localStorage.setItem(AUDIT_QKEY,JSON.stringify(q.slice(-5000))); }catch(_e){ logSilent(_e); } }
let AUDIT_FLUSHING=false;
async function auditFlush(){
  if(AUDIT_FLUSHING) return; AUDIT_FLUSHING=true;
  try{
    // Session ouverte : le serveur inscrit l'entrée sous l'identité qu'il a vérifiée
    const t=sessionToken();
    if(t){
      let q=auditQueueGet();
      while(q.length){
        const lot=q.slice(0,50);
        const r=await fetch("/api/journal",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t,entries:lot})});
        if(r.status===404) break;                       // serveur absent : on garde la file
        const j=await r.json().catch(()=>({}));
        if(!r.ok){ SYNC.auditError=j.error||("erreur "+r.status); break; }
        const n=j.ecrites||lot.length;
        q=auditQueueGet(); q.splice(0,n); auditQueueSet(q); SYNC.auditError=null;
      }
      if(!auditQueueGet().length){ AUDIT_FLUSHING=false; return; }
    }
    // Sans session serveur : ancien fonctionnement
    if(!supabase){ AUDIT_FLUSHING=false; return; }
    let q=auditQueueGet();
    while(q.length){ const {error}=await supabase.rpc("audit_append",{p:q[0]}); if(error){ SYNC.auditError=error.message||String(error); break; }
      q=auditQueueGet(); q.shift(); auditQueueSet(q); SYNC.auditError=null; }
  }catch(e){ SYNC.auditError=e.message||String(e); } finally { AUDIT_FLUSHING=false; }
}
if(typeof window!=="undefined"){ window.addEventListener("online",()=>auditFlush()); setInterval(()=>{ if(auditQueueGet().length) auditFlush(); },15000); }
function auditLog(module, objet, action, changes){
  const u=AUDIT_SYSTEM?null:(typeof sgsCurrentUser==="function"?sgsCurrentUser():null);

async function auditFetch({ since, user, module, objet, objets, offset=0, limit=100 }={}){
  if(!supabase) return {rows:[],count:0,error:"Supabase indisponible (hors ligne)"};
  try{ let q=supabase.from("audit_log").select("*",{count:"exact"}).order("id",{ascending:false}).range(offset,offset+limit-1);
    if(since) q=q.gte("ts",since); if(user) q=q.eq("user_label",user); if(module) q=q.eq("module",module);
    if(objets&&objets.length) q=q.in("objet",objets); else if(objet) q=q.ilike("objet","%"+objet+"%");
    const {data,error,count}=await q; if(error) return {rows:[],count:0,error:error.message};
    return {rows:data||[],count:count||0};
  }catch(e){ return {rows:[],count:0,error:e.message||String(e)}; }
}

function AuditHistory({ refs, v }){
  const [st,setSt]=useState({rows:null});
  const key=(refs||[]).join('|');
  // Rechargé quand la fiche change (v) ; les entrées de cet appareil pas encore envoyées sont montrées aussitôt
  useEffect(()=>{ let alive=true;
    const t=setTimeout(()=>auditFetch({objets:refs,limit:50}).then(r=>{ if(!alive) return;
      const seen=new Set((r.rows||[]).map(e=>e.client_ts+'|'+e.objet+'|'+e.action));
      const pend=auditQueueGet().filter(e=>(refs||[]).includes(e.objet)&&!seen.has(e.client_ts+'|'+e.objet+'|'+e.action)).reverse()
        .map((e,i)=>({...e,id:'—',ts:e.client_ts,pending:true,_k:'p'+i}));
      setSt({...r,rows:[...pend,...(r.rows||[])]}); }),v?600:0);
    return ()=>{ alive=false; clearTimeout(t); }; },[key,v]);
  return <div style={{marginTop:14}}>
    <div style={{fontSize:11,fontWeight:700,color:C.slate,textTransform:"uppercase",letterSpacing:".04em",marginBottom:4}}>Historique</div>

}

function auditDiff(key, prev, next){
  if(AUDIT_SKIP.test(key)||prev===next) return;
  try{
    const out=[];
    if(Array.isArray(prev)||Array.isArray(next)){
      const P=new Map((prev||[]).map((o,i)=>[auditId(o,i),o])), N=new Map((next||[]).map((o,i)=>[auditId(o,i),o]));
      N.forEach((o,id)=>{ if(!P.has(id)) out.push([auditName(o)||id,"création",auditFields({},o)]);
        else { const ch=auditFields(P.get(id),o); if(Object.keys(ch).length) out.push([auditName(o)||id,ch.statut&&ch.statut[1]==='"annule"'||(ch.statut&&ch.statut[1]==="annule")?"annulation":ch.statut?"changement de statut":"modification",ch]); } });
      P.forEach((o,id)=>{ if(!N.has(id)) out.push([auditName(o)||id,"suppression",auditFields(o,{})]); });
    } else if(prev&&next&&typeof prev==="object"&&typeof next==="object"){
      const ks=new Set([...Object.keys(prev),...Object.keys(next)]);
      ks.forEach(k=>{ const a=prev[k], b=next[k]; if(JSON.stringify(a)===JSON.stringify(b)) return;
        out.push([k,a==null?"création":b==null?"suppression":"modification",(a&&typeof a==="object")||(b&&typeof b==="object")?auditFields(a||{},b||{}):{valeur:[auditV(a),auditV(b)]}]); });
    } else out.push(["",prev==null?"création":"modification",{valeur:[auditV(prev),auditV(next)]}]);
    if(out.length>40){ auditLog(key,"",'modification en masse',{elements:[null,String(out.length)]}); return; }
    out.forEach(([o,a,c])=>auditLog(key,o,a,c));
  }catch(e){ logSilent(e); }
}

const TOTP_ISSUER = "Afrijet Sahara";
const TOTP_ACCOUNT = "rdoa@afrijet-sahara.ma";

async function generateTotpSecret() {
  const arr = new Uint8Array(20);
  crypto.getRandomValues(arr);
  const base32chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  let secret = "";
  for(let i=0; i<arr.length; i+=5) {
    const b0=arr[i]||0,b1=arr[i+1]||0,b2=arr[i+2]||0,b3=arr[i+3]||0,b4=arr[i+4]||0;
    secret += base32chars[(b0>>3)&31]+base32chars[((b0&7)<<2|(b1>>6))&31]+
              base32chars[(b1>>1)&31]+base32chars[((b1&1)<<4|(b2>>4))&31]+
              base32chars[((b2&15)<<1|(b3>>7))&31]+base32chars[(b3>>2)&31]+
              base32chars[((b3&3)<<3|(b4>>5))&31]+base32chars[b4&31];
  }
  return secret;
}

function base32Decode(encoded) {
  const base32chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  encoded = encoded.toUpperCase().replace(/=+$/, "");
  let bits = 0, val = 0;
  const output = [];
  for(let i=0; i<encoded.length; i++) {
    val = (val<<5) | base32chars.indexOf(encoded[i]);
    bits += 5;
    if(bits>=8) { output.push((val>>(bits-8))&255); bits-=8; }
  }
  return new Uint8Array(output);
}

async function computeTotp(secret, timeStep) {
  const key = base32Decode(secret);
  const counter = Math.floor(timeStep/30);
  const counterBytes = new Uint8Array(8);
  for(let i=7; i>=0; i--) { counterBytes[i]=counter&255; const c=counter>>8; }
  // Write counter properly
  let c = Math.floor(timeStep/30);
  for(let i=7; i>=0; i--) { counterBytes[i]=c&0xff; c=Math.floor(c/256); }
  const cryptoKey = await crypto.subtle.importKey("raw",key,{name:"HMAC",hash:"SHA-1"},false,["sign"]);
  const sig = await crypto.subtle.sign("HMAC", cryptoKey, counterBytes);
  const hmac = new Uint8Array(sig);
  const offset = hmac[19]&0xf;
  const code = ((hmac[offset]&0x7f)<<24|(hmac[offset+1]&0xff)<<16|(hmac[offset+2]&0xff)<<8|(hmac[offset+3]&0xff)) % 1000000;
  return String(code).padStart(6,"0");
}

async function verifyTotp(secret, userCode) {
  const now = Date.now()/1000;
  for(let delta=-1; delta<=1; delta++) {
    const code = await computeTotp(secret, now+delta*30);
    if(code===userCode) return true;
  }
  return false;
}

  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+s+' '+s+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>'); }
// Libellé du compte dans Microsoft Authenticator, propre à chaque profil (auparavant identique pour tous)
const TOTP_ACCOUNTS={dir:"Direction",rdoa:"Administrateur",sgs:"SGS"};
function TotpSetup({ secret, onVerified, profileId, account:accountLabel }) {
  const [code,setCode]=useState("");
  const [err,setErr]=useState("");
  const [copied,setCopied]=useState(false);
  const account=accountLabel?accountLabel+" ("+((PROFILES.find(p=>p.id===profileId)||{}).label||"")+")":(TOTP_ACCOUNTS[profileId]||"Afrijet")+"@afrijet-sahara.ma";
  const qr=`otpauth://totp/${encodeURIComponent(TOTP_ISSUER)}:${encodeURIComponent(account)}?secret=${secret}&issuer=${encodeURIComponent(TOTP_ISSUER)}&algorithm=SHA1&digits=6&period=30`;
  const qrUrl=qrSvgDataUrl(qr);   // fabriqué sur l'appareil : aucun service extérieur, la clé ne sort pas
  const keyShown=String(secret||"").replace(/(.{4})/g,"$1 ").trim();
  const copy=async()=>{ try{ await navigator.clipboard.writeText(secret); setCopied(true); setTimeout(()=>setCopied(false),2500); }catch(e){ logSilent(e); } };
  const verify=async()=>{
    if(code.length!==6){setErr("Code à 6 chiffres requis");return;}
    if(await verifyTotp(secret,code)){
      onVerified();
    } else {
      setErr("Code incorrect. Vérifiez que l'heure du téléphone est réglée automatiquement.");
      setCode("");
    }
  };
  const step={fontSize:11.5,color:"#475569",textAlign:"left",lineHeight:1.45};
  return (
    <div style={{textAlign:"center"}}>
      <div style={{fontWeight:700,fontSize:14,color:"#0F1F3D",marginBottom:4}}>Activer Microsoft Authenticator</div>
      <div style={{fontSize:11,color:"#64748B",marginBottom:12}}>Compte : <b>{account}</b></div>
      <div style={{...step,background:"#F1F5F9",borderRadius:10,padding:"9px 11px",marginBottom:10}}>
        <b>Sur PC</b> ou sur un autre appareil : ouvrez Authenticator sur votre téléphone, touchez « + », « Autre compte », puis scannez ce QR code.</div>
      <img src={qrUrl} style={{width:160,height:160,borderRadius:8,marginBottom:10}} alt="QR code d'activation"/>
      <div style={{...step,background:"#F1F5F9",borderRadius:10,padding:"9px 11px",marginBottom:8}}>
        <b>Sur le téléphone qui porte Authenticator</b> : touchez le bouton ci-dessous. Sinon, dans Authenticator, choisissez « Entrer le code manuellement » et recopiez la clé.</div>
      <a href={qr} style={{display:"block",height:44,lineHeight:"44px",background:"#0369A1",color:"#fff",borderRadius:10,fontSize:13.5,fontWeight:700,textDecoration:"none",marginBottom:8}}>Ouvrir dans Authenticator</a>
      <div role="button" onClick={copy} style={{fontFamily:"monospace",fontSize:13.5,letterSpacing:1,background:"#fff",border:"1.5px dashed #94A3B8",borderRadius:10,padding:"8px 10px",marginBottom:4,wordBreak:"break-all",cursor:"pointer"}}>{keyShown}</div>
      <div style={{fontSize:10.5,color:copied?"#047857":"#64748B",marginBottom:12}}>{copied?"Clé copiée":"Touchez la clé pour la copier · type : basé sur l'heure"}</div>
      <input value={code} onChange={e=>setCode(e.target.value.replace(/\D/g,"").slice(0,6))} placeholder="Code à 6 chiffres" inputMode="numeric"
        onKeyDown={e=>e.key==="Enter"&&verify()}
        style={{width:"100%",height:46,boxSizing:"border-box",border:"1.5px solid #CBD5E1",borderRadius:10,padding:"0 14px",fontSize:18,letterSpacing:8,outline:"none",marginBottom:8,textAlign:"center"}}/>
      {err&&<div style={{color:"#DC2626",fontSize:12,marginBottom:8}}>{err}</div>}
      <button onClick={verify}
        style={{width:"100%",height:46,background:"#0F1F3D",color:"#fff",border:"none",borderRadius:10,fontSize:14,fontWeight:600,cursor:"pointer"}}>
        Confirmer
      </button>
      <div style={{fontSize:10.5,color:"#64748B",marginTop:10,lineHeight:1.4}}>Une seule activation suffit : le même Authenticator sert ensuite pour se connecter depuis le téléphone comme depuis un PC.</div>
    </div>
  );
}

function TotpVerify({ profileId, onVerified, storeKey, account, lockId, lockLabel, verifServeur }) {
  const [code,setCode]=useState("");
  const [waitMs,setUntil]=useCountdown();
  const lid=lockId||"p:"+(profileId||"rdoa");
  const fail=async base=>{ const r=await authFail(lid,lockLabel||profileId); if(r.until) setUntil(r.until); setErr(failMsg(r,base)); setCode(""); auditLog("connexion",lockLabel||profileId,"échec de connexion",{motif:[null,"code Authenticator incorrect"]}); };
  const blocked=async()=>{ const w=await authWait(lid); if(w){ setUntil(Date.now()+w); setErr("Trop d'essais : patientez."); return true; } return false; };
  const [err,setErr]=useState("");
  const [addingDevice,setAddingDevice]=useState(false);
  const [newSecret,setNewSecret]=useState("");

  // Ajouter un autre téléphone Authenticator exige d'abord un code valide de celui déjà activé
  const startAddDevice=async()=>{
    if(await blocked()) return;
    if(code.length!==6){ setErr("Pour ajouter un autre téléphone, entrez d'abord le code de votre Authenticator actuel."); return; }
    const stored=await sbGet(storeKey||TOTP_KEY+"_"+(profileId||"rdoa"));
    const secrets=stored?(Array.isArray(stored)?stored:[stored]):[];
    let okc=false; for(const s of secrets){ if(await verifyTotp(s,code)){ okc=true; break; } }
    if(!okc){ await fail("Code incorrect : impossible d'ajouter un autre téléphone."); return; }
    const secret=await generateTotpSecret();
    setNewSecret(secret);
    setAddingDevice(true);
  };

  const handleNewDeviceVerified=async()=>{
    // Add new secret to existing list
    const key=storeKey||TOTP_KEY+"_"+(profileId||"rdoa");
    const existing=await sbGet(key);
    let secrets=[];
    if(existing){
      secrets=Array.isArray(existing)?existing:[existing];
    }
    secrets.push(newSecret);
    await sbSet(key,secrets);
    onVerified();
  };

  if(addingDevice){
    return <TotpSetup secret={newSecret} profileId={profileId} account={account} onVerified={handleNewDeviceVerified}/>;
  }

  const verify=async()=>{
    if(code.length!==6){setErr("Code à 6 chiffres requis");return;}
    // Vérification par le serveur quand la connexion en vient
    if(verifServeur){ const r=await verifServeur(code); if(r&&r.ok) return; setErr((r&&r.erreur)||"Code incorrect."); setCode(""); return; }
    if(await blocked()) return;
    const key=storeKey||TOTP_KEY+"_"+(profileId||"rdoa");
    const stored=await sbGet(key);
    if(!stored){setErr("TOTP non configuré");return;}
    const secrets=Array.isArray(stored)?stored:[stored];
    for(const secret of secrets){
      if(await verifyTotp(secret,code)){onVerified();return;}
    }
    await fail("Code incorrect.");
  };
  return (
    <div style={{textAlign:"center"}}>
      <div style={{fontSize:32,marginBottom:8}}>🔐</div>
      <div style={{fontWeight:700,fontSize:14,color:"#0F1F3D",marginBottom:4}}>Vérification 2FA</div>
      <div style={{fontSize:11,color:"#64748B",marginBottom:12}}>Entrez le code Microsoft Authenticator</div>
      <input value={code} onChange={e=>setCode(e.target.value.replace(/\D/g,"").slice(0,6))} placeholder="000000"
        onKeyDown={e=>e.key==="Enter"&&verify()}
        style={{width:"100%",height:46,boxSizing:"border-box",border:"1.5px solid #CBD5E1",borderRadius:10,padding:"0 14px",fontSize:18,letterSpacing:8,outline:"none",marginBottom:8,textAlign:"center"}}
        autoFocus/>
      {err&&<div style={{color:"#DC2626",fontSize:12,marginBottom:8}}>{err}</div>}
      {waitMs>0&&<div role="alert" style={{background:"#FEF2F2",border:"1px solid #FCA5A5",borderRadius:9,padding:"8px 10px",color:"#991B1B",fontSize:12.5,marginBottom:10}}>Réessayez dans <b>{fmtWait(waitMs)}</b></div>}
      <button onClick={verify} disabled={waitMs>0}
        style={{width:"100%",height:46,background:"#0F1F3D",color:"#fff",border:"none",borderRadius:10,fontSize:14,fontWeight:600,cursor:waitMs>0?"not-allowed":"pointer",opacity:waitMs>0?.45:1}}>
        Vérifier
      </button>
      <button onClick={startAddDevice}
        style={{width:"100%",marginTop:10,background:"none",border:"none",color:"#0369A1",fontSize:12,cursor:"pointer",textDecoration:"underline"}}>
        + Ajouter un autre téléphone Authenticator
      </button>
      <div style={{fontSize:10.5,color:"#64748B",marginTop:4}}>Inutile pour se connecter depuis un PC : le même code fonctionne partout.</div>
    </div>
  );
}

function CustomSelect({ value, onChange, options, placeholder, icon, searchable, required, dense }) {   // dense : même hauteur que les champs du SGS
  const [open,setOpen]=useState(false);
  const [search,setSearch]=useState("");
  const sel=options.find(o=>o.value===value);
  const filtered=searchable&&search
    ? options.filter(o=>o.label.toLowerCase().includes(search.toLowerCase())||(o.sub||"").toLowerCase().includes(search.toLowerCase()))
    : options;
  return (
    <div style={{position:"relative",minWidth:0}}>
      <button onClick={()=>{setOpen(o=>!o);setSearch("");}}
        style={{width:"100%",maxWidth:"100%",minWidth:0,overflow:"hidden",minHeight:dense?36:52,height:dense?36:undefined,background:"white",border:"1.5px solid "+(value?C.navy:C.border),borderRadius:10,padding:dense?"0 11px":"0 14px",fontSize:13,display:"flex",alignItems:"center",justifyContent:"space-between",...TAP,textAlign:"left"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0,flex:1}}>
          {icon&&!(dense&&sel)&&<span style={{fontSize:dense?14:18,flexShrink:0}}>{icon}</span>}
          <div style={{minWidth:0,flex:1}}>
            {sel
              ? <><div style={{fontWeight:700,fontSize:dense?12.5:13,color:C.navy,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{sel.label}
                    </div>
                  {!dense&&sel.sub&&<div style={{fontSize:10,color:C.slate}}>{sel.sub}</div>}</>
              : <div style={{color:C.slateL,fontSize:13}}>{placeholder||"-- Sélectionner --"}</div>}
          </div>
        </div>
        {/* Alerte (titre échu…) : jamais tronquée, elle reste visible quelle que soit la largeur */}
        {sel&&/⛔/.test(String(sel.sub||""))&&<span title={String(sel.sub)} aria-label="Titre échu — inapte" style={{flexShrink:0,marginLeft:6,fontSize:13}}>⛔</span>}
        <span style={{color:C.slate,fontSize:12,flexShrink:0,marginLeft:8}}>{open?"▲":"▼"}</span>
      </button>
      {open&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,marginTop:4,background:"white",border:"1.5px solid "+C.border,borderRadius:10,overflow:"hidden",boxShadow:"0 8px 24px rgba(0,0,0,0.15)",zIndex:500}}>
          {searchable&&(
            <div style={{padding:"8px 10px",borderBottom:"1px solid "+C.border}}>
              <input autoFocus value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher..."
                style={{width:"100%",boxSizing:"border-box",height:34,border:"1px solid "+C.border,borderRadius:8,padding:"0 10px",fontSize:12,outline:"none"}}/>
            </div>
          )}
          <div style={{maxHeight:240,overflowY:"auto"}}>
            {!required&&(
              <div onClick={()=>{onChange("");setOpen(false);setSearch("");}}
                style={{padding:"10px 14px",borderBottom:"1px solid "+C.border,cursor:"pointer",fontSize:12,color:C.slateL}}>
                {placeholder||"-- Aucun --"}
              </div>
            )}
            {filtered.map((o,i)=>(
              <div key={o.value} onClick={()=>{onChange(o.value);setOpen(false);setSearch("");}}
                style={{padding:"10px 14px",borderBottom:i<filtered.length-1?"1px solid "+C.border:"none",cursor:"pointer",
                  background:value===o.value?"#EFF6FF":"white",display:"flex",alignItems:"center",gap:10}}>
                {o.icon&&<span style={{fontSize:16,flexShrink:0}}>{o.icon}</span>}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:value===o.value?700:600,fontSize:13,color:value===o.value?C.navy:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.label}</div>
                  {o.sub&&<div style={{fontSize:10,color:C.slate}}>{o.sub}</div>}
                </div>
                {value===o.value&&<span style={{color:C.navy,fontSize:14,flexShrink:0}}>✓</span>}
              </div>
            ))}
            {filtered.length===0&&<div style={{padding:12,textAlign:"center",color:C.slateL,fontSize:12}}>Aucun résultat</div>}
          </div>
        </div>
      )}
    </div>
  );
}

function LoginGate({ onAuth }) {
  const [profileId,setProfileId]=useState(null);
  const [step,setStep]=useState("select"); // select | user | pwd | upwd | newpwd | totp_setup | totp_verify
  const [pwd,setPwd]=useState(""), [pwd2,setPwd2]=useState("");
  const [err,setErr]=useState("");
  const [ok,setOk]=useState(false);
  const [totpSecret,setTotpSecret]=useState("");
  const [users,setUsers]=useState([]), [user,setUser]=useState(null);
  const [waitMs,setUntil]=useCountdown();
  const [jeton,setJeton]=useState("");
  const [attenteTotp,setAttenteTotp]=useState("");
  useEffect(()=>{ (async()=>{ const r=await authApi("profils",{});
    if(r&&r.status===200&&Array.isArray(r.users)) setUsers(r.users); else setUsers(await usersLoad()); })(); },[]);
  const TOTP_REQUIRED = ["dir","rdoa","sgs"]; // double authentification : Direction, Administrateur, SGS
  const actifs=pid=>(users||[]).filter(u=>(u.actif!==false)&&u.profil===pid).sort((a,b)=>userLabel(a).localeCompare(userLabel(b)));
  const selectProfile=async(id)=>{ setProfileId(id); setErr(""); setPwd(""); setUser(null); setAttenteTotp(""); setJeton("");
    const s=await authApi("profils",{});
    const fresh=(s&&s.status===200&&Array.isArray(s.users))?s.users:await usersLoad(); setUsers(fresh);
    // Dès qu'un compte nominatif a existé pour ce profil, même désactivé, le mot de passe partagé n'est plus accepté
    setStep(NOMINATIVE_PROFILES.includes(id)&&fresh.some(u=>u.profil===id)?"user":"pwd"); };
  const finish=(u,token)=>{
    sessionSet(token||jeton||"");
    authOk(u?"u:"+u.id:"p:"+profileId);
    try{ sessionStorage.setItem(PFX+"active_profile",profileId); }catch(_e){ logSilent(_e); }
    try{ sessionStorage.setItem(PFX+"authed_"+profileId,"1"); if(u) sessionStorage.setItem(PFX+"active_user",JSON.stringify({id:u.id,nom:u.nom,prenom:u.prenom,fonction:u.fonction,profil:u.profil,role:u.role,crewId:u.crewId})); else sessionStorage.removeItem(PFX+"active_user"); }catch(_e){ logSilent(_e); }
    setOk(true); auditLog("connexion",u?userLabel(u):profileId,"connexion réussie",{profil:[null,profileId]}); setTimeout(()=>onAuth(profileId,u||null),400); };
  const goTotp=async(u)=>{
    const key=u?USER_TOTP_KEY(u):TOTP_KEY+"_"+profileId;
    const existing=await sbGet(key);
    if(existing&&(!Array.isArray(existing)||existing.length)) setStep("totp_verify");
    else { setTotpSecret(await generateTotpSecret()); setStep("totp_setup"); }
  };
  // Profil encore à mot de passe partagé (aucun compte nominatif actif)
  const submit=async()=>{
    if(NOMINATIVE_PROFILES.includes(profileId)&&(users||[]).some(u=>u.profil===profileId)){ setErr("Ce profil utilise des comptes nominatifs : choisissez votre nom."); setStep("user"); return; }
    { const w=await authWait("p:"+profileId); if(w){ setUntil(Date.now()+w); setErr("Trop d'essais : patientez."); return; } }
    if(!await checkPassword(pwd, profileId)){ const r=await authFail("p:"+profileId,profileId); if(r.until) setUntil(r.until); setErr(failMsg(r,"Mot de passe incorrect")); setPwd(""); auditLog("connexion",profileId,"échec de connexion",{motif:[null,"mot de passe incorrect"],profil:[null,profileId]}); return; }
    if(!TOTP_REQUIRED.includes(profileId)){ finish(null); return; }
    await goTotp(null);
  };
  // Compte nominatif : mot de passe personnel
  const submitUser=async()=>{
    // Vérification par le serveur : la page n'a plus accès aux empreintes ni aux clés
    const s=await authApi("login",{userId:user.id,password:pwd});
    if(s){
      if(s.status===429||s.status===401){
        if(s.attente) setUntil(Date.now()+s.attente);
        setErr(s.status===429?"Trop d'essais : patientez.":failMsg({fails:s.fails||1,until:s.attente?Date.now()+s.attente:0},"Mot de passe incorrect"));
        setPwd(""); auditLog("connexion",userLabel(user),"échec de connexion",{motif:[null,"mot de passe incorrect"]}); return;
      }
      if(s.status!==200){ setErr(s.error||"Connexion impossible."); return; }
      setPwd("");
      if(s.besoin==="totp"){ setAttenteTotp(s.attente_totp); setUser({...user,...(s.user||{})}); setStep("totp_verify"); return; }
      const u={...user,...(s.user||{})};
      setUser(u); setJeton(s.token||"");
      if(u.mustChange){ setStep("newpwd"); return; }
      if(s.totpAActiver){ await goTotp(u); return; }
      finish(u,s.token); return;
    }
    // Serveur absent : ancien fonctionnement
    const fresh=(await usersLoad()).find(x=>x.id===user.id);
    if(!fresh||!fresh.actif){ setErr("Ce compte est désactivé. Contactez l'Administrateur."); return; }
    { const w=await authWait("u:"+fresh.id); if(w){ setUntil(Date.now()+w); setErr("Trop d'essais : patientez."); return; } }
    if(await userHash(pwd,fresh.salt)!==fresh.hash){ const r=await authFail("u:"+fresh.id,userLabel(fresh)); if(r.until) setUntil(r.until); setErr(failMsg(r,"Mot de passe incorrect")); setPwd(""); auditLog("connexion",userLabel(fresh),"échec de connexion",{motif:[null,"mot de passe incorrect"],profil:[null,profileId]}); return; }
    setUser(fresh); setPwd("");
    if(fresh.mustChange){ setStep("newpwd"); return; }
    await goTotp(fresh);
  };
  const submitNew=async()=>{
    if(pwd.length<8){ setErr("8 caractères au minimum."); return; }
    if(!/[A-Za-z]/.test(pwd)||!/\d/.test(pwd)){ setErr("Mélangez lettres et chiffres."); return; }
    if(pwd!==pwd2){ setErr("Les deux saisies ne correspondent pas."); return; }
    const L=await usersLoad(), salt=randomToken(16), h=await userHash(pwd,salt);
    const u={...user,salt,hash:h,mustChange:false,pwdChangedAt:new Date().toISOString()};
    if(!(await usersSave(L.map(x=>x.id===u.id?u:x)))){ setErr("Enregistrement impossible : vérifiez la connexion."); return; }
    setUser(u); setPwd(""); setPwd2(""); setErr(""); await goTotp(u);
  };
  const handleTotpVerified=async(token)=>finish(user,token);
  // Code Authenticator vérifié par le serveur
  const verifTotpServeur=async(code)=>{
    const s=await authApi("totp",{attente_totp:attenteTotp,code});
    if(!s) return {erreur:"Serveur indisponible."};
    if(s.status===200){ setJeton(s.token||""); finish({...user,...(s.user||{})},s.token); return {ok:true}; }
    if(s.attente) setUntil(Date.now()+s.attente);
    return {erreur:s.status===429?"Trop d'essais : patientez.":"Code incorrect."};
  };
  const handleTotpSetupVerified=async()=>{ await sbSet(user?USER_TOTP_KEY(user):TOTP_KEY+"_"+profileId,[totpSecret]); finish(user); };

// ── Boîtes de dialogue maison ─────────────────────────────────────────────────
// Remplacent alert(), confirm() et prompt() du navigateur : même comportement,
// mais cohérentes avec l'interface et utilisables sur iOS comme sur Android.
// API par promesses : uiAlert(msg), await uiConfirm(msg), await uiPrompt(msg, défaut).
const DLG = { queue:[], listener:null };
function dlgPush(item){ return new Promise(res=>{ DLG.queue.push({...item,res}); if(DLG.listener) DLG.listener(); }); }
function uiAlert(message){ return dlgPush({kind:"alert", message:String(message)}); }
function uiConfirm(message){ return dlgPush({kind:"confirm", message:String(message)}); }
function uiPrompt(message, def){ return dlgPush({kind:"prompt", message:String(message), def:def==null?"":String(def)}); }

function DialogHost(){
  const [cur,setCur]=useState(null);
  const [val,setVal]=useState("");
  const inputRef=useRef(null);
  useEffect(()=>{
    const next=()=>{ setCur(c=>{ if(c) return c; const it=DLG.queue.shift()||null; if(it&&it.kind==="prompt") setVal(it.def); return it; }); };
    DLG.listener=next; next();
    return ()=>{ DLG.listener=null; };
  },[]);
  useEffect(()=>{ if(cur&&cur.kind==="prompt"&&inputRef.current) inputRef.current.focus(); },[cur]);
  if(!cur) return null;
  const close=(result)=>{
    const it=cur; setCur(null);
    it.res(result);
    setTimeout(()=>{ if(DLG.listener) DLG.listener(); },0);
  };
  // Un message commençant par ⛔ ou ❌ est un refus, par ⚠️ un avertissement.
  const m=cur.message;
  // Une action destructrice (suppression, effacement) reçoit un bouton rouge.
  const destructive = cur.kind==="confirm" && /supprim|effac|irréversible|définitivement/i.test(m);
  const tone = (/^[⛔❌]/.test(m)||destructive) ? {c:"#DC2626",bg:"#FEF2F2"} : /^⚠/.test(m) ? {c:"#D97706",bg:"#FFFBEB"} : {c:C.navy,bg:"#F4F7FB"};
  const btn={flex:1,height:46,borderRadius:10,fontSize:14,fontWeight:700,...TAP,fontFamily:"inherit"};
  return (
    <div onClick={()=>{ if(cur.kind==="alert") close(); }}
      style={{position:"fixed",inset:0,background:"rgba(15,31,61,0.55)",zIndex:10000,display:"flex",alignItems:"center",justifyContent:"center",padding:18}}>
      <div onClick={e=>e.stopPropagation()} role="dialog" aria-modal="true"
        style={{width:"100%",maxWidth:400,background:"white",borderRadius:16,overflow:"hidden",boxShadow:"0 20px 50px rgba(0,0,0,0.3)"}}>
        <div style={{background:tone.bg,borderTop:"4px solid "+tone.c,padding:"18px 18px 14px",maxHeight:"60vh",overflowY:"auto"}}>
          <div style={{fontSize:13.5,lineHeight:1.55,color:C.text,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{m}</div>
          {cur.kind==="prompt"&&(
            <input ref={inputRef} value={val} onChange={e=>setVal(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter") close(val); }}
              style={{marginTop:12,width:"100%",height:44,boxSizing:"border-box",border:"1.5px solid "+C.border,borderRadius:10,padding:"0 12px",fontSize:14,fontFamily:"inherit",outline:"none"}}/>
          )}
        </div>
        <div style={{display:"flex",gap:10,padding:14}}>
          {cur.kind!=="alert"&&(
            <button onClick={()=>close(cur.kind==="prompt"?null:false)}
              style={{...btn,background:C.bg,border:"1.5px solid "+C.border,color:C.slate}}>Annuler</button>
          )}
          <button onClick={()=>close(cur.kind==="prompt"?val:cur.kind==="confirm"?true:undefined)}
            style={{...btn,background:tone.c,border:"none",color:"white"}}>{cur.kind==="alert"?"OK":"Confirmer"}</button>
        </div>
      </div>
    </div>
  );
}


// ── Détection des nouvelles versions ─────────────────────────────────────────
// Sur mobile, revenir sur l'application ne la recharge pas : Chrome reprend la
// page gardée en mémoire. L'application vérifie donc elle-même, au retour au
// premier plan et toutes les 5 minutes, si une version plus récente est en ligne.
//  - au retour sur l'application : rechargement automatique (rien en cours) ;
//  - pendant l'utilisation : simple bandeau, pour ne jamais perdre une saisie.
// Référence : meta app-build + version.json produits par build.js. À défaut
// (page servie sans construction), l'en-tête ETag de la page fait foi.
const UPD_INTERVAL_MS = 60*1000;          // vérification légère (~60 octets)
const UPD_IDLE_MS     = 20*1000;          // inactivité requise pour recharger en cours d'utilisation
function currentBuild(){
  const m=document.querySelector('meta[name="app-build"]');
  return m ? m.getAttribute('content') : null;
}
// État de la détection de version, affiché par la ligne de diagnostic
const UPD_STATUS={ remote:null, at:null, error:null };
function updSet(p){ Object.assign(UPD_STATUS,p,{at:new Date()}); try{ window.dispatchEvent(new Event('afrijet-upd')); }catch(e){ logSilent(e); } }
async function fetchRemoteBuild(){
  try{
    if(currentBuild()){
      const r=await fetch('/version.json?t='+Date.now(),{cache:'no-store'});
      if(!r.ok){ updSet({remote:null,error:'version.json : HTTP '+r.status}); return null; }
      let j=null; try{ j=await r.json(); }catch(_e){ updSet({remote:null,error:'version.json illisible'}); return null; }
      if(!j||!j.build){ updSet({remote:null,error:'version.json sans identifiant'}); return null; }
      updSet({remote:String(j.build),error:null}); return String(j.build);
    }
    const r=await fetch('/?t='+Date.now(),{method:'HEAD',cache:'no-store'});
    const v=r.headers.get('etag')||r.headers.get('last-modified')||null;
    updSet({remote:v,error:v?null:'aucun identifiant de version (page sans balise app-build)'}); return v;
  }catch(e){ logSilent(e); updSet({remote:null,error:'réseau indisponible'}); return null; }
}
function UpdateWatcher(){
  const [avail,setAvail]=useState(false);
  const baseRef=useRef(currentBuild());      // version affichée
  const busyRef=useRef(false);
  const lastTouchRef=useRef(Date.now());
  // Aucune saisie en cours : pas de champ actif, pas de dialogue ouvert, pas de toucher récent
  const idle=()=>{
    const a=document.activeElement, tag=a&&a.tagName;
    const editing=tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(a&&a.isContentEditable);
    const dialog=!!document.querySelector('[role="dialog"]');
    return !editing && !dialog && Date.now()-lastTouchRef.current>=UPD_IDLE_MS;
  };
  const reloadNow=()=>{
    try{ SYNC.flushAll(); }catch(e){ logSilent(e); }   // envoyer ce qui est en attente
    setTimeout(()=>location.reload(),400);
  };
  const check=async(auto)=>{
    if(busyRef.current) return; busyRef.current=true;
    try{
      const remote=await fetchRemoteBuild();
      if(!remote) return;
      if(!baseRef.current){ baseRef.current=remote; return; }   // première mesure (mode ETag)
      if(remote===baseRef.current) return;
      // Garde-fou : un seul rechargement automatique par version, pour ne jamais
      // boucler si un cache servait encore l'ancienne page.
      const tried=sessionStorage.getItem('afrijet_reload_for');
      // Retour sur l'application, ou utilisation sans saisie en cours → rechargement automatique
      if((auto||idle()) && tried!==remote){ sessionStorage.setItem('afrijet_reload_for',remote); reloadNow(); }
      else setAvail(true);
    } finally { busyRef.current=false; }
  };
  useEffect(()=>{
    window.__afrijetCheckUpdate=check;   // utilisé par les tests
    check(false);
    const onVis=()=>{ if(document.visibilityState==="visible") check(true); };
    document.addEventListener("visibilitychange",onVis);
    window.addEventListener("focus",onVis);
    const id=setInterval(()=>{ if(document.visibilityState==="visible") check(false); },UPD_INTERVAL_MS);
    const touch=()=>{ lastTouchRef.current=Date.now(); };
    const EV=["pointerdown","keydown","input","wheel","touchmove"];
    EV.forEach(e=>document.addEventListener(e,touch,{capture:true,passive:true}));
    return ()=>{ document.removeEventListener("visibilitychange",onVis); window.removeEventListener("focus",onVis); clearInterval(id);
      EV.forEach(e=>document.removeEventListener(e,touch,{capture:true})); };
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);
  if(!avail) return null;
  return (
    <div style={{position:"fixed",left:12,right:12,bottom:BOT+10,zIndex:960,background:C.navy,color:"white",
      borderRadius:12,padding:"10px 12px",display:"flex",alignItems:"center",gap:10,boxShadow:"0 8px 24px rgba(0,0,0,.3)"}}>
      <span style={{fontSize:18}}>🔄</span>
      <div style={{flex:1,fontSize:12.5,lineHeight:1.35}}><b>Nouvelle version disponible.</b><br/>Enregistrez votre saisie en cours, puis rechargez.</div>
      <button onClick={reloadNow} style={{height:36,padding:"0 14px",background:"white",color:C.navy,border:"none",borderRadius:9,fontSize:12.5,fontWeight:800,...TAP}}>Recharger</button>
    </div>
  );
}

// Modal de restauration : choix entre la sauvegarde cloud et un fichier local.
// Extrait d'AppMain ; ne dépend que de ses trois props.
function RestoreModal({ onClose, setRestoreProgress, onImport }){
  const rSleep=(ms)=>new Promise(r=>setTimeout(r,ms));   // courte pause entre les étapes affichées
  return (
        <div style={{position:"fixed",inset:0,zIndex:700,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"white",borderRadius:16,padding:24,width:"100%",maxWidth:340,boxShadow:"0 8px 32px rgba(0,0,0,.3)"}}>

            <div style={{fontWeight:800,fontSize:16,color:C.navy,textAlign:"center",marginBottom:8}}>Restaurer les données</div>
            <div style={{fontSize:13,color:C.slate,textAlign:"center",lineHeight:1.6,marginBottom:20}}>Choisissez la source de restauration.</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <button onClick={async()=>{
                onClose();
                const steps=["Récupération depuis Supabase","Restauration des données","Finalisation"];
                setRestoreProgress({title:"Restauration en cours",icon:"📦",steps,currentStep:0,pct:15});
                const data=await sbGet(PFX+"lastBackupData");
                if(!data){setRestoreProgress(null);uiAlert("Aucun backup trouvé dans le cloud.");return;}
                setRestoreProgress(p=>({...p,currentStep:1,pct:50}));
                const dateStr=data.exportDate?new Date(data.exportDate).toLocaleString("fr-FR",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"}):"date inconnue";
                if(await uiConfirm("Backup Supabase du "+dateStr+".\n\nConfirmer la restauration ?")){
                  if(onImport){onImport(data);}
                  setRestoreProgress(p=>({...p,currentStep:2,pct:85}));
                  await rSleep(400);
                  setRestoreProgress(p=>({...p,currentStep:3,pct:100}));
                  await rSleep(600);
                  setRestoreProgress(null);
                } else {
                  setRestoreProgress(null);
                }
              }} style={{height:48,background:"#EFF6FF",border:"1.5px solid #0369A1",borderRadius:10,color:"#0369A1",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                ☁️ Depuis Supabase (cloud)
              </button>
              <button onClick={()=>{
                onClose();
                const input=document.createElement("input");
                input.type="file"; input.accept=".json";
                input.onchange=async(e)=>{
                  const file=e.target.files[0]; if(!file) return;
                  const reader=new FileReader();
                  reader.onload=async(ev)=>{
                    try{
                      const steps=["Lecture du fichier","Restauration des données","Finalisation"];
                      setRestoreProgress({title:"Restauration en cours",icon:"📂",steps,currentStep:0,pct:20});
                      const data=JSON.parse(ev.target.result);
                      setRestoreProgress(p=>({...p,currentStep:1,pct:50}));
                      const dateStr=data.exportDate?new Date(data.exportDate).toLocaleString("fr-FR",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"}):"date inconnue";
                      if(await uiConfirm("Fichier local du "+dateStr+".\n\nConfirmer la restauration ?")){
                        if(onImport){onImport(data);}
                        setRestoreProgress(p=>({...p,currentStep:2,pct:85}));
                        await rSleep(400);
                        setRestoreProgress(p=>({...p,currentStep:3,pct:100}));
                        await rSleep(600);
                        setRestoreProgress(null);
                      } else {
                        setRestoreProgress(null);
                      }
                    }catch(_e){setRestoreProgress(null);uiAlert("❌ Fichier JSON invalide.");}
                  };
                  reader.readAsText(file);
                };
                input.click();
              }} style={{height:48,background:"#F0FDF4",border:"1.5px solid #00936A",borderRadius:10,color:"#00936A",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                📂 Depuis fichier local (JSON)

                style={{height:44,background:"#F1F5F9",border:"1.5px solid #CBD5E1",borderRadius:10,color:"#64748B",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                Annuler
              </button>
            </div>
          </div>
        </div>
  );
}

                    doc.setTextColor(160,114,10);doc.setFont("helvetica","bold");doc.setFontSize(7.5);
                    doc.text("MEL ACTIFS — "+(ac.immat||""),M+3,y+4.5);
                    y+=9;
                    acMels.forEach((m,i)=>{
                      if(y>270){doc.addPage();y=15;}
                      const today=new Date();
                      const expDate=(()=>{if(!m.exp)return null;const p=m.exp.split("/");if(p.length!==3)return null;const yr=p[2].length===2?2000+parseInt(p[2]):parseInt(p[2]);return new Date(yr,parseInt(p[1])-1,parseInt(p[0]));})();
                      const daysLeft=expDate?Math.ceil((expDate-today)/(1000*60*60*24)):null;
                      const isExpired=daysLeft!==null&&daysLeft<0;
                      const catColor=m.sev==="A"?[220,38,38]:m.sev==="B"?[217,119,6]:[100,116,139];
                      if(isExpired){doc.setFillColor(220,38,38);}else{doc.setFillColor(248,250,252);}
                      doc.rect(M,y,CW,8,"F");
                      doc.setFillColor(...catColor);
                      doc.roundedRect(M+2,y+1.5,10,5,1,1,"F");
                      doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(6);
                      doc.text("Cat."+m.sev,M+7,y+4.5,{align:"center"});
                      if(isExpired){doc.setTextColor(255,255,255);}else{doc.setTextColor(15,31,61);}
                      doc.setFont("helvetica","bold");doc.setFontSize(8);
                      doc.text(m.sys||"--",M+15,y+4);
                      if(isExpired){doc.setTextColor(255,220,220);}else{doc.setTextColor(100,116,139);}
                      doc.setFont("helvetica","normal");doc.setFontSize(6.5);
                      doc.text(m.mel||"",M+15,y+7);
                      const expColor=isExpired?[255,255,255]:daysLeft===null?[100,116,139]:daysLeft<7?[220,38,38]:daysLeft<30?[217,119,6]:[0,147,106];
                      doc.setTextColor(...expColor);doc.setFont("helvetica","bold");doc.setFontSize(7.5);
                      const daysStr=daysLeft===null?"":daysLeft<0?" ⚠ EXPIRÉ":daysLeft===0?" (Auj.)":` (${daysLeft}j)`;
                      doc.text((m.exp||"--")+daysStr,M+CW-2,y+4,{align:"right"});
                      if(i<acMels.length-1){doc.setDrawColor(isExpired?180:226,isExpired?50:232,isExpired?50:240);doc.setLineWidth(0.2);doc.line(M,y+8,M+CW,y+8);}
                      y+=9;
                    });
                    y+=4;
                  } else {
                    doc.setFillColor(248,250,252);doc.rect(M,y,CW,6,"F");
                    doc.setTextColor(148,163,184);doc.setFont("helvetica","normal");doc.setFontSize(7.5);
                    doc.text("Aucun MEL actif",M+3,y+4.5);
                    y+=9;
                  }
                  if(acIdx<pAcList.length-1) y+=4;
                });
                const pTechVols=flights.filter(f=>f.status==="Termine"&&f.causeRetard==="Technique");
                
                const pTechDelay=pDoneVols.length>0?Math.round((pTechVols.length/pDoneVols.length)*1000)/10:0;
                const pPlanned=flights.filter(f=>f.status!=="Annule");
                const pDR=pPlanned.length>0?Math.round((pDoneVols.length/pPlanned.length)*1000)/10:0;
                const pTechCan=flights.filter(f=>f.status==="Annule"&&f.causeRetard==="Technique");
                const pCFBase=pPlanned.length-pTechCan.length;
                const pCF=pCFBase>0?Math.round((pDoneVols.length/pCFBase)*1000)/10:0;
                drawSection("  INDICATEURS FLOTTE",15,31,61);
                const pFiab=(pAcList[0]?.fiabMoteurs)||0;
                drawRow("Fiabilite moteurs",(pFiab||"--")+"%",pFiab>=99.5);
                drawRow("Tech delay",pTechDelay+"%",pTechDelay<2);
                drawRow("Dispatch Reliability",pDR+"%",pDR>=99);
                drawRow("Completion Factor",pCF+"%",pCF>=99,true);
                y+=6;

                // ── Retards par cause ──
                const pDelayVols2=pDoneVols.filter(f=>f.delayMin>0);
                if(pDelayVols2.length>0){
                  drawSection("  RETARDS PAR CAUSE ("+pDelayVols2.length+" vol(s))",15,31,61);
                  const pCauses=["Technique","Météo","ATC","Commercial","Équipage","Handling","Passagers","Carburant","Autre"];
                  pCauses.forEach(cat=>{
                    const cv=pDelayVols2.filter(f=>f.causeRetard===cat);
                    if(cv.length===0)return;
                    const avgM=Math.round(cv.reduce((s,f)=>s+f.delayMin,0)/cv.length);
                    const pct=Math.round(cv.length/pDelayVols.length*100);
                    if(y>270){doc.addPage();y=15;}
                    doc.setFillColor(248,250,252);doc.rect(M,y,CW,7,"F");
                    doc.setTextColor(15,31,61);doc.setFont("helvetica","bold");doc.setFontSize(8);
                    doc.text(cat,M+3,y+5);
                    const barW=(CW-100)*pct/100;
                    const barColor=cat==="Technique"?[220,38,38]:cat==="Météo"?[59,130,246]:cat==="ATC"?[124,58,237]:[217,119,6];
                    doc.setFillColor(...barColor);doc.rect(M+70,y+2,barW,3,"F");
                    doc.setTextColor(...barColor);doc.setFont("helvetica","normal");doc.setFontSize(7.5);
                    doc.text(cv.length+" vol(s) · "+avgM+" min moy.",M+CW-2,y+5,{align:"right"});
                    y+=8;
                  });
                  y+=4;
                }

                // ── Sécurité ──
                const sd=safetyData||[];
                drawSection("  SECURITE OPERATIONNELLE",220,38,38);
                const vdP=flights.filter(f=>f.status==="Termine").length||1;
                // Tous les types du registre survenus ; une ligne neutre si aucun
                const secItems=SAFETY_EVENTS.map(x=>[SAFETY_FLAGS.find(f=>f.k===x.k).l,sd.filter(e=>e[x.k]).length])
                  .filter(([,n])=>n>0).sort((p,q)=>q[1]-p[1]);
                if(!secItems.length) secItems.push(["Aucun événement de sécurité enregistré",0]);
                secItems.forEach(([label,count],i)=>{
                  const pct=Math.round(count/vdP*1000)/10;
                  drawRow(label,count+" ("+pct+"%)",count===0,i===secItems.length-1);
                });
                y+=4;

                // ── Finances ──
                const fd=finData||[];
                if(fd.length>0){
                  const tRev=fd.reduce((s,f)=>s+f.revenus,0);
                  const tCout=fd.reduce((s,f)=>s+f.couts,0);
                  const marge=tRev>0?Math.round((1-tCout/tRev)*100):0;
                  if(y>240){doc.addPage();y=15;}
                  drawSection("  FINANCES - CUMUL "+now.getFullYear(),124,58,237);
                  drawRow("Revenus cumules",fmtMAD(tRev)+" MAD");
                  drawRow("Couts cumules",fmtMAD(tCout)+" MAD");
                  drawRow("Marge brute",marge+"%",marge>0);
                  y+=3;
                  // Monthly rows
                  fd.forEach((f,i)=>{
                    if(y>275){doc.addPage();y=15;}
                    const fm=f.revenus>0?Math.round((1-f.couts/f.revenus)*100):0;
                    doc.setFillColor(i%2===0?248:255,i%2===0?250:255,i%2===0?252:255);
                    doc.rect(M,y-3,CW,6,"F");
                    // Mois — left
                    doc.setTextColor(15,31,61);doc.setFont("helvetica","bold");doc.setFontSize(7.5);
                    doc.text(f.mois,M+3,y);
                    // Revenus — right aligned before marge
                    doc.setFont("helvetica","normal");doc.setTextColor(71,85,105);
                    doc.text(fmtMAD(f.revenus)+" MAD",M+CW-22,y,"right");
                    // Marge — far right
                    const mc=fm>0?[0,147,106]:fm===0?[217,119,6]:[220,38,38];
                    doc.setTextColor(...mc);doc.setFont("helvetica","bold");
                    doc.text(fm+"%",M+CW-3,y,"right");
                    if(i<fd.length-1){doc.setDrawColor(226,232,240);doc.setLineWidth(0.2);doc.line(M,y+3,M+CW,y+3);}
                    y+=6;
                  });
                  y+=4;
                }

                // ── Graphiques evolution ──
                if(days.length>=2){
                  drawSection("  GRAPHIQUES D EVOLUTION",15,31,61);
                  y+=2;

                  const drawChart=(chartData,title,color,target,minV,maxV,unitLabel)=>{
                    if(y>255){doc.addPage();y=15;}
                    const pts=chartData.filter(d=>d.val!==null);
                    if(pts.length<2)return;
                    const cX=M, cY=y, cW2=CW, cH2=22;
                    const lo=minV!==undefined?minV:Math.max(0,Math.min(...pts.map(p=>p.val))-5);
                    const hi=maxV!==undefined?maxV:Math.max(...pts.map(p=>p.val))+5;
                    const range=hi-lo||1;
                    const xS=i=>cX+(i/(pts.length-1))*cW2;
                    const yS=v=>cY+cH2-((v-lo)/range)*cH2;

                    const avgVal=Math.round(pts.reduce((s,p)=>s+p.val,0)/pts.length);
                    doc.setTextColor(71,85,105);
                    doc.setFontSize(7);
                    doc.setFont("helvetica","bold");
                    doc.text(title,cX,cY-1);
                    const r=color[0],g=color[1],b=color[2];
                    doc.setTextColor(r,g,b);
                    doc.text("Moy: "+String(avgVal)+unitLabel,cX+CW,cY-1,"right");

                    doc.setFillColor(248,250,252);
                    doc.roundedRect(cX,cY,cW2,cH2,1,1,"F");

                    doc.setDrawColor(226,232,240);
                    doc.setLineWidth(0.2);
                    [0,0.5,1].forEach(t=>{
                      const yy=cY+cH2*t;
                      doc.line(cX,yy,cX+cW2,yy);
                      doc.setTextColor(148,163,184);
                      doc.setFontSize(5.5);
                      doc.setFont("helvetica","normal");
                      doc.text(String(Math.round(hi-t*(hi-lo))),cX-1,yy+1,"right");
                    });

                    if(target!==undefined){
                      const ty2=yS(Math.min(hi,Math.max(lo,target)));
                      doc.setDrawColor(r,g,b);
                      doc.setLineWidth(0.4);
                      doc.setLineDashPattern([1.5,1.5],0);
                      doc.line(cX,ty2,cX+cW2,ty2);
                      doc.setLineDashPattern([],0);
                    }

                    doc.setDrawColor(r,g,b);
                    doc.setLineWidth(1.2);
                    for(let i=1;i<pts.length;i++){
                      doc.line(xS(i-1),yS(pts[i-1].val),xS(i),yS(pts[i].val));
                    }
                    pts.forEach((p,i)=>{
                      doc.setFillColor(r,g,b);
                      doc.circle(xS(i),yS(p.val),0.7,"F");
                    });
                    pts.forEach((p,i)=>{
                      if(pts.length<=7||i===0||i===pts.length-1||i%Math.ceil(pts.length/5)===0){
                        doc.setTextColor(148,163,184);
                        doc.setFontSize(5);
                        doc.setFont("helvetica","normal");
                        doc.text(p.label,xS(i),cY+cH2+3.5,"center");
                      }
                    });
                    y+=cH2+9;
                  };

                  drawChart(otpData,"Ponctualite OTP",[0,147,106],90,60,100,"%");                  drawChart(lfData,"Load Factor",[15,31,61],80,50,100,"%");
                  drawChart(consoData,"Consommation carburant",[160,114,10],900,600,1100," kg/h");
                  drawChart(npsData2,"Satisfaction client",[124,58,237],7,4,10,"");
                }

                // ── Footer on all pages ──
                const nbPages=doc.internal.getNumberOfPages();
                for(let p=1;p<=nbPages;p++){
                  doc.setPage(p);
                  doc.setFillColor(15,31,61);
                  doc.rect(0,PH-10,PW,10,"F");
                  doc.setFillColor(160,114,10);
                  doc.rect(0,PH-11,PW,1,"F");
                  doc.setTextColor(255,255,255);
                  doc.setFontSize(6.5);
                  doc.setFont("helvetica","normal");
                  doc.text("AFRIJET SAHARA  |  DGAC MAROC  |  CONFIDENTIEL",PW/2,PH-4,"center");
                  doc.setTextColor(160,114,10);
                  doc.setFont("helvetica","bold");
                  doc.text("Page "+p+"/"+nbPages,PW-M,PH-4,"right");
                }

                doc.save("Rapport_KPI_Afrijet_"+now.toISOString().slice(0,10)+".pdf");
              } catch(e) {
                uiAlert("Erreur PDF: "+e.message);
              }
            }}
              style={{width:"100%",height:46,background:"linear-gradient(135deg,#7C3AED,#5B21B6)",border:"none",borderRadius:10,color:"white",fontSize:14,fontWeight:700,...TAP,display:"flex",alignItems:"center",justifyContent:"center",gap:8,letterSpacing:"0.05em"}}>
              <span style={{fontSize:20}}>📄</span> Telecharger le rapport PDF
            </button>
          </div>

          <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"0 12px"}}>
            <div dangerouslySetInnerHTML={{__html:report}}/>
          </div>
        </div>
      )}

      {/* BOTTOM NAV */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",height:BOT,background:C.white,borderTop:"1px solid "+C.border,display:"flex",alignItems:"stretch",boxShadow:"0 -2px 12px rgba(0,0,0,.08)",zIndex:200}}>
        {TABS.filter(t=>canTab(t.id)).map(t=>{
          const interdit=false;
          const active=tab===t.id;
          const badge=t.id==="alertes"&&critCount>0?critCount:null;
          const isRO=readOnly(t.id)||(t.id==="fin"&&!interdit);
          return (
            <button key={t.id} onClick={()=>{ if(!interdit) setTab(t.id); }} aria-disabled={interdit}
              style={{flex:1,background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,padding:"6px 2px",position:"relative",...NOTAP,borderTop:active?"2.5px solid "+C.gold:"2.5px solid transparent"}}>
              <span style={{fontSize:17,lineHeight:1,opacity:interdit?.35:1,filter:interdit?"grayscale(1)":"none"}}>{t.icon}</span>
              <span style={{fontSize:8,fontWeight:active?700:500,color:active?C.gold:C.slate}}>{t.label}</span>
              {/* Emplacement de l'œil : hauteur fixe, tous les libellés restent alignés */}
              <span style={{width:12,height:9,display:"flex",alignItems:"center",justifyContent:"center"}}>
                {isRO&&!interdit&&<span style={{fontSize:7,lineHeight:1,color:C.slateL}}>👁</span>}
              </span>
              {badge&&(
                <div style={{position:"absolute",top:4,right:"50%",transform:"translateX(10px)",background:C.danger,color:"white",borderRadius:10,minWidth:16,height:16,fontSize:9,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 4px"}}>
                  {badge}
                </div>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}


  </script>
</body>
</html>
