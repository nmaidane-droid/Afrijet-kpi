const NDS_ARCHIVE_KEY = 'ns:archive';
// Clé de tri d'une note : on privilégie la date contenue dans la référence
// (NS-XXX-AAAAMMJJ-NN), sinon la date affichée en français, sinon l'horodatage
// d'enregistrement. Retourne un nombre comparable, 0 si rien n'est exploitable.
const NDS_MOIS = {janvier:1,'février':2,fevrier:2,mars:3,avril:4,mai:5,juin:6,
  juillet:7,'août':8,aout:8,septembre:9,octobre:10,novembre:11,'décembre':12,decembre:12};
function ndsDateKey(r){
  const m = /^(?:NS-[A-Z]+|RE|ND|AS)-(\d{4})(\d{2})(\d{2})-/.exec(String(r.ref||'').trim());
  if(m) return Number(m[1]+m[2]+m[3]);
  const d = String(r.date||'').trim().toLowerCase();
  const dm = /^(\d{1,2})\s+([a-zéûôA-ZÉÛÔ]+)\s+(\d{4})$/.exec(d);
  if(dm){
    const mo = NDS_MOIS[dm[2]];
    if(mo) return Number(dm[3]) * 10000 + mo * 100 + Number(dm[1]);
  }
  if(r.savedAt){
    const t = Date.parse(r.savedAt);
    if(!isNaN(t)) return t / 1000;
  }
  return 0;
}

// Les archives du générateur vivent désormais dans la persistance partagée
// (clé « ndsArchive » via usePersist) : synchronisées entre appareils par
// Supabase, avec la fusion horodatée. L'ancienne clé locale « ns:archive »
// n'est conservée que pour migrer les notes déjà enregistrées.
const NDS_ARCHIVE_PERSIST_KEY = 'ndsArchive';

// Attribue un identifiant unique à toute entrée qui n'en a pas ou qui en
// partage un avec une autre : la suppression filtre par id.
function ndsRepairIds(arch){
  const seen = new Set(); let fixed = false;
  (arch||[]).forEach((r,i)=>{
    if(!r.id || seen.has(r.id)){
      r.id = (r.ref||'NS')+'-'+Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,8);
      fixed = true;
    }
    seen.add(r.id);
  });
  return fixed;
}

// Lecture synchrone de l'archive persistée (sert au calcul des références).
function ndsReadPersisted(){
  try{
    const s = lsGet(PFX+NDS_ARCHIVE_PERSIST_KEY);
    if(!s) return [];
    const u = unwrapEnv(JSON.parse(s));
    return Array.isArray(u.v) ? u.v : [];
  }catch(_e){ return []; }
}

// Notes héritées de l'ancien stockage local, à reprendre une seule fois.
function ndsLegacyArchive(){
  try{
    const a = JSON.parse(localStorage.getItem(NDS_ARCHIVE_KEY) || '[]');
    return Array.isArray(a) ? a : [];
  }catch(_e){ return []; }
}
function ndsClearLegacy(){ try{ localStorage.removeItem(NDS_ARCHIVE_KEY); }catch(_e){ logSilent(_e); } }

function ndsExportPDF(state, opts={}){
  // Build tag embedded in PDF metadata (Fichier > Propriétés côté lecteur PDF) —
  // permet de vérifier à coup sûr quelle version de l'appli a produit un PDF donné.
  const APP_BUILD = 'nds-2026-09-04-6';
  // Only re-read the on-screen editable sheet when exporting from the editor
  // itself. When called from the Archives list, `state` already holds the
  // correct archived record — re-syncing from the (possibly stale/hidden)
  // editor DOM would overwrite it, e.g. with an empty ref.
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  doc.setProperties({ creator: `Notes de Service Afrijet Sahara — ${APP_BUILD}`, title: state.ref || 'Note de service' });
  const marginX = 20;
  const pageWidth = 210;
  const pageHeight = 297;
  const contentWidth = pageWidth - marginX*2;
  const BAND_H = 8;
  let y = 0;

  // Tracks the "current" text style so it can be restored after the header
  // band is redrawn on a new page. BUG THIS FIXES: drawHeaderBand() sets
  // white text color for its own label — if a page break happens mid­
  // paragraph (checkSpace triggers newPage() in the middle of a wrapped-line
  // loop), any code that set color/font ONCE before that loop (instead of on
  // every line) would keep drawing in white-on-white after the break —
  // invisible text that still "exists" (found by copy/paste or text
  // extraction) but never shows up when rendered. setText() is now the only
  // way body content sets its style, so newPage() can always put it back.
  let curFont = 'times', curStyle = 'normal', curSize = 10.5, curColor = [30,41,59];
  function setText(font, style, size, color){
    curFont = font; curStyle = style; curSize = size; curColor = color;
    doc.setFont(font, style);
    doc.setFontSize(size);
    doc.setTextColor(color[0], color[1], color[2]);
  }
  function restoreText(){
    doc.setFont(curFont, curStyle);
    doc.setFontSize(curSize);
    doc.setTextColor(curColor[0], curColor[1], curColor[2]);
  }

  const FCN=state&&state.form?sgsCtrl(state.form):null;   // compte rendu de revue (SMS-01) : cartouche officiel
  function drawHeaderBand(){
    if(FCN){ y = SGS_CART_H + 12; return; }
    // En-tête blanc : logo, société et direction, trait marine
    sgsPdfHeader(doc,{titre:'SAHARA AVIATION SAS',ref:'Direction des Opérations Aériennes',MX:marginX,color:[15,31,61]});
    y = BAND_H + 16;
  }

  function newPage(){
    doc.addPage();
    drawHeaderBand();
    restoreText(); // <- the actual fix: undo the header band's white text color
  }

  function checkSpace(needed){
    if(y + needed > pageHeight - 16){
      newPage();
    }
  }

  function writeParagraph(text, opts={}){
    const fontSize = opts.fontSize || 10.5;
    const lineHeight = opts.lineHeight || 5.2;
    const bold = opts.bold || false;
    setText('times', bold ? 'bold' : 'normal', fontSize, [30,41,59]);
    const lines = doc.splitTextToSize(text, contentWidth);
    lines.forEach(line=>{
      checkSpace(lineHeight);
      doc.text(line, marginX, y);
      y += lineHeight;
    });
  }

  function writeSectionTitle(text){
    y += 3;
    setText('helvetica', 'bold', 10.5, [15,31,61]);
    doc.text(text.toUpperCase(), marginX, y);
    y += 7.5;
  }

  // Ensures a section title is never left alone at the bottom of a page:
  // reserves room for the title block PLUS at least the first couple of
  // content lines before deciding whether to break to a new page.
  // Renders a section's body with structure: standalone numbered ALL-CAPS
  // sub-headers ("1. TITRE") in bold with a slight indent, "• " bullets with
  // a hanging indent so wrapped lines align under the text (not under the
  // bullet), and plain paragraph lines justified as before.
  function writeSectionBody(content, opts={}){
    const fontSize = opts.fontSize || 10.3;
    const lineHeight = opts.lineHeight || 5;
    const subheaderX = marginX + 3.5;
    const bulletTextX = marginX + 9;
    const bulletMarkX = marginX + 3;
    const lines = String(content).split('\n').map(l=>l.trim()).filter(l=>l.length>0);

    lines.forEach(line=>{
      const isSubheader = /^\d+\.\d+\s+\S/.test(line) && line === line.toUpperCase();
      const isBullet = line.startsWith('•');

      if(isSubheader){
        checkSpace(lineHeight + 4);
        y += 2.5;
        setText('helvetica', 'bold', fontSize + 0.1, [30,41,59]);
        const wrapped = doc.splitTextToSize(line, contentWidth - (subheaderX - marginX));
        wrapped.forEach(w=>{ checkSpace(lineHeight); doc.text(w, subheaderX, y); y += lineHeight; });
        y += 1;
      } else if(isBullet){
        const bulletText = line.replace(/^•\s*/, '');
        setText('times', 'normal', fontSize, [30,41,59]);
        const wrapped = doc.splitTextToSize(bulletText, contentWidth - (bulletTextX - marginX));
        wrapped.forEach((w,idx)=>{
          checkSpace(lineHeight);
          if(idx===0){ doc.text('•', bulletMarkX, y); }
          doc.text(w, bulletTextX, y);
          y += lineHeight;
        });
      } else {
        setText('times', 'normal', fontSize, [30,41,59]);
        const wrapped = doc.splitTextToSize(line, contentWidth);
        wrapped.forEach(w=>{ checkSpace(lineHeight); doc.text(w, marginX, y); y += lineHeight; });
      }
    });
  }

  function writeSection(title, content, opts={}, table=null){
    const fontSize = opts.fontSize || 10.3;
    const lineHeight = opts.lineHeight || 5;
    doc.setFont('times', 'normal');
    doc.setFontSize(fontSize);
    const contentLines = content ? doc.splitTextToSize(content, contentWidth) : [];
    const titleBlockHeight = 3 + 7.5;
    const minOrphanLines = Math.min(2, contentLines.length);
    const reserved = titleBlockHeight + (minOrphanLines * lineHeight);
    checkSpace(reserved);
    writeSectionTitle(title);
    if(content && content.trim()){
      writeSectionBody(content, { fontSize, lineHeight });
      y += 3;
    }
    if(table && Array.isArray(table.headers) && Array.isArray(table.rows) && table.rows.length){
      writeRiskTable(table);
    }
  }

  // Renders a 3-column table with a dark header row and alternating body
  // rows (light off-white / white) — matches the "Risques opérationnels"
  // table style from the original NS-OPS-2026-014 reference document.
  function writeRiskTable(table){
    const cols = table.headers.length;
    const colWidths = cols === 3
      ? [contentWidth*0.24, contentWidth*0.36, contentWidth*0.40]
      : Array(cols).fill(contentWidth/cols);
    // Measured directly off the original NS-OPS-2026-014 table render:
    // header row ≈ 6.3mm (1 line), body rows ≈ 11.0mm (2 lines) / 14.9mm (3 lines).
    const cellPad = 0.9;
    const bodyFontSize = 8.7;
    const headFontSize = 8.7;
    const lh = 4.5;

    function colX(idx){
      let x = marginX;
      for(let k=0;k<idx;k++) x += colWidths[k];
      return x;
    }
    function rowHeightFor(cells, fontSize){
      doc.setFontSize(fontSize);
      let maxLines = 1;
      cells.forEach((cell,idx)=>{
        const w = colWidths[idx] - cellPad*2;
        const lines = doc.splitTextToSize(String(cell), w);
        maxLines = Math.max(maxLines, lines.length);
      });
      return maxLines*lh + cellPad*2;
    }
    function drawRow(cells, opts={}){
      const { header=false, shade=false, fontSize=bodyFontSize } = opts;
      const rowH = rowHeightFor(cells, fontSize);
      checkSpace(rowH);
      if(header){
        doc.setFillColor(15,31,61);
        doc.rect(marginX, y, contentWidth, rowH, 'F');
      } else if(shade){
        doc.setFillColor(244,247,251);
        doc.rect(marginX, y, contentWidth, rowH, 'F');
      }
      doc.setDrawColor(221,227,237);
      doc.setLineWidth(0.15);
      doc.rect(marginX, y, contentWidth, rowH);
      for(let k=1;k<cols;k++){
        doc.line(colX(k), y, colX(k), y+rowH);
      }
      doc.setFont('helvetica', header ? 'bold' : 'normal');
      doc.setFontSize(fontSize);
      doc.setTextColor(header ? 255 : 30, header ? 255 : 41, header ? 255 : 59);
      cells.forEach((cell,idx)=>{
        const w = colWidths[idx] - cellPad*2;
        const lines = doc.splitTextToSize(String(cell), w);
        let ly = y + cellPad + lh*0.72;
        lines.forEach(line=>{ doc.text(line, colX(idx)+cellPad, ly); ly += lh; });
      });
      y += rowH;
    }

    drawRow(table.headers, { header:true, fontSize: headFontSize });
    table.rows.forEach((row, i)=>{ drawRow(row, { shade: i % 2 === 1 }); });
    y += 3;

    if(table.note && table.note.trim()){
      setText('times', 'normal', 9.5, [30,41,59]);
      const noteLines = doc.splitTextToSize(table.note, contentWidth);
      noteLines.forEach(line=>{ checkSpace(4.8); doc.text(line, marginX, y); y += 4.8; });
    }
    y += 2;
  }

  drawHeaderBand();

  // Title block (left-aligned, ink navy — matches original, NOT bordeaux)
  doc.setFont('helvetica','bold');
  doc.setFontSize(17);
  doc.setTextColor(30,41,59);
  doc.text(state.docType || 'NOTE DE SERVICE', marginX, y);
  y += 6;
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.setTextColor(100,116,139);
  doc.text('SERVICE MEMORANDUM — INTERNATIONAL FORMAT (ICAO Annex 6 / EASA Part-OPS reference)', marginX, y);
  y += 6;

  // Bordeaux rule opening the meta block
  doc.setDrawColor(15,31,61);
  doc.setLineWidth(0.5);
  doc.line(marginX, y, pageWidth - marginX, y);
  y += 6;

  // Meta rows — plain text, no cell borders, two columns
  const rows = [
    ['Réf. / Ref.', state.ref || '', 'Date', state.date || ''],
    ['De / From', state.from || '', 'Classification', state.classification || ''],
    ['À / To', state.to || '', 'Révision', state.revision || '']
  ];
  const colW = contentWidth/2;
  const labelW = 24;
  rows.forEach(([k1,v1,k2,v2])=>{
    setText('helvetica', 'bold', 9.3, [30,41,59]);
    const v1Lines = doc.splitTextToSize(v1, colW - labelW - 4);
    const v2Lines = doc.splitTextToSize(v2, colW - labelW - 4);
    const rowH = Math.max(v1Lines.length, v2Lines.length) * 4.6 + 2.5;
    checkSpace(rowH);
    setText('helvetica', 'bold', 9.3, [30,41,59]);
    doc.text(k1, marginX, y);
    doc.text(k2, marginX + colW, y);
    doc.setFont('helvetica','normal');
    doc.text(v1Lines, marginX + labelW, y);
    doc.text(v2Lines, marginX + colW + labelW, y);
    y += rowH;
  });
  y += 2;

  // Bordeaux rule closing the meta block
  doc.setDrawColor(15,31,61);
  doc.setLineWidth(0.5);
  doc.line(marginX, y, pageWidth - marginX, y);
  y += 8;

  // OBJET — single bold black paragraph, "OBJET : " inline (not a separate colored label)
  checkSpace(12);
  writeParagraph(`OBJET : ${state.objet || ''}`, { fontSize: 11, lineHeight: 5.6, bold: true });
  y += 4;

  // Intro
  writeParagraph(state.intro || '', { fontSize: 10.3, lineHeight: 5 });
  y += 4;

  // Sections
  state.sections.forEach((sec, i)=>{
    writeSection(`${i+1}. ${sec.title}`, sec.content, { fontSize: 10.3, lineHeight: 5 }, sec.table);
    y += 5;
  });

  // Closing
  y += 2;
  setText('times', 'normal', 9.8, [30,41,59]);
  const closingLines = doc.splitTextToSize(state.closingText || state.closing, contentWidth);
  closingLines.forEach(line=>{ checkSpace(5); doc.text(line, marginX, y); y+=5; });

  // Signatures
  checkSpace(28);
  y += 10;
  doc.setDrawColor(221,227,237);
  doc.line(marginX, y, marginX + 70, y);
  doc.line(pageWidth - marginX - 70, y, pageWidth - marginX, y);
  y += 5;
  doc.setFont('helvetica','bold');
  doc.setFontSize(9);
  doc.setTextColor(30,41,59);
  doc.text('Émis par :', marginX, y);
  doc.text('Approuvé par :', pageWidth - marginX - 70, y);
  y += 4.5;
  doc.setFont('helvetica','normal');
  doc.setFontSize(7.8);
  doc.setTextColor(100,116,139);
  doc.text((state.from || 'Direction des Opérations Aériennes') + '\nSahara Aviation SAS — Afrijet Sahara', marginX, y);
  // Signataire
  doc.setFont('helvetica','bold');
  doc.setTextColor(30,41,59);
  doc.text(state.approbNom || 'CDB Noureddine ERRAZI', pageWidth - marginX - 70, y);
  doc.setFont('helvetica','normal');
  doc.setTextColor(100,116,139);
  doc.text(state.approbFonction||'Responsable Désigné Opérations Aériennes', pageWidth - marginX - 70, y + 4);

  // Footer — thin gray rule + gray ref/diffusion text + page number, drawn on every page once total is known
  const totalPages = doc.internal.getNumberOfPages();
  for(let p = 1; p <= totalPages; p++){
    doc.setPage(p);
    if(FCN){ sgsCartouche(doc,FCN,p,totalPages); continue; }
    doc.setDrawColor(221,227,237);
    doc.setLineWidth(0.2);
    doc.line(marginX, pageHeight - 14, pageWidth - marginX, pageHeight - 14);
    doc.setFont('helvetica','normal');
    doc.setFontSize(7.8);
    doc.setTextColor(148,163,184);
    doc.text(`${state.ref} — Diffusion : ${state.to || 'PNT / Encadrement opérationnel'} — Document interne`, marginX, pageHeight - 10);
    doc.text(`Page ${p}`, pageWidth - marginX, pageHeight - 10, { align:'right' });
  }

  // Sanitize: a ref containing "/" or other path chars would break the download.
  const safeName = String(state.ref || 'note-de-service').replace(/[\/\\:*?"<>|]/g, '-');
  doc.save(`${safeName}.pdf`);
}




/* ── Champ éditable en place — équivalent React de [contenteditable] + syncStateFromDOM ── */
function NdsEditable({ html, field, live, onCommit, style, tag }){
  const ref = useRef(null);
  useEffect(()=>{
    if(ref.current && ref.current.innerText !== (html||'')) ref.current.innerText = html||'';
  },[html]);
  // Reproduit syncStateFromDOM du PWA d'origine : la saisie est écrite immédiatement
  // dans un registre mutable, sans re-rendu — le clic sur Archiver ou PDF lit donc
  // toujours la dernière valeur, même si le champ vient d'être modifié.
  const write=()=>{ if(ref.current && live && field) live.current[field] = ref.current.innerText; };
  const T = tag || 'div';
  return React.createElement(T, {
    ref, contentEditable:true, suppressContentEditableWarning:true,
    onInput: write,
    onBlur: ()=>{ write(); if(ref.current && onCommit) onCommit(ref.current.innerText.trim()); },
    style: {...(style||{}), outline:"none", cursor:"text", borderRadius:3, transition:"background .15s"},
    onFocus: e=>{ e.currentTarget.style.background="rgba(15,31,61,0.05)"; },
    onBlurCapture: e=>{ e.currentTarget.style.background="transparent"; }
  });
}

  return (
          <div style={{background:"white",border:"1.5px solid "+C.border,borderRadius:12,padding:"14px 16px",marginBottom:10}}>
            <div style={{fontFamily:"monospace",fontSize:12,fontWeight:700,color:"#DC2626",marginBottom:5}}>{r.ref}</div>
            <div style={{fontSize:13,fontWeight:500,color:C.text,lineHeight:1.4}}>{r.objet||'(sans objet)'}</div>
            <div style={{fontSize:11,color:C.slate,marginTop:5,marginBottom:10}}>{r.category} · {r.date}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
              <button onClick={()=>onOpen(r)} style={b}>Ouvrir</button>
              <button onClick={pdf} style={b}>PDF</button>
              <button onClick={()=>onDelete(r.id)} style={{...b,border:"1.5px solid #FCA5A5",color:"#DC2626"}}>Supprimer</button>
            </div>
          </div>
  );
}

function FormNDS({ onBack, safetyData, flights, aircraft, archive, setArchive }){
  const [tab,setTab]=useState("editor");           // editor | archive
  const [cat,setCat]=useState(NDS_CATEGORIES[2]);
  const [ref,setRef]=useState(ndsNextRef('NS-OPS'));
  const [subject,setSubject]=useState("");
  const [keyPoints,setKeyPoints]=useState("");
  const [toCustom,setToCustom]=useState("");
  const [diffusion,setDiffusion]=useState(["Ensemble des Pilotes (PNT)","Encadrement Opérations"]);
  const [from,setFrom]=useState("Direction des Opérations Aériennes");
  const [approbNom,setApprobNom]=useState("CDB Noureddine ERRAZI");
  const [mode,setMode]=useState("nds");              // nds | re | as
  const [reEvent,setReEvent]=useState("");           // événement sélectionné
  const [reNarratif,setReNarratif]=useState("");     // récit des faits
  const [rePhase,setRePhase]=useState("");
  const [reMeteo,setReMeteo]=useState("");
  const [reConseq,setReConseq]=useState("");
  const [reActions,setReActions]=useState("");
  const [asPeriode,setAsPeriode]=useState("90");     // jours
  const [classification,setClassification]=useState("Diffusion interne");
  const [revision,setRevision]=useState("01");
  const [loading,setLoading]=useState(false);
  const [progress,setProgress]=useState(null);   // {done,total} sections reçues
  const [err,setErr]=useState("");
  const [note,setNote]=useState(null);
  // Migration unique : reprend les notes de l'ancien stockage local, puis
  // répare les identifiants dupliqués s'il y en a.
  useEffect(()=>{
    const legacy=ndsLegacyArchive();
    if(!legacy.length && !ndsRepairIds(archive)) return;
    setArchive(prev=>{
      const cur=Array.isArray(prev)?prev.slice():[];
      const refs=new Set(cur.map(r=>r.ref));
      legacy.forEach(r=>{ if(!refs.has(r.ref)) cur.push(r); });
      ndsRepairIds(cur);
      return cur;
    });
    if(legacy.length) ndsClearLegacy();
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);
  const live=useRef({});   // valeurs en cours de saisie (équivalent de l'objet state du PWA)
  const [search,setSearch]=useState("");
  const [archFam,setArchFam]=useState("ALL");   // filtre par famille : ALL, NS, RE, ND, AS
  const [toast,setToast]=useState("");

  const flash=(m)=>{ setToast(m); setTimeout(()=>setToast(""),2800); };
  // Événements de sécurité, du plus récent au plus ancien
  const sortedEvents=()=> (safetyData||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const eventKey=(e)=> `${e.date}|${e.num}|${e.from||''}|${e.to||''}`;
  const selectedEvent=()=> sortedEvents().find(e=>eventKey(e)===reEvent) || null;
  // Vol correspondant à l'événement, pour enrichir le rapport
  const linkedFlight=(e)=> (flights||[]).find(f=>
      f.date===e.date && (f.acId===e.acId || f.num===e.num ||
      ((f.from===e.from)&&(f.to===e.to)))) || null;
  // Événements compris dans la période d'analyse
  const asEvents=()=>{
    const j=Number(asPeriode)||90;
    const lim=new Date(); lim.setHours(0,0,0,0); lim.setDate(lim.getDate()-j);
    return (safetyData||[]).filter(e=>{
      const d=new Date(e.date); return !isNaN(d) && d>=lim;
    }).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  };

  const refBase=()=> mode==="re" ? "RE" : mode==="dgac" ? "ND" : mode==="as" ? "AS" : "NS-"+((cat&&cat.prefix)||"OPS");
  const selectCat=(c)=>{ setCat(c); if(mode==="nds") setRef(ndsNextRef("NS-"+c.prefix)); };
  const selectMode=(m)=>{
    if(!m) return;
    setMode(m); setErr("");
    // Le responsable Qualité / SGS est destinataire d'office des documents SGS.
    if(m==="re"||m==="as")
      setDiffusion(d=>d.includes('Responsable Qualité / SGS')?d:[...d,'Responsable Qualité / SGS']);
    setRef(ndsNextRef(m==="re"?"RE":m==="dgac"?"ND":m==="as"?"AS":"NS-"+((cat&&cat.prefix)||"OPS")));
    // Mention par défaut : un compte rendu adressé à l'autorité ne relève pas
    // de la diffusion interne. Le champ reste modifiable document par document.
    setClassification(prev=>{
      if(m==="dgac") return prev==="Diffusion interne" ? "Notification à l'autorité" : prev;
      return prev==="Notification à l'autorité" ? "Diffusion interne" : prev;
    });
  };
  const toggleDiff=(opt)=>setDiffusion(d=>d.includes(opt)?d.filter(x=>x!==opt):[...d,opt]);
  const computeTo=()=>{
    if(mode==="dgac") return DGAC_DESTINATAIRE;   // pas de diffusion interne
    const p=[...diffusion]; if(toCustom.trim()) p.push(toCustom.trim()); return p.join(', ');
  };

  // Fusionne les saisies en cours dans la note — équivalent de syncStateFromDOM()
  const syncNote=(n)=>{
    if(!n) return n;
    const L=live.current;
    const out={...n};
    ['ref','date','from','to','classification','revision','objet','intro'].forEach(k=>{
      if(L[k]!==undefined) out[k]=String(L[k]).trim();
    });
    if(L.closing!==undefined){ out.closing=String(L.closing).trim(); out.closingText=out.closing; }
    out.sections=(n.sections||[]).map((s,i)=>({
      ...s,
      title:   L['sec'+i+'title']  !==undefined ? String(L['sec'+i+'title']).trim()  : s.title,
      content: L['sec'+i+'content']!==undefined ? String(L['sec'+i+'content'])        : s.content
    }));
    return out;
  };

  const saveToArchive=()=>{
    if(!note) return;
    const cur=syncNote(note);
    setNote(cur);
    const arch=(archive||[]).slice();
    const idx=arch.findIndex(r=>r.ref===cur.ref);
    const record={
      ...cur,
      // id placé APRÈS le spread : sinon l'id hérité de la note ouverte
      // écrase le nouvel identifiant et deux archives partagent la même clé.
      id: idx>=0?arch[idx].id:(cur.ref+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)),
      category: mode==="nds" ? (cat?cat.label:'') : (NDS_MODES.find(m=>m.id===mode)||{}).label || '',
      savedAt: new Date().toISOString()
    };
    if(idx>=0){ arch[idx]=record; flash('Note mise à jour — '+record.ref); }
    else { arch.unshift(record); ndsCommitRef(refBase()); setRef(ndsNextRef(refBase())); flash('Note enregistrée — '+record.ref); }
    setArchive(arch);
  };

  const deleteFromArchive=async(id)=>{
    if(!(await uiConfirm('Supprimer cette note des archives ?'))) return;
    setArchive(prev=>(prev||[]).filter(r=>r.id!==id));
  };

  const openFromArchive=(r)=>{
    live.current={};
    const c=NDS_CATEGORIES.find(x=>x.label===r.category)||null;
    if(c){ setCat(c); }
    if(r.from) setFrom(r.from);
    if(r.approbNom) setApprobNom(r.approbNom);
    setNote({...r, closing:r.closingText||r.closing||''});
    setRef(r.ref); setTab("editor");
  };

  const importNotes=()=>{
    const input=document.createElement("input");
    input.type="file"; input.accept=".json";
    input.onchange=async(e)=>{
      const file=e.target.files[0]; if(!file) return;
      try{
        const parsed=JSON.parse(await file.text());
        const records=Array.isArray(parsed)?parsed:[parsed];
        const arch=(archive||[]).slice();
        let imported=0, replaced=0;
        records.forEach(rec=>{
          if(!rec||!rec.ref||!Array.isArray(rec.sections)) return;
          const entry={
            id: rec.ref+'-'+Date.now()+'-'+imported+'-'+Math.random().toString(36).slice(2,8),
            ref: rec.ref,
            date: rec.date||'',
            from: rec.from||'Direction des Opérations Aériennes',
            to: rec.to||'',
            classification: rec.classification||'Diffusion interne',
            revision: rec.revision||'01',
            approbNom: rec.approbNom||'CDB Noureddine ERRAZI',
            docType: rec.docType||'NOTE DE SERVICE',
            objet: rec.objet||'',
            intro: rec.intro||'',
            sections: ndsRenumber(rec.sections),
            closingText: rec.closingText||rec.closing||'',
            category: rec.category||'',
            savedAt: new Date().toISOString()
          };
          const idx=arch.findIndex(r=>r.ref===entry.ref);
          if(idx>=0){ entry.id=arch[idx].id; arch[idx]=entry; replaced++; }
          else { arch.unshift(entry); }
          imported++;
        });
        if(imported===0){ flash('Fichier non reconnu — format de note invalide.'); return; }
        setArchive(arch);
        flash(replaced===imported
          ? (imported>1?imported+' notes mises à jour.':'Note mise à jour dans les archives.')
          : (imported>1?imported+' notes importées.':'Note importée dans les archives.'));
      }catch(_e){ flash('Échec de l\u2019import : fichier JSON invalide.'); }
    };
    input.click();
  };

  const generate=async()=>{
    setErr("");
    // Contrôles propres à chaque mode
    if(mode==="nds"){
      if(!subject.trim()){ setErr("Le sujet de la note est requis."); return; }
      if(!cat){ setErr("Sélectionnez une catégorie."); return; }
    } else if(mode==="re"||mode==="dgac"){
      if(!reNarratif.trim()){ setErr("La description factuelle de l'événement est requise."); return; }
    } else {
      if(asEvents().length===0){ setErr("Aucun événement de sécurité sur la période choisie."); return; }
    }
    setProgress(null);
    setLoading(true);
    const to=computeTo();

    // Règles de format communes aux trois documents
    const FORMAT_RULES=`Réponds UNIQUEMENT avec un objet JSON valide, sans texte avant/après, sans balises markdown, au format exact :
{
  "objet": "phrase d'objet complète et précise, en une ou deux lignes",
  "intro": "paragraphe d'introduction (3-5 phrases)",
  "sections": [
    {"title": "Titre de section", "content": "contenu détaillé"},
    {"title": "Section avec tableau", "content": "phrase d'intro courte ou chaîne vide", "table": {"headers": ["...","...","..."], "rows": [["...","...","..."]], "note": "Nota : ... (facultatif)"}}
  ]
}

Mise en forme du champ "content" (obligatoire, pour un rendu PDF correct) :
- Sous-titre éventuel EN MAJUSCULES sur sa propre ligne (séparée par \\n), au format "1. TITRE".
- Chaque puce commence par "• " et occupe sa propre ligne (séparée par \\n).
- Les phrases de liaison restent en paragraphe normal, sur leur propre ligne.

Format JSON strict : échappe tous les retours à la ligne en \\n et tous les guillemets internes en \\" à l'intérieur des chaînes. N'insère jamais un saut de ligne réel dans une valeur de chaîne. N'utilise pas de guillemets typographiques à l'intérieur du JSON.`;

    let skeleton, systemPrompt, userPrompt;

    // ══ MODE 1 — NOTE DE SERVICE ══ (inchangé)
    if(mode==="nds"){
      const touchesMaint=diffusion.includes('Maintenance / Technique');
      const touchesCrew=diffusion.includes('Ensemble des Pilotes (PNT)')||diffusion.includes('Encadrement Opérations');
      const shouldFuse=touchesMaint&&touchesCrew&&['technique','operationnel'].includes(cat.id);
      const FUSION=['Contexte','Causes et mécanismes techniques','Risques opérationnels et techniques','Mesures d\u2019atténuation et modalités d\u2019application','Procédures équipage, maintenance et responsabilités'];
      skeleton=shouldFuse?FUSION:cat.sections;
      const fusionInstr=shouldFuse?`\n\nCette note est diffusée à la fois au personnel navigant (${to}) et à la maintenance technique : chaque section pertinente doit combiner l'angle technique (causes, mécanismes physiques, paramètres moteur, seuils) ET l'angle opérationnel/procédural (actions équipage, seuils de déclenchement, procédures, responsabilités). Ne traite pas un seul angle en ignorant l'autre — les deux publics doivent trouver une information directement exploitable pour leur rôle respectif.`:'';

      systemPrompt=`Tu rédiges des notes de service internes pour une compagnie aérienne. ${NDS_STYLE_REF}

${FORMAT_RULES}

La note doit obligatoirement comporter ces sections, dans cet ordre, avec des titres identiques ou très proches : ${skeleton.join(' / ')}.
Chaque section doit contenir un contenu substantiel (60 à 120 mots), concret et actionnable, pas de généralités vagues — reste dans cette fourchette, ne dépasse pas 120 mots par section.${fusionInstr}

Tableau des risques (obligatoire dès qu'une section traite des risques — titre contenant "Risque(s)") : ajoute un champ "table" avec exactement les colonnes ["Risque","Origine / Facteur déclenchant","Conséquence opérationnelle"] et 4 à 7 lignes concrètes et spécifiques au sujet. Le "content" de cette section reste court. N'ajoute PAS de champ "table" pour les autres sections.`;

      userPrompt=`Sujet de la note : ${subject}
Catégorie : ${cat.label}
Diffusion : ${to}
${keyPoints?'Points clés à intégrer impérativement :\n'+keyPoints:''}`;
    }

    // ══ MODE 2 — RAPPORT D'ÉVÉNEMENT ══
    else if(mode==="re"||mode==="dgac"){
      skeleton = mode==="dgac" ? DGAC_SECTIONS : RE_SECTIONS;
      const ev=selectedEvent();
      const vol=ev?linkedFlight(ev):null;
      const faits=[];
      if(ev){
        faits.push(`Date de l'événement : ${ev.date}`);
        faits.push(`Appareil : ${ev.num}`);
        if(ev.from||ev.to) faits.push(`Route : ${ev.from||'?'} → ${ev.to||'?'}`);
        const lab=safetyLabels(ev);
        if(lab.length) faits.push(`Indicateurs enregistrés : ${lab.join(', ')}`);
      }
      if(vol){
        if(vol.num)  faits.push(`N° de vol : ${vol.num}`);
        if(vol.cm1)  faits.push(`CDB : ${vol.cm1}`);
        if(vol.cm2)  faits.push(`OPL : ${vol.cm2}`);
        if(vol.cc)   faits.push(`PNC : ${vol.cc}`);
        if(vol.pax!==undefined&&vol.pax!=='') faits.push(`Passagers : ${vol.pax}`);
        if(vol.dep)  faits.push(`Départ prévu (GMT) : ${vol.dep}`);
        if(vol.delayMin) faits.push(`Retard constaté : ${vol.delayMin} min`);
      }
      if(rePhase)  faits.push(`Phase de vol : ${rePhase}`);
      if(reMeteo)  faits.push(`Conditions météorologiques : ${reMeteo}`);
      if(reConseq) faits.push(`Conséquences rapportées : ${reConseq}`);
      if(reActions)faits.push(`Actions immédiates rapportées : ${reActions}`);

      const ANTI_INVENTION = `RÈGLE ABSOLUE — N'INVENTE AUCUN FAIT. Tu ne disposes que des éléments transmis par le rédacteur. Il t'est interdit d'ajouter une altitude, une vitesse, un cap, une heure, un nom, un relevé météo ou tout autre élément factuel qui ne t'a pas été fourni. Lorsqu'une information manque pour renseigner une rubrique, écris explicitement « Non renseigné » ou « À compléter par le rédacteur ». Un document incomplet est acceptable ; un document inventé ne l'est pas.`;

      if(mode==="dgac"){
        // ── Notification à l'autorité : strictement factuelle ──
        systemPrompt=`Tu rédiges un compte rendu d'événement destiné à l'autorité de l'aviation civile, au titre de l'obligation de notification. ${NDS_STYLE_REF}

${FORMAT_RULES}

Le compte rendu doit comporter ces sections, dans cet ordre, avec des titres identiques ou très proches : ${skeleton.join(' / ')}.

${ANTI_INVENTION}

CARACTÈRE STRICTEMENT FACTUEL — Ce document présente les faits constatés, rien d'autre. Il t'est formellement interdit d'y faire figurer une analyse des causes, des facteurs contributifs, des hypothèses explicatives, une évaluation du risque ou une quelconque appréciation sur la conduite des personnes concernées. N'écris jamais qu'un équipage a commis une erreur, a tardé, a omis ou a mal interprété : décris uniquement ce qui a été fait et observé, dans l'ordre chronologique. Ces éléments d'analyse relèvent du compte rendu interne, qui fait l'objet d'un document distinct.

Les sections « Identification », « Aéronef », « Vol », « Événement », « Conditions météorologiques », « Conséquences » et « Suites » doivent être présentées sous forme de champs courts, une information par ligne, au format « Libellé : valeur ». N'y rédige pas de paragraphes. Lorsqu'une donnée est absente, porte « Non renseigné ».

Les sections « Description factuelle » et « Actions immédiates » sont rédigées en paragraphes courts, au passé, à la voix active, dans l'ordre chronologique.

N'ajoute AUCUN tableau à ce document.

Termine la dernière section en rappelant que le présent compte rendu présente les faits constatés, à l'exclusion de toute appréciation sur leurs causes, et que l'analyse des facteurs contributifs fait l'objet d'un document interne distinct.`;
      } else {
        // ── Rapport interne SGS : analyse et facteurs contributifs ──
        systemPrompt=`Tu rédiges un compte rendu d'événement interne pour le système de gestion de la sécurité d'une compagnie aérienne, dans l'esprit du règlement (UE) 376/2014 relatif aux comptes rendus d'événements dans l'aviation civile. ${NDS_STYLE_REF}

${FORMAT_RULES}

Le rapport doit comporter ces sections, dans cet ordre, avec des titres identiques ou très proches : ${skeleton.join(' / ')}.

${ANTI_INVENTION}

Distingue nettement les faits établis, repris des éléments fournis, et l'analyse, qui relève de l'hypothèse. Dans la section d'analyse, introduis les hypothèses par des formulations explicites du type « il est possible que » ou « cette hypothèse reste à confirmer ».

Section « Évaluation du risque » : ajoute un champ "table" avec les colonnes ["Critère","Appréciation proposée","Justification"] portant sur la gravité, la probabilité de récurrence et le niveau de risque qui en découle. Ajoute un champ "note" rappelant que cette appréciation est une proposition soumise à la validation du responsable SGS. N'ajoute PAS de tableau aux autres sections.

Ton factuel, neutre, sans jugement sur les personnes. Ne désigne jamais un membre d'équipage comme responsable.`;
      }

      userPrompt=`ÉLÉMENTS FACTUELS ENREGISTRÉS PAR L'APPLICATION :
${faits.length?faits.join('\n'):'(aucun élément structuré disponible)'}

DESCRIPTION DES FAITS PAR LE RÉDACTEUR :
${reNarratif}
${subject.trim()?'\nPRÉCISIONS COMPLÉMENTAIRES :\n'+subject:''}
${keyPoints.trim()?'\nPOINTS À INTÉGRER IMPÉRATIVEMENT :\n'+keyPoints:''}

Exploitant : Sahara Aviation S.A.S. — Afrijet Sahara, base de Dakhla (GMMH).
Déclarant : ${approbNom}, Responsable Désigné Opérations Aériennes.
Diffusion prévue : ${to||'Non précisée'}`;
    }

    // ══ MODE 3 — ANALYSE DE SÉCURITÉ ══
    else {
      skeleton=AS_SECTIONS;
      const evs=asEvents();
      const jours=Number(asPeriode);
      const compte={};
      SAFETY_FLAGS.forEach(f=>{ compte[f.l]=evs.filter(e=>e[f.k]).length; });
      const parAppareil={};
      evs.forEach(e=>{ parAppareil[e.num]=(parAppareil[e.num]||0)+1; });
      const parRoute={};
      evs.forEach(e=>{ const r=(e.from||'?')+'→'+(e.to||'?'); parRoute[r]=(parRoute[r]||0)+1; });

      const detail=evs.map(e=>`${e.date} · ${e.num} · ${e.from||'?'}→${e.to||'?'} · ${safetyLabels(e).join(', ')||'aucun indicateur'}`).join('\n');

      systemPrompt=`Tu réalises l'analyse périodique des événements de sécurité d'une compagnie aérienne, dans l'esprit d'un système de gestion de la sécurité (SGS). ${NDS_STYLE_REF}

${FORMAT_RULES}

L'analyse doit comporter ces sections, dans cet ordre, avec des titres identiques ou très proches : ${skeleton.join(' / ')}.

RÈGLE ABSOLUE — Tu ne disposes que des données chiffrées transmises. N'invente aucun événement, aucune circonstance, aucune cause que les données ne permettent pas d'établir. Les indicateurs enregistrés sont des cases à cocher : ils indiquent qu'un type d'événement est survenu, sans en décrire les circonstances. Tu peux donc constater des récurrences, mais pas en expliquer l'origine — présente toute explication comme une hypothèse à vérifier.

Sois explicite sur les limites : signale que l'analyse porte sur des indicateurs déclaratifs, que l'absence d'enregistrement ne vaut pas absence d'événement, et qu'un effectif faible interdit toute conclusion statistique.

Section « Données de la période » : ajoute un champ "table" avec les colonnes ["Indicateur","Occurrences","Observation"] reprenant exactement les comptes fournis, sans les modifier. N'ajoute PAS de tableau aux autres sections.

Les recommandations doivent être concrètes et proportionnées au volume constaté. N'appelle pas à des mesures lourdes sur la foi d'une seule occurrence.`;

      userPrompt=`PÉRIODE ANALYSÉE : ${jours} derniers jours
NOMBRE TOTAL D'ÉVÉNEMENTS ENREGISTRÉS : ${evs.length}

COMPTE PAR INDICATEUR :
${SAFETY_EVENTS.map(x=>{const f=SAFETY_FLAGS.find(y=>y.k===x.k); return `${f.l} : ${compte[f.l]}`+(x.manuel?` (valeur cible ${x.cible}, seuil d'analyse ${x.seuil})`:' (hors tableau du manuel SGS)');}).join('\n')}

RÉPARTITION PAR APPAREIL :
${Object.entries(parAppareil).map(([k,v])=>`${k} : ${v}`).join('\n')||'—'}

RÉPARTITION PAR ROUTE :
${Object.entries(parRoute).map(([k,v])=>`${k} : ${v}`).join('\n')||'—'}

DÉTAIL DES ÉVÉNEMENTS :
${detail||'—'}
${subject.trim()?'\nCONTEXTE FOURNI PAR LE RÉDACTEUR :\n'+subject:''}
${keyPoints.trim()?'\nPOINTS À INTÉGRER :\n'+keyPoints:''}

Diffusion prévue : ${to||'Non précisée'}`;
    }

    const body={max_tokens:5000,system:systemPrompt,messages:[{role:"user",content:userPrompt}]};

    // Lit la réponse en flux. Le JSON n'est analysé qu'une fois le flux terminé :
    // un JSON partiel n'est jamais parsable. La progression sert uniquement d'affichage.
    const readStream=async()=>{
      const r=await fetch("/api/generate",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({...body,stream:true})
      });
      if(!r.ok){
        let d={}; try{ d=await r.json(); }catch(_e){ logSilent(_e); }
        const e=new Error((d.error&&d.error.message)||d.error||'Erreur API');
        e.fatal=true; throw e;   // erreur de l'API : le repli échouerait pareil
      }
      if(!r.body||!r.body.getReader) throw new Error('STREAM_UNSUPPORTED');
      const reader=r.body.getReader(), dec=new TextDecoder();
      let buf='', text='';
      while(true){
        const {done,value}=await reader.read();
        if(done) break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n'); buf=lines.pop()||'';
        for(const line of lines){
          if(!line.startsWith('data:')) continue;
          const payload=line.slice(5).trim();
          if(!payload||payload==='[DONE]') continue;
          let ev; try{ ev=JSON.parse(payload); }catch(_e){ continue; }
          if(ev.type==='content_block_delta'&&ev.delta&&typeof ev.delta.text==='string'){
            text+=ev.delta.text;
            // Titres de section déjà reçus, pour situer l'avancement
            const n=(text.match(/"title"\s*:/g)||[]).length;
            setProgress({done:Math.min(n,skeleton.length), total:skeleton.length});
          } else if(ev.type==='error'){
            const e=new Error((ev.error&&ev.error.message)||'Erreur pendant la génération');
            e.fatal=true; throw e;
          }
        }
      }
      if(!text.trim()) throw new Error('Réponse vide');
      return text;
    };

    // Appel classique, conservé comme repli si le flux échoue.
    const readPlain=async()=>{
      const r=await fetch("/api/generate",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify(body)
      });
      const d=await r.json();
      if(!r.ok) throw new Error((d.error&&d.error.message)||d.error||'Erreur API');
      return (d.content||[]).map(b=>b.text||'').join('\n');
    };

    try{
      let raw;
      try{
        raw=await readStream();
      }catch(se){
        if(se && se.fatal) throw se;      // inutile de réessayer
        setProgress(null);                 // flux indisponible ou vide : repli
        raw=await readPlain();
      }
      let clean=raw.replace(/```json|```/g,'').trim();
      let parsed;
      try{ parsed=JSON.parse(clean); }
      catch(_pe){
        let rep='',inStr=false,prev='';
        for(const ch of clean){
          if(ch==='"'&&prev!=='\\'){ inStr=!inStr; rep+=ch; prev=ch; continue; }
          if(inStr&&(ch==='\n'||ch==='\r')){ rep+='\\n'; prev=ch; continue; }
          rep+=ch; prev=ch;
        }
        parsed=JSON.parse(rep);
      }
      live.current={};
      setNote({
        ref, date:new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}),
        from, to, classification, revision,
        approbNom,
        docType:(NDS_MODES.find(m=>m.id===mode)||NDS_MODES[0]).docType,
        objet:parsed.objet||'', intro:parsed.intro||'',
        sections:ndsRenumber(parsed.sections||[]),
        closing:'Cette note de service est applicable dès diffusion et doit être portée à la connaissance du personnel concerné. Toute question ou retour d\u2019expérience relatif à son application est à adresser à la Direction des Opérations Aériennes.'
      });
    }catch(e){
      const net=e instanceof TypeError&&/fetch/i.test(e.message||'');
      setErr(net?'Connexion interrompue pendant la génération (délai serveur dépassé sur les notes longues). Réessayez.':'Erreur de génération : '+(e.message||'réessayez.'));
    }
    setLoading(false);
    setProgress(null);
  };

  const TabBar = (
    <div style={{display:"flex",gap:8,marginBottom:14}}>
      <button onClick={()=>setTab("editor")}
        style={{flex:1,height:38,borderRadius:9,border:"1.5px solid "+(tab==="editor"?C.navy:C.border),
          background:tab==="editor"?C.navy:"white",color:tab==="editor"?"white":C.slate,
          fontSize:12,fontWeight:700,...TAP}}>

      <button onClick={()=>setTab("archive")}
        style={{flex:1,height:38,borderRadius:9,border:"1.5px solid "+(tab==="archive"?C.navy:C.border),
          background:tab==="archive"?C.navy:"white",color:tab==="archive"?"white":C.slate,
          fontSize:12,fontWeight:700,...TAP}}>
        Archives ({archive.length})
      </button>
    </div>
  );

  const Toast = toast ? (
    <div style={{position:"fixed",left:"50%",bottom:80,transform:"translateX(-50%)",background:C.navy,color:"white",
      fontSize:12.5,padding:"11px 18px",borderRadius:10,boxShadow:"0 8px 24px rgba(0,0,0,.25)",zIndex:950,maxWidth:"88vw",textAlign:"center"}}>
      {toast}
    </div>
  ) : null;

  // ══ ARCHIVES ══
  if(tab==="archive"){
    const f=search.toLowerCase();
    const fam=r=>String(r.ref||'').split('-')[0].toUpperCase();
    const FAMS=[{k:"ALL",l:"Tous"},{k:"NS",l:"NS"},{k:"RE",l:"RE"},{k:"ND",l:"ND"},{k:"AS",l:"AS"}];
    const count=k=>k==="ALL"?archive.length:archive.filter(r=>fam(r)===k).length;
    const filtered=archive.filter(r=>archFam==="ALL"||fam(r)===archFam).filter(r=>
      (r.ref||'').toLowerCase().includes(f)||
      (r.objet||'').toLowerCase().includes(f)||
      (r.category||'').toLowerCase().includes(f))
      .slice().sort((a,b)=>ndsDateKey(b)-ndsDateKey(a));   // plus récente en tête
    return (
      <Card accent="#0F1F3D">
        {Toast}
        <FHeader icon="📋" title="Archives" subtitle="Documents du générateur IA" color="#0F1F3D"/>
        {TabBar}
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher par référence, sujet ou catégorie…"

          <button onClick={importNotes}

            Importer
          </button>
        </div>
        <div style={{display:"flex",gap:6,marginBottom:12}}>
          {FAMS.map(x=>{
            const on=archFam===x.k, n=count(x.k);
            return (
              <button key={x.k} onClick={()=>setArchFam(x.k)}
                style={{flex:1,height:36,borderRadius:9,fontSize:11.5,fontWeight:700,...TAP,
                  border:"1.5px solid "+(on?C.navy:C.border),background:on?C.navy:"white",color:on?"white":(n?C.navy:C.slateL)}}>
                {x.l} <span style={{opacity:.75,fontWeight:600}}>{n}</span>
              </button>
            );
          })}
        </div>
        {filtered.length===0&&(
          <div style={{textAlign:"center",color:C.slateL,fontSize:13,padding:"40px 0"}}>
            Aucun document{archFam!=="ALL"?" de ce type":""}{search?" pour cette recherche":""}.

        )}
        {filtered.map(r=>(
          <ArchiveCard key={r.id} r={r} onOpen={openFromArchive} onDelete={deleteFromArchive}/>

        <button onClick={onBack}
          style={{width:"100%",height:46,marginTop:6,background:C.bg,border:"1.5px solid "+C.border,borderRadius:10,color:C.slate,fontSize:13,fontWeight:600,cursor:"pointer"}}>← Retour</button>
      </Card>

  }

  // ══ APERÇU NOTE — édition en place ══
  if(note){
    const upd=(patch)=>setNote(n=>({...n,...patch}));
    const updSec=(i,patch)=>setNote(n=>({...n,sections:n.sections.map((s,j)=>j===i?{...s,...patch}:s)}));
    return (
    <Card accent="#0F1F3D">
      {Toast}
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,flexWrap:"wrap"}}>

        <button onClick={saveToArchive} style={{background:"white",border:"1.5px solid "+C.navy,borderRadius:8,padding:"7px 12px",cursor:"pointer",color:C.navy,fontSize:11.5,fontWeight:700}}>💾 Archiver</button>
        <button onClick={()=>{try{const c=syncNote(note);setNote(c);ndsExportPDF(c);}catch(e){uiAlert("Erreur PDF : "+e.message);}}}
          style={{marginLeft:"auto",background:C.navy,border:"none",borderRadius:8,padding:"8px 16px",cursor:"pointer",color:"white",fontSize:11.5,fontWeight:700}}>📄 PDF</button>

      <div style={{fontSize:10.5,color:C.slate,marginBottom:8,fontStyle:"italic"}}>✏️ Touchez un texte pour le modifier directement.</div>
      <div style={{background:"white",border:"1px solid "+C.border,borderRadius:10,padding:"18px 16px",maxHeight:"58vh",overflowY:"auto"}}>
        <div style={{fontSize:10,color:C.slate,letterSpacing:"0.08em",marginBottom:4}}>{note.docType||"NOTE DE SERVICE"}</div>
        <NdsEditable html={note.ref} field="ref" live={live} onCommit={v=>upd({ref:v})}

        <div style={{display:"flex",gap:6,alignItems:"center",fontSize:11,color:C.slate,marginTop:2,marginBottom:12,flexWrap:"wrap"}}>

          <span>·</span>
          <NdsEditable html={note.classification} field="classification" live={live} onCommit={v=>upd({classification:v})} style={{display:"inline-block"}}/>
          <span>· Rév.</span>
          <NdsEditable html={note.revision} field="revision" live={live} onCommit={v=>upd({revision:v})} style={{display:"inline-block",minWidth:22}}/>
        </div>
        <div style={{display:"flex",gap:6,fontSize:11,color:C.slate,marginBottom:2}}>
          <b style={{flexShrink:0}}>De :</b>
          <NdsEditable html={note.from} field="from" live={live} onCommit={v=>upd({from:v})} style={{flex:1}}/>
        </div>
        <div style={{display:"flex",gap:6,fontSize:11,color:C.slate,marginBottom:12}}>
          <b style={{flexShrink:0}}>À :</b>
          <NdsEditable html={note.to} field="to" live={live} onCommit={v=>upd({to:v})} style={{flex:1}}/>
        </div>
        <div style={{marginBottom:8,paddingBottom:8,borderBottom:"1px solid "+C.border}}>
          <span style={{fontWeight:700,fontSize:13,color:C.navy}}>Objet : </span>
          <NdsEditable html={note.objet} field="objet" live={live} onCommit={v=>upd({objet:v})}
            style={{fontWeight:700,fontSize:13,color:C.navy,display:"inline-block",width:"100%"}}/>
        </div>
        <NdsEditable html={note.intro} field="intro" live={live} onCommit={v=>upd({intro:v})}
          style={{fontSize:12,lineHeight:1.6,color:C.text,marginBottom:14}}/>
        {(note.sections||[]).map((s,i)=>(
          <div key={i} style={{marginBottom:14}}>
            <div style={{display:"flex",gap:5,alignItems:"baseline"}}>
              <span style={{fontWeight:700,fontSize:12,color:C.navy,flexShrink:0}}>{i+1}.</span>
              <NdsEditable html={s.title} field={"sec"+i+"title"} live={live} onCommit={v=>updSec(i,{title:v})}
                style={{fontWeight:700,fontSize:12,color:C.navy,flex:1,marginBottom:5}}/>
            </div>
            <NdsEditable html={s.content} field={"sec"+i+"content"} live={live} onCommit={v=>updSec(i,{content:v})}
              style={{fontSize:11.5,lineHeight:1.6,color:C.text,whiteSpace:"pre-wrap"}}/>
            {s.table&&s.table.rows&&(
              <div style={{marginTop:8,overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
                  <thead><tr>{(s.table.headers||[]).map((h,j)=>(
                    <th key={j} style={{background:C.navy,color:"white",padding:"5px 7px",textAlign:"left",fontWeight:700,border:"1px solid "+C.border}}>{h}</th>
                  ))}</tr></thead>
                  <tbody>{s.table.rows.map((r,ri)=>(
                    <tr key={ri} style={{background:ri%2?"#F8FAFC":"white"}}>
                      {r.map((c,ci)=><td key={ci} style={{padding:"5px 7px",border:"1px solid "+C.border,verticalAlign:"top"}}>{c}</td>)}
                    </tr>
                  ))}</tbody>
                </table>
                {s.table.note&&<div style={{fontSize:10,color:C.slate,fontStyle:"italic",marginTop:5}}>{s.table.note}</div>}
              </div>
            )}
          </div>
        ))}
        <NdsEditable html={note.closingText||note.closing} field="closing" live={live} onCommit={v=>upd({closing:v,closingText:v})}
          style={{fontSize:11,lineHeight:1.6,color:C.slate,fontStyle:"italic",paddingTop:10,borderTop:"1px solid "+C.border}}/>
        <div style={{display:"flex",justifyContent:"space-between",gap:16,marginTop:18,paddingTop:12,borderTop:"1px solid "+C.border}}>
          <div style={{flex:1}}>
            <div style={{fontSize:10,fontWeight:700,color:C.text,marginBottom:3}}>Émis par :</div>
            <div style={{fontSize:9.5,color:C.slate,lineHeight:1.5}}>{note.from}<br/>Sahara Aviation SAS — Afrijet Sahara</div>
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:10,fontWeight:700,color:C.text,marginBottom:3}}>Approuvé par :</div>
            <div style={{fontSize:9.5,fontWeight:700,color:C.text}}>{note.approbNom||"CDB Noureddine ERRAZI"}</div>
            <div style={{fontSize:9.5,color:C.slate}}>Responsable Désigné Opérations Aériennes</div>
          </div>
        </div>
      </div>
    </Card>
    );
  }


  // ══ FORMULAIRE ══
  return (
    <Card accent="#0F1F3D">
      {Toast}
      <FHeader icon="📋" title={(NDS_MODES.find(m=>m.id===mode)||NDS_MODES[0]).label} subtitle="Génération assistée par IA" color="#0F1F3D"/>
      {TabBar}
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        {/* Type de document */}
        <div>
          <FLabel>Type de document</FLabel>
          <CustomSelect value={mode} onChange={selectMode} icon="📋" required
            options={NDS_MODES.map(m=>({value:m.id,label:m.label,sub:m.hint}))}/>
        </div>

        {/* ── Événement : rapport interne et notification DGAC ── */}
        {(mode==="re"||mode==="dgac")&&(<>
          <div>
            <FLabel>Événement enregistré (optionnel)</FLabel>
            <CustomSelect value={reEvent} onChange={setReEvent} searchable
              placeholder="-- Aucun — saisie libre --"
              options={sortedEvents().map(e=>({
                value:eventKey(e),
                label:e.date+" · "+e.num,
                sub:(e.from||"?")+"→"+(e.to||"?")+" · "+(safetyLabels(e).join(", ")||"aucun indicateur")
              }))}/>
            <div style={{fontSize:9.5,color:C.slate,marginTop:4}}>
              Les éléments du vol correspondant seront joints automatiquement au rapport.
            </div>
          </div>
          <div>
            <FLabel>Description factuelle *</FLabel>
            <textarea value={reNarratif} onChange={e=>setReNarratif(e.target.value)}
              placeholder="Que s'est-il passé ? Décrivez les faits observés, dans l'ordre chronologique, sans interprétation."
              style={{width:"100%",minHeight:96,boxSizing:"border-box",background:C.bg,border:"1.5px solid "+C.border,borderRadius:10,padding:"10px 12px",fontSize:13,fontFamily:"inherit",outline:"none",resize:"vertical"}}/>
          </div>
          <div>
            <FLabel>Phase de vol</FLabel>
            <CustomSelect value={rePhase} onChange={setRePhase} placeholder="-- Non renseignée --"
              options={RE_PHASES.map(p=>({value:p,label:p}))}/>
          </div>
          <FField label="Conditions météorologiques" value={reMeteo} onChange={setReMeteo} raw/>
          <FField label="Conséquences constatées" value={reConseq} onChange={setReConseq} raw/>
          <FField label="Actions immédiates prises" value={reActions} onChange={setReActions} raw/>
        </>)}

        {/* ── Analyse de sécurité ── */}
        {mode==="as"&&(
          <div>
            <FLabel>Période analysée</FLabel>
            <div style={{display:"flex",gap:8}}>
              {[{v:"30",l:"30 jours"},{v:"90",l:"90 jours"},{v:"365",l:"1 an"}].map(o=>(
                <button key={o.v} onClick={()=>setAsPeriode(o.v)}
                  style={{flex:1,height:40,borderRadius:10,cursor:"pointer",fontWeight:700,fontSize:12,
                    border:"1.5px solid "+(asPeriode===o.v?C.navy:C.border),
                    background:asPeriode===o.v?C.navy:"white",
                    color:asPeriode===o.v?"white":C.slate,
                    ...NOTAP}}>
                  {o.l}
                </button>
              ))}
            </div>
            <div style={{fontSize:10.5,color:asEvents().length?C.slate:"#DC2626",marginTop:6}}>
              {asEvents().length
                ? asEvents().length+" événement(s) enregistré(s) sur la période."
                : "Aucun événement sur cette période — l'analyse ne peut pas être produite."}
            </div>
          </div>
        )}

        {/* ── Note de service ── */}
        {mode==="nds"&&(
        <div>
          <FLabel>Catégorie</FLabel>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {NDS_CATEGORIES.map(c=>(
              <button key={c.id} onClick={()=>selectCat(c)}
                style={{padding:"10px 8px",borderRadius:10,cursor:"pointer",textAlign:"left",
                  border:"1.5px solid "+(cat&&cat.id===c.id?c.color:C.border),
                  background:cat&&cat.id===c.id?c.color+"15":"white",
                  ...NOTAP}}>
                <div style={{fontWeight:700,fontSize:11,color:cat&&cat.id===c.id?c.color:C.navy}}>{c.label}</div>
                <div style={{fontSize:9,color:C.slate,marginTop:2}}>{c.hint}</div>
              </button>
            ))}
          </div>
        </div>
        )}
        <FField label="Référence" value={ref} onChange={setRef}/>
        <div>
          <FLabel>{mode==="nds"?"Sujet de la note *":mode==="as"?"Contexte de l\u2019analyse":"Précisions complémentaires"}</FLabel>
          <textarea value={subject} onChange={e=>setSubject(e.target.value)}
            placeholder={mode==="nds"
              ? "Ex : Restriction des vols Dakhla–Nouakchott pour travaux de piste"
              : mode==="as"
                ? "Contexte particulier de la période (facultatif)"
                : "Éléments de contexte utiles au document (facultatif)"}
            style={{width:"100%",minHeight:64,boxSizing:"border-box",background:C.bg,border:"1.5px solid "+C.border,borderRadius:10,padding:"10px 12px",fontSize:13,fontFamily:"inherit",outline:"none",resize:"vertical"}}/>
        </div>
        <div>
          <FLabel>Points clés (optionnel)</FLabel>
          <textarea value={keyPoints} onChange={e=>setKeyPoints(e.target.value)}
            placeholder="Éléments à intégrer impérativement, un par ligne"
            style={{width:"100%",minHeight:56,boxSizing:"border-box",background:C.bg,border:"1.5px solid "+C.border,borderRadius:10,padding:"10px 12px",fontSize:13,fontFamily:"inherit",outline:"none",resize:"vertical"}}/>
        </div>
        <FSection title="Diffusion" color="#0F1F3D"/>
        {mode==="dgac" ? (
          <div style={{background:"#EFF6FF",border:"1.5px solid #0369A1",borderRadius:10,padding:"12px 14px"}}>
            <div style={{fontWeight:700,fontSize:12.5,color:"#0369A1"}}>{DGAC_DESTINATAIRE}</div>
            <div style={{fontSize:10.5,color:C.slate,marginTop:4,lineHeight:1.5}}>
              Ce compte rendu est destiné à l’autorité. Les services internes — équipage, maintenance,
              direction — sont informés par le rapport d’événement (RE), qui comporte l’analyse.
            </div>
          </div>
        ) : (
        <div style={{display:"flex",flexDirection:"column",gap:2}}>
          {NDS_DIFFUSION.map(opt=>{
            const on=diffusion.includes(opt);
            return (
              <div key={opt} onClick={()=>toggleDiff(opt)}
                style={{display:"flex",alignItems:"center",gap:10,padding:"7px 2px",cursor:"pointer",fontSize:12.5,...NOTAP}}>
                <div style={{width:18,height:18,flexShrink:0,borderRadius:4,border:"1.5px solid "+(on?C.navy:"#CBD5E1"),background:on?C.navy:"white",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:11,fontWeight:800}}>{on?"✓":""}</div>
                <span style={{color:on?C.text:C.slate}}>{opt}</span>
              </div>
            );
          })}
        </div>
        )}
        {mode!=="dgac"&&<FField label="Destinataire complémentaire" value={toCustom} onChange={setToCustom}/>}
        <FSection title="En-tête du document" color="#0F1F3D"/>
        <FField label="Émetteur" value={from} onChange={setFrom}/>
        <FField label="Approuvé par" value={approbNom} onChange={setApprobNom} raw/>
        <FGrid>
          <FField label="Classification" value={classification} onChange={setClassification}/>
          <FField label="Révision" value={revision} onChange={setRevision}/>
        </FGrid>
        {err&&<div style={{background:"#FEF2F2",border:"1px solid #FCA5A5",borderRadius:8,padding:"10px 12px",fontSize:12,color:"#DC2626"}}>{err}</div>}
        <div style={{display:"flex",gap:10}}>
          <button onClick={onBack} style={{flex:1,height:52,background:C.bg,border:"1.5px solid "+C.border,borderRadius:10,color:C.slate,fontSize:13,fontWeight:600,cursor:"pointer"}}>← Retour</button>
          <button onClick={generate} disabled={loading}
            style={{flex:2,height:52,background:loading?C.slate:C.navy,border:"none",borderRadius:12,color:"white",fontSize:15,fontWeight:700,cursor:loading?"wait":"pointer",boxShadow:"0 2px 12px "+(loading?C.slate:C.navy)+"55",position:"relative",overflow:"hidden"}}>
            {loading&&(
              <span style={{position:"absolute",left:0,top:0,bottom:0,background:C.navy,opacity:.55,
                width:(progress&&progress.total?Math.max(8,Math.round(progress.done/progress.total*100)):8)+"%",
                transition:"width .5s ease"}}/>
            )}
            <span style={{position:"relative"}}>
              {loading
                ? (progress&&progress.total
                    ? (progress.done>=progress.total
                        ? "Finalisation de la note..."
                        : "Rédaction — section "+(progress.done+1)+" sur "+progress.total)
                    : "Génération en cours...")
                : "Générer la note"}
            </span>
          </button>
        </div>
      </div>
    </Card>
  );
}


// ── Visionneuse PDF intégrée (pdf.js, chargé à la première ouverture) ──
// Chrome Android ne sait pas afficher un PDF : sans visionneuse, il le télécharge.
const PDFJS_BASE = "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.6.205/legacy/build/";
let _pdfjsPromise = null;
function loadPdfJs(){
  if (!_pdfjsPromise) {
    // import() dynamique hors Babel (sinon transformé à la compilation)
    const imp = new Function("u", "return import(u)");
    _pdfjsPromise = imp(PDFJS_BASE + "pdf.min.mjs").then(m => {
      m.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.mjs";
      return m;
    }).catch(e => { _pdfjsPromise = null; throw e; });
  }
  return _pdfjsPromise;
}
function dataUrlToBytes(u){
  const b64 = String(u).slice(String(u).indexOf(",") + 1);
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function PdfViewer({ name, dataUrl, canDownload, onClose }){
  const boxRef = React.useRef(null);
  const [pdf, setPdf] = React.useState(null);
  const [err, setErr] = React.useState("");
  const [zoom, setZoom] = React.useState(1);
  const [page, setPage] = React.useState(1);
  React.useEffect(() => {
    let alive = true, task = null;
    loadPdfJs().then(lib => { task = lib.getDocument({ data: dataUrlToBytes(dataUrl) }); return task.promise; })
      .then(d => { if (alive) setPdf(d); })
      .catch(e => { logSilent(e); if (alive) setErr("Impossible d'afficher ce document. Vérifiez la connexion, puis réessayez."); });
    return () => { alive = false; try { task && task.destroy(); } catch(_e){ logSilent(_e); } };
  }, [dataUrl]);
  // Rendu de toutes les pages à la largeur de l'écran × zoom
  React.useEffect(() => {
    if (!pdf || !boxRef.current) return;
    let stop = false; const box = boxRef.current; box.innerHTML = "";
    const width = box.clientWidth - 16, dpr = Math.min(window.devicePixelRatio || 1, 2);
    (async () => {
      for (let i = 1; i <= pdf.numPages && !stop; i++) {
        const p = await pdf.getPage(i);
        const base = p.getViewport({ scale: 1 });
        const scale = (width / base.width) * zoom;
        const vp = p.getViewport({ scale: scale * dpr });
        const cv = document.createElement("canvas");
        cv.width = vp.width; cv.height = vp.height; cv.dataset.page = i;
        cv.style.cssText = "display:block;margin:0 auto 8px;background:white;box-shadow:0 1px 4px rgba(0,0,0,.35);width:" + (vp.width / dpr) + "px;height:" + (vp.height / dpr) + "px";
        box.appendChild(cv);
        await p.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
      }
    })().catch(e => logSilent(e));
    return () => { stop = true; };
  }, [pdf, zoom]);
  const onScroll = e => {
    const el = e.currentTarget, cvs = el.querySelectorAll("canvas");
    // Page visible à mi-hauteur ; en bas du document, la dernière page
    const mid = el.scrollTop + el.clientHeight / 2;
    let cur = 1; cvs.forEach(c => { if (c.offsetTop <= mid) cur = Number(c.dataset.page); });
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 4 && cvs.length) cur = cvs.length;
    setPage(cur);
  };
  const download = () => { const a = document.createElement("a"); a.href = dataUrl; a.download = name + ".pdf"; a.click(); };
  const hb = { height: 34, minWidth: 34, borderRadius: 8, border: "1.5px solid " + C.border, background: "white", color: C.navy, fontSize: 15, fontWeight: 800, ...TAP };
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 1000, background: "#525659", display: "flex", flexDirection: "column" }}>
      <div style={{ background: "white", padding: "10px 12px", paddingTop: "calc(10px + env(safe-area-inset-top, 0px))", display: "flex", alignItems: "center", gap: 8, boxShadow: "0 2px 8px rgba(0,0,0,.25)" }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: C.navy, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{name}</div>
          <div style={{ fontSize: 11, color: C.slate }}>{pdf ? "Page " + page + " / " + pdf.numPages : err ? "" : "Chargement…"}</div>
        </div>
        <button aria-label="Réduire" onClick={() => setZoom(z => Math.max(0.5, Math.round((z - 0.25) * 100) / 100))} style={hb}>−</button>
        <button aria-label="Agrandir" onClick={() => setZoom(z => Math.min(3, Math.round((z + 0.25) * 100) / 100))} style={hb}>+</button>
        {canDownload && <button aria-label="Télécharger" onClick={download} style={hb}>⬇</button>}
        <button aria-label="Fermer" onClick={onClose} style={{ ...hb, background: C.navy, color: "white", border: "none" }}>✕</button>
      </div>
      {err
        ? <div style={{ color: "white", textAlign: "center", padding: 30, fontSize: 13.5 }}>{err}</div>
        : <div ref={boxRef} onScroll={onScroll} style={{ flex: 1, overflow: "auto", WebkitOverflowScrolling: "touch", padding: "8px 8px 24px", position: "relative" }}/>}
    </div>
  );
}

function FormDocStore({ storeKey, label, readOnly }) {  // readOnly : consultation seule
  const PFX_DOCS = PFX + storeKey + "_";
  const [docs, setDocs] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [msg, setMsg] = React.useState("");
  const [viewing, setViewing] = React.useState(null);   // { name, dataUrl }

  React.useEffect(() => {
    (async () => {
      try { const list = await sbGet(PFX + storeKey + "_index") || []; setDocs(list); } catch(_e){ logSilent(_e); }
      setLoading(false);
    })();
  }, [storeKey]);

  const saveIndex = async (newDocs) => { setDocs(newDocs); await sbSet(PFX + storeKey + "_index", newDocs); };

  const handleAdd = async (e) => {
    if (readOnly) { if(e&&e.target) e.target.value=""; return; }   // consultation seule
    const file = e.target.files?.[0]; if (!file) return;
    if (!file.name.toLowerCase().endsWith(".pdf")) { uiAlert("Seuls les fichiers PDF sont acceptés."); return; }
    const name = (await uiPrompt("Nom du document :", file.name.replace(".pdf",""))) || file.name;
    setMsg("📤 Import en cours...");
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const b64 = ev.target.result;
      const id = storeKey + "_" + Date.now();
      const dateStr = new Date().toLocaleDateString("fr-FR");
      await sbSet(PFX_DOCS + id, b64);
      const newDocs = [...docs, { id, name, date: dateStr, size: Math.round(file.size/1024) }];
      await saveIndex(newDocs);
      setMsg("✅ « " + name + " » importé avec succès.");
      setTimeout(() => setMsg(""), 3000);
    };
    reader.readAsDataURL(file); e.target.value = "";
  };

  const handleUpdate = async (doc, e) => {
    if (readOnly) { if(e&&e.target) e.target.value=""; return; }
    const file = e.target.files?.[0]; if (!file) return;
    if (!file.name.toLowerCase().endsWith(".pdf")) { uiAlert("Seuls les fichiers PDF sont acceptés."); return; }
    if (!(await uiConfirm("⚠️ Ceci remplacera la version du " + doc.date + " de « " + doc.name + " ». Confirmer ?"))) { e.target.value=""; return; }
    setMsg("📤 Mise à jour en cours...");
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const b64 = ev.target.result;
      await sbSet(PFX_DOCS + doc.id, b64);
      const newDocs = docs.map(d => d.id === doc.id ? { ...d, date: new Date().toLocaleDateString("fr-FR"), size: Math.round(file.size/1024) } : d);
      await saveIndex(newDocs);
      setMsg("✅ « " + doc.name + " » mis à jour.");
      setTimeout(() => setMsg(""), 3000);
    };
    reader.readAsDataURL(file); e.target.value = "";
  };

  const handleDelete = async (doc) => {
    if (readOnly) return;
    if (!(await uiConfirm("⚠️ Supprimer « " + doc.name + " » ? Cette action est irréversible."))) return;
    setMsg("🗑 Suppression...");
    await sbSet(PFX_DOCS + doc.id, null);
    const newDocs = docs.filter(d => d.id !== doc.id);
    await saveIndex(newDocs);
    setMsg("✅ « " + doc.name + " » supprimé.");
    setTimeout(() => setMsg(""), 3000);
  };

  const handleOpen = async (doc) => {
    setMsg("📥 Chargement...");
    let b64 = await sbGet(PFX_DOCS + doc.id);
    if (!b64) b64 = await sbGet(PFX + "reglementation_" + doc.id);
    if (!b64) b64 = await sbGet(PFX + "docavion_" + doc.id);
    if (!b64) { setMsg("❌ Fichier introuvable. Veuillez le ré-importer."); return; }
    setViewing({ name: doc.name, dataUrl: b64 });   // affichage dans l'application, sans téléchargement
    setMsg("");
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {viewing && <PdfViewer name={viewing.name} dataUrl={viewing.dataUrl} canDownload={!readOnly} onClose={()=>setViewing(null)}/>}
      {msg && <div style={{background:"#F0FDF4",border:"1px solid #86EFAC",borderRadius:10,padding:"10px 14px",fontSize:13,color:"#166534"}}>{msg}</div>}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <div style={{fontSize:13,fontWeight:700,color:C.navy}}>{docs.length} document(s) {label}</div>
        {readOnly
          ? <span style={{background:C.bg2,color:C.slate,border:"1px solid "+C.border,borderRadius:8,padding:"7px 12px",fontSize:11.5,fontWeight:700}}>👁 Consultation seule</span>
          : <label style={{background:C.navy,color:"white",borderRadius:8,padding:"9px 16px",fontSize:12,fontWeight:600,cursor:"pointer",letterSpacing:"0.05em"}}>
              + Ajouter un PDF
              <input type="file" accept=".pdf" style={{display:"none"}} onChange={handleAdd}/>
            </label>}
      </div>
      {loading && <div style={{color:C.slate,fontSize:13,textAlign:"center",padding:24}}>Chargement...</div>}
      {!loading && docs.length===0 && (
        <div style={{background:C.bg2,borderRadius:12,padding:32,textAlign:"center",color:C.slate,fontSize:13}}>
          <div style={{fontSize:28,marginBottom:8}}>📄</div>
          {readOnly ? "Aucun document disponible." : <>Aucun document importé.<br/>Appuyez sur « + Ajouter un PDF » pour commencer.</>}
        </div>
      )}
      {docs.map(doc => (
        <div key={doc.id} style={{background:"white",borderRadius:12,border:"1.5px solid "+C.border,padding:"14px 16px"}}>
          <div style={{display:"flex",alignItems:"flex-start",gap:10,marginBottom:10}}>
            <div style={{fontSize:22,flexShrink:0,marginTop:2}}>📄</div>
            <div>
              <div style={{fontWeight:700,fontSize:13,color:C.navy,wordBreak:"break-word"}}>{doc.name}</div>
              <div style={{fontSize:11,color:C.slate,marginTop:2}}>Version du {doc.date} · {doc.size} ko</div>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>handleOpen(doc)}
              style={{background:C.navy,color:"white",border:"none",borderRadius:8,padding:"7px 14px",fontSize:11,fontWeight:600,cursor:"pointer"}}>
              📥 Ouvrir
            </button>
            {!readOnly && <>
            <label style={{background:"#EFF6FF",color:"#1D4ED8",border:"1px solid #BFDBFE",borderRadius:8,padding:"7px 14px",fontSize:11,fontWeight:600,cursor:"pointer"}}>
              🔄 Mettre à jour
              <input type="file" accept=".pdf" style={{display:"none"}} onChange={e=>handleUpdate(doc,e)}/>
            </label>
            <button onClick={()=>handleDelete(doc)}
              style={{background:"#FEF2F2",color:"#DC2626",border:"1px solid #FCA5A5",borderRadius:8,padding:"7px 14px",fontSize:11,fontWeight:600,cursor:"pointer"}}>
              🗑
            </button>
            </>}
          </div>
        </div>
      ))}
    </div>
  );
}
