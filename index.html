// SGS 02-02 — gravité A à E, probabilité 1 à 5
const SGS_GRAVITE = [
  {k:'A', l:'Catastrophique', d:"Aéronef ou équipement détruit, multiples décès."},
  {k:'B', l:'Dangereux',      d:"Importante réduction des marges de sécurité, blessures graves, importants dommages aux équipements."},
  {k:'C', l:'Majeur',         d:"Réduction importante des marges, incident grave, personnes blessées."},
  {k:'D', l:'Mineur',         d:"Nuisance, limites de fonctionnement, recours à des procédures d'urgence, incident mineur."},
  {k:'E', l:'Négligeable',    d:"Peu de conséquences."},
];
const SGS_PROBA = [
  {k:5, l:'Fréquent',               d:"Susceptible de se produire de nombreuses fois."},
  {k:4, l:'Occasionnelle',          d:"Susceptible de se produire parfois."},
  {k:3, l:'Éloigné',                d:"Peu susceptible de se produire, mais possible."},
  {k:2, l:'Improbable',             d:"Très peu susceptible de se produire."},
  {k:1, l:'Extrêmement improbable', d:"Il est presque inconcevable que l'événement se produise."},
];
// Couleurs de la matrice du manuel (SGS 02-02 p. 7)
const SGS_ROUGE = new Set(['5A','5B','5C','4A','4B','3A']);
const SGS_VERT  = new Set(['3E','2D','2E','1B','1C','1D','1E']);
const SGS_NIVEAUX = {
  intolerable:{l:'Intolérable', c:'#DC2626', bg:'#FEE2E2', delai:0,
    r:"Mesures immédiates ou arrêt de l'activité. Dirigeant Responsable avisé immédiatement."},
  tolerable:  {l:'Tolérable',   c:'#B45309', bg:'#FEF3C7', delai:30,
    r:"Toléré selon l'atténuation, décision de la direction. Actions correctives sous 30 jours."},
  acceptable: {l:'Acceptable',  c:'#047857', bg:'#D1FAE5', delai:null,
    r:"Acceptable en l'état, aucune mesure supplémentaire nécessaire."},
};
function sgsRisque(P,G){
  if(!P||!G) return null;
  const cell=String(P)+String(G);
  const niv=SGS_ROUGE.has(cell)?'intolerable':SGS_VERT.has(cell)?'acceptable':'tolerable';
  return {cell, niv, ...SGS_NIVEAUX[niv]};
}
// Risque en vigueur : résiduel s'il a été réévalué, sinon initial
function sgsRisqueCourant(h){ return sgsRisque(h.P2,h.G2)||sgsRisque(h.P,h.G); }
const SGS_STRATEGIES = [
  {k:'evitement',  l:'Évitement',  d:"L'activité est annulée ou évitée."},
  {k:'reduction',  l:'Réduction',  d:"Fréquence réduite ou conséquences limitées."},
  {k:'segregation',l:'Ségrégation',d:"Effets isolés ou redondance instaurée."},
];

// SGS 05-01 § 1.7 — fenêtre d'observation (jours) et déclenchement de l'analyse
const SGS_SPI = {
  cfg:{j:30,n:3}, atc:{j:365,n:2}, hardLanding:{j:365,n:1}, tailstrike:{j:365,n:1},
  bird:{j:30,n:3}, qrf:{j:30,n:7}, qrp:{j:30,n:7}, tsv:{j:30,n:2}, fuel:{j:365,n:3},
  peqIncap:{j:365,n:2}, peqInjury:{j:365,n:2}, unruly:{j:365,n:3},
  loadsheet:{j:30,n:1}, groundInjury:{j:365,n:1}, cgoProc:{j:365,n:1}, dg:{j:365,n:1}, aog:{j:91,n:26},
};
const sgsJours = d => Math.floor((Date.now()-new Date(String(d).slice(0,10)+'T12:00:00').getTime())/86400000);
// Indicateurs issus des comptes rendus : décompte sur la fenêtre, seuil franchi ?
function sgsIndicateurs(safety){
  return SAFETY_EVENTS.filter(e=>e.manuel&&SGS_SPI[e.k]).map(e=>{
    const cfg=SGS_SPI[e.k];
    const n=(safety||[]).filter(ev=>ev[e.k]&&ev.date&&sgsJours(ev.date)<=cfg.j&&sgsJours(ev.date)>=0).length;
    return {...e, fenetre:cfg.j, n, alerte:n>=cfg.n};
  });
}
const sgsEventKey = e => String(e.timestamp||'')+'|'+(e.date||'')+'|'+(e.num||'');
const sgsNextRef = (list,prefix) => prefix+'-'+String(1+Math.max(0,...(list||[]).map(x=>parseInt(String(x.ref||'').split('-').pop(),10)||0))).padStart(3,'0');
const sgsAddDays = (n) => { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const sgsFr = d => d ? String(d).slice(0,10).split('-').reverse().join('/') : '—';
const SGS_RESP_DEFAUT='Youssef IKLI';   // responsable Qualité / SGS par défaut
const SGS_MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

// Appel IA (même relais et même repli que le générateur de notes)
async function sgsCallAI(system, user, onProgress){
  const body={max_tokens:5000,system,messages:[{role:"user",content:user}]};
  const stream=async()=>{
    const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,stream:true})});
    if(!r.ok){ let d={}; try{ d=await r.json(); }catch(e){ logSilent(e); } const e=new Error((d.error&&d.error.message)||d.error||'Erreur API'); e.fatal=true; throw e; }
    if(!r.body||!r.body.getReader) throw new Error('STREAM_UNSUPPORTED');
    const rd=r.body.getReader(), dec=new TextDecoder(); let buf='', text='';
    while(true){
      const {done,value}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); const lines=buf.split('\n'); buf=lines.pop()||'';
      for(const line of lines){
        if(!line.startsWith('data:')) continue; const p=line.slice(5).trim(); if(!p||p==='[DONE]') continue;
        let ev; try{ ev=JSON.parse(p); }catch(_e){ continue; }
        if(ev.type==='content_block_delta'&&ev.delta&&typeof ev.delta.text==='string'){ text+=ev.delta.text; if(onProgress) onProgress((text.match(/"title"\s*:/g)||[]).length); }
        else if(ev.type==='error'){ const e=new Error((ev.error&&ev.error.message)||'Erreur'); e.fatal=true; throw e; }
      }
    }
    if(!text.trim()) throw new Error('Réponse vide'); return text;
  };
  const plain=async()=>{
    const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json(); if(!r.ok) throw new Error((d.error&&d.error.message)||d.error||'Erreur API');
    return (d.content||[]).map(b=>b.text||'').join('\n');
  };
  let raw; try{ raw=await stream(); }catch(e){ if(e&&e.fatal) throw e; raw=await plain(); }
  const s=raw.indexOf('{'), t=raw.lastIndexOf('}');
  if(s<0||t<s) throw new Error('Réponse illisible');
  return JSON.parse(raw.slice(s,t+1));
}

// ── Matrice interactive du manuel ──
function SgsMatrice({ P, G, onPick, small }){
  const cs=small?30:44;
  return (
    <div style={{overflowX:"auto"}}>
      <table style={{borderCollapse:"separate",borderSpacing:3,margin:"0 auto"}}>
        <thead><tr><th/>{SGS_GRAVITE.map(g=>(
          <th key={g.k} style={{fontSize:9,color:C.slate,fontWeight:700,padding:"0 2px",textAlign:"center",lineHeight:1.15}}>{g.k}<br/>{!small&&g.l}</th>))}</tr></thead>
        <tbody>{SGS_PROBA.map(p=>(
          <tr key={p.k}>
            <td style={{fontSize:9,color:C.slate,fontWeight:700,paddingRight:4,textAlign:"right",whiteSpace:"nowrap"}}>{p.k}{!small&&" · "+p.l}</td>
            {SGS_GRAVITE.map(g=>{ const r=sgsRisque(p.k,g.k), on=P===p.k&&G===g.k;
              return (<td key={g.k} onClick={onPick?()=>onPick(p.k,g.k):undefined}
                style={{width:cs,height:small?22:34,textAlign:"center",fontSize:small?9:11,fontWeight:800,borderRadius:6,
                  background:r.c,color:"white",opacity:on||(!P&&!G)?1:.35,outline:on?"3px solid "+C.navy:"none",
                  ...(onPick?TAP:{})}}>{r.cell}</td>); })}
          </tr>))}</tbody>
      </table>
    </div>
  );
}

const sgsInput={width:"100%",boxSizing:"border-box",background:C.bg,border:"1.5px solid "+C.border,borderRadius:10,padding:"9px 11px",fontSize:13,fontFamily:"inherit",outline:"none"};
const SgsField=({label,children})=>(<div style={{minWidth:0}}><FLabel>{label}</FLabel>{children}</div>);   // minWidth:0 : le contenu se tronque au lieu d'élargir sa colonne
const SgsPills=({value,options,onChange,color})=>(

const SGS_EV_STATUTS=[{k:'recu',l:'Reçu'},{k:'analyse',l:'En analyse'},{k:'clos',l:'Clos'}];
const SGS_H_STATUTS=[{k:'ouvert',l:'Ouvert'},{k:'maitrise',l:'Maîtrisé'},{k:'clos',l:'Clos'}];
const SGS_A_STATUTS=[{k:'afaire',l:'À faire'},{k:'encours',l:'En cours'},{k:'realisee',l:'Réalisée'},{k:'efficace',l:'Efficace'}];
const sgsActionOuverte=a=>a.statut!=='realisee'&&a.statut!=='efficace';

// Recherche insensible à la casse et aux accents
const sgsNorm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const sgsMatch = (q, ...champs) => !q.trim() || sgsNorm(champs.join(' ')).includes(sgsNorm(q.trim()));

// ── Export du registre des dangers et des actions (A4 paysage) ──
// Tout le registre, clos compris ; aucune description de compte rendu d'événement.
function sgsExportRegistre(H, A, nom, annules){ auditLog("export PDF","REG-SGS","export",{document:[null,"Registre des dangers et des actions"]});
  nom=(nom||'').trim()||SGS_RESP_DEFAUT;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'landscape' });
  const W=297, HP=210, MX=12, CW=W-2*MX;
  const now=new Date(), today=now.toISOString().slice(0,10);
  const ref='REG-SGS-'+today.replace(/-/g,'');
  const edit=now.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  doc.setProperties({ title: ref, creator:'Afrijet Sahara — SGS' });
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const txt=(s,x,yy,o)=>doc.text(String(s==null?'':s).replace(/[→–—]/g,'-').replace(/[’]/g,"'"),x,yy,o);
  const clean=s=>String(s==null?'':s).replace(/[→]/g,'->').replace(/[–—]/g,'-').replace(/[’]/g,"'").replace(/[^\x00-\xFF\u0152\u0153]/g,'');
  let y=0, page=0;
  const header=()=>{
    page++;
    y=sgsPdfHeader(doc,{titre:clean('REGISTRE DU SYSTÈME DE GESTION DE LA SÉCURITÉ'),ref:clean(ref),MX});
    doc.setFontSize(7.5); doc.setTextColor(100,116,139);
    txt('Document interne - confidentiel SGS  ·  Édité le '+edit+'  ·  Manuel SGS V03', MX, HP-6);
  };
  const footer=()=>{ const n=doc.getNumberOfPages();
    for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(100,116,139); txt('Page '+i+' / '+n, W-MX, HP-6, {align:'right'}); } };
  const title=(s)=>{ if(y>HP-40){ doc.addPage(); header(); }
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(26,26,46); txt(s, MX, y); y+=2;
    doc.setDrawColor(139,0,0); doc.setLineWidth(.5); doc.line(MX,y,MX+CW,y); y+=5; };

  // Tableau à cellules multilignes, en-tête répété à chaque page
  const table=(cols, rows)=>{
    const pad=1.6, fs=7.6, lh=3.3;
    const drawHead=()=>{ doc.setFillColor(241,245,249); doc.rect(MX,y,CW,7,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(7.4); doc.setTextColor(26,26,46);
      let x=MX; cols.forEach(c=>{ txt(c.l, x+pad, y+4.6); x+=c.w; }); y+=7; };
    drawHead();
    rows.forEach((r,ri)=>{
      doc.setFont('helvetica','normal'); doc.setFontSize(fs);
      const cells=cols.map((c,i)=>doc.splitTextToSize(clean(r.v[i]), c.w-2*pad));
      const h=Math.max(...cells.map(l=>l.length))*lh+2*pad;
      if(y+h>HP-12){ doc.addPage(); header(); drawHead(); doc.setFont('helvetica','normal'); doc.setFontSize(fs); }
      if(ri%2){ doc.setFillColor(250,250,249); doc.rect(MX,y,CW,h,'F'); }
      let x=MX;
      cols.forEach((c,i)=>{
        const st=(r.style||{})[i];
        if(st&&st.bg){ doc.setFillColor(...hex(st.bg)); doc.rect(x+.6,y+.6,c.w-1.2,h-1.2,'F'); }
        doc.setFont('helvetica',st&&st.bold?'bold':'normal');
        doc.setTextColor(...(st&&st.fg?hex(st.fg):[30,41,59]));
        cells[i].forEach((ln,k)=>doc.text(ln, x+pad, y+pad+2.6+k*lh));
        x+=c.w;
      });
      doc.setDrawColor(226,232,240); doc.setLineWidth(.2); doc.line(MX,y+h,MX+CW,y+h);
      y+=h;
    });
    y+=6;
  };

  header();
  // ── Synthèse
  title('1. Synthèse');
  const Hc=H.map(h=>({h,r:sgsRisqueCourant(h)}));
  const ouv=Hc.filter(x=>x.h.statut!=='clos');
  const aOuv=A.filter(sgsActionOuverte), aRet=aOuv.filter(a=>a.echeance&&a.echeance<today);
  const synth=[
    ['Dangers enregistrés', H.length, ''],
    ['  dont ouverts ou maîtrisés', ouv.length, ''],
    ['  risque intolérable (ouverts)', ouv.filter(x=>x.r&&x.r.niv==='intolerable').length, '#DC2626'],
    ['  risque tolérable (ouverts)', ouv.filter(x=>x.r&&x.r.niv==='tolerable').length, '#B45309'],
    ['  risque acceptable (ouverts)', ouv.filter(x=>x.r&&x.r.niv==='acceptable').length, '#047857'],
    ['Actions enregistrées', A.length, ''],
    ['  dont ouvertes', aOuv.length, ''],
    ['  dont en retard', aRet.length, aRet.length?'#DC2626':''],
    ['  dont closes (réalisées ou efficaces)', A.length-aOuv.length, ''],
  ];
  synth.forEach(([l,n,c])=>{ doc.setFont('helvetica',l.startsWith('  ')?'normal':'bold'); doc.setFontSize(9);
    doc.setTextColor(...(c?hex(c):[30,41,59])); txt(l, MX+2, y); txt(String(n), MX+95, y, {align:'right'}); y+=5; });
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(30,41,59);
  txt('Établi par : '+nom+', Responsable Qualité / SGS', MX+2, y+2); y+=12;

  // ── Registre des dangers
  title('2. Registre des dangers');
  const ORI={reactif:'Réactive (événement)',proactif:'Proactive',changement:'Gestion du changement'};
  const ordre={intolerable:0,tolerable:1,acceptable:2};
  const Hs=[...Hc].sort((a,b)=>(a.h.statut==='clos')-(b.h.statut==='clos')||(ordre[(a.r||{}).niv]??3)-(ordre[(b.r||{}).niv]??3)||String(a.h.ref).localeCompare(String(b.h.ref)));
  const cell=r=>r?{bg:r.bg,fg:r.c,bold:true}:null;
  if(!Hs.length){ doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(100,116,139); txt('Aucun danger enregistré.',MX+2,y); y+=10; }
  else table(
    [{l:'Réf.',w:15},{l:'Danger',w:52},{l:'Origine',w:24},{l:'Initial',w:22},{l:'Stratégie et mesures',w:78},{l:'Résiduel',w:22},{l:'Statut',w:20},{l:'Mis à jour',w:40}],
    Hs.map(({h,r})=>{ const r1=sgsRisque(h.P,h.G), r2=sgsRisque(h.P2,h.G2);
      const strat=(SGS_STRATEGIES.find(s=>s.k===h.strategie)||{}).l;
      return { v:[h.ref, h.titre+(h.description?'\n'+h.description:''), ORI[h.origine]||'-',
          r1?r1.cell+' '+r1.l:'-', [strat,h.mesures].filter(Boolean).join(' : ')||'-', r2?r2.cell+' '+r2.l:'-',
          (SGS_H_STATUTS.find(s=>s.k===(h.statut||'ouvert'))||{}).l, sgsFr(h.updatedAt||h.createdAt)+(h.statut==='clos'?((h.acceptation||{}).nom?'\nAccepté par '+h.acceptation.nom+' ('+h.acceptation.fonction+') le '+sgsFr(h.acceptation.date):'\nAcceptation non renseignée'):'')],
        style:{3:cell(r1),5:cell(r2)} };
    }));

  // ── Registre des actions
  title('3. Registre des actions correctives et préventives');
  const As=[...A].sort((a,b)=>(!sgsActionOuverte(a))-(!sgsActionOuverte(b))||String(a.echeance).localeCompare(String(b.echeance)));
  if(!As.length){ doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(100,116,139); txt('Aucune action enregistrée.',MX+2,y); y+=10; }
  else table(
    [{l:'Réf.',w:15},{l:'Action',w:50},{l:'Type',w:18},{l:'Danger',w:16},{l:'Responsable',w:26},{l:'Échéance',w:20},{l:'Statut',w:22},{l:"Critère d'efficacité",w:53},{l:'Preuve',w:53}],
    As.map(a=>{ const late=sgsActionOuverte(a)&&a.echeance&&a.echeance<today, h=H.find(x=>x.id===a.hazardId);
      return { v:[a.ref, a.titre, a.type==='preventive'?'Préventive':'Corrective', h?h.ref:'-', a.responsable,
          sgsFr(a.echeance)+(late?'\nEN RETARD':''), (SGS_A_STATUTS.find(s=>s.k===a.statut)||{}).l, a.critere||'-', a.preuve||'-'],
        style: late?{5:{fg:'#DC2626',bold:true}}:{} };
    }));
  // Éléments annulés : jamais supprimés, ils restent tracés dans le registre
  if((annules||[]).length){ title('4. Dangers et actions annulés');
    table([{l:'Réf.',w:15},{l:'Nature',w:18},{l:'Intitulé',w:80},{l:'Annulé le',w:24},{l:'Par',w:40},{l:'Motif',w:96}],
      annules.map(x=>({ v:[x.ref, x._k, x.titre, sgsFr((x.annulation||{}).date), (x.annulation||{}).par||'-', (x.annulation||{}).motif||'-'], style:{} }))); }
  // Bloc de signature
  if(y>HP-40){ doc.addPage(); header(); }
  y+=4; const sx=W-MX-80;
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(26,26,46); txt(nom, sx, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(71,85,105);
  txt('Responsable du Système de Gestion de la Sécurité', sx, y+4.5); txt('Date : '+edit, sx, y+9);
  doc.setDrawColor(148,163,184); doc.setLineWidth(.3); doc.line(sx, y+22, sx+75, y+22);
  doc.setFontSize(7.5); txt('Signature', sx, y+26);
  footer();
  doc.save(ref+'.pdf');
  return ref;
}

// ── Export des comptes rendus d'événement (A4 paysage) ──
// Descriptions confidentielles masquées sauf choix explicite du responsable SGS.
const SGS_PERIODES=[{k:'mois',l:'Mois en cours'},{k:'3m',l:'3 derniers mois'},{k:'12m',l:'12 derniers mois'},{k:'all',l:'Tout'}];
function sgsFiltreEvenements(events, periode, svc){
  const now=new Date(), mois=now.toISOString().slice(0,7);
  return (events||[]).filter(e=>{
    const j=sgsJours(e.date);
    const okP=periode==='all'||(periode==='mois'?String(e.date).slice(0,7)===mois:periode==='3m'?j<=91:j<=365);
    const okS=svc==='all'||SAFETY_EVENTS.some(x=>e[x.k]&&x.svc.includes(svc));
    return okP&&okS;
  }).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function sgsExportEvenements(events, { periode, svc, inclureConf, nom, evStatus, hazards }){
  nom=(nom||'').trim()||SGS_RESP_DEFAUT;
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF({ unit:'mm', format:'a4', orientation:'landscape' });
  const W=297, HP=210, MX=12, CW=W-2*MX;
  const now=new Date(), today=now.toISOString().slice(0,10), ref='CRE-SGS-'+today.replace(/-/g,'');
  const edit=now.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  doc.setProperties({ title: ref, creator:'Afrijet Sahara — SGS' });
  const clean=s=>String(s==null?'':s).replace(/[→]/g,'->').replace(/[–—]/g,'-').replace(/[’]/g,"'").replace(/[^\x00-\xFF\u0152\u0153]/g,'');
  const txt=(s,x,y,o)=>doc.text(clean(s),x,y,o);
  let y=0;
  const header=()=>{ const yH=sgsPdfHeader(doc,{titre:clean("REGISTRE DES COMPTES RENDUS D'ÉVÉNEMENT"),ref:clean(ref),MX});
    doc.setFontSize(7.5); doc.setTextColor(100,116,139);
    txt('Document interne - confidentiel SGS  ·  Édité le '+edit+'  ·  Manuel SGS V03', MX, HP-6); y=yH; };
  header();
  const L=[]; const per=(SGS_PERIODES.find(p=>p.k===periode)||{}).l, sv=svc==='all'?'Tous services':((SAFETY_SERVICES.find(s=>s.k===svc)||{}).l||svc);
  const conf=events.filter(e=>e.confidentiel).length;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(26,26,46); txt('Sélection', MX, y); y+=2;
  doc.setDrawColor(139,0,0); doc.setLineWidth(.5); doc.line(MX,y,MX+CW,y); y+=6;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(30,41,59);
  [['Période', per],['Service', sv],['Comptes rendus', String(events.length)],
   ['Dont confidentiels', conf+(conf?(inclureConf?'  (descriptions incluses sur décision du responsable SGS)':'  (descriptions masquées)'):'')],
   ['Établi par', nom+', Responsable Qualité / SGS']].forEach(([a,b])=>{ doc.setFont('helvetica','bold'); txt(a+' :',MX+2,y); doc.setFont('helvetica','normal'); txt(b,MX+45,y); y+=5; });
  y+=5;
  const cols=[{l:'Date',w:19},{l:'Rattachement',w:29},{l:'Événement(s)',w:46},{l:'Description des faits',w:72},{l:'Analyse',w:58},{l:'Statut SGS',w:19},{l:'Danger lié',w:30}];
  const pad=1.6, lh=3.3;
  const head=()=>{ doc.setFillColor(241,245,249); doc.rect(MX,y,CW,7,'F'); doc.setFont('helvetica','bold'); doc.setFontSize(7.4); doc.setTextColor(26,26,46);
    let x=MX; cols.forEach(c=>{ txt(c.l,x+pad,y+4.6); x+=c.w; }); y+=7; };
  if(!events.length){ doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(100,116,139); txt('Aucun compte rendu pour cette sélection.',MX+2,y); y+=10; }
  else { head();
    events.forEach((e,ri)=>{
      const key=sgsEventKey(e), st=((evStatus||{})[key]||{}).statut||'recu';
      const rat=e.rattachement==='hors'?'Hors vol':e.rattachement==='appareil'?'Appareil '+(e.num||''):'Vol '+(e.num||'')+(e.from?'\n'+e.from+' - '+e.to:'');
      const evs=(e.form?e.form+(e.titre?' · '+e.titre:'')+'\n':'')+safetyLabels(e).join('\n')+(e.unrulyType?'\nSuite : '+e.unrulyType:'')+(e.enquete?'\nEnquête requise':'')+(sgsCrtsvDac(e)?'\nCopie DAC : '+(((evStatus||{})[key]||{}).dac?sgsFr(((evStatus||{})[key]||{}).dac):'à transmettre'):'');
      let desc=e.description||'-';
      if(e.confidentiel&&!inclureConf) desc='Confidentiel - consultable auprès du responsable SGS.';
      const marques=[e.confidentiel?'CONFIDENTIEL':'',e.anonyme?'ANONYME':''].filter(Boolean).join(' · ');
      if(marques) desc='['+marques+']\n'+desc;
      const hz=(hazards||[]).filter(h=>h.eventKey===key).map(h=>h.ref+' '+h.titre).join('\n')||'-';
      const ana=sgsAnaResume(((evStatus||{})[key]||{}).analyse,e,e.confidentiel&&!inclureConf);
      const v=[sgsFr(e.date),rat,evs,desc,ana,(SGS_EV_STATUTS.find(s=>s.k===st)||{}).l,hz];
      doc.setFont('helvetica','normal'); doc.setFontSize(7.6);
      const cells=cols.map((c,i)=>doc.splitTextToSize(clean(v[i]),c.w-2*pad));
      const h=Math.max(...cells.map(l=>l.length))*lh+2*pad;
      if(y+h>HP-12){ doc.addPage(); header(); head(); doc.setFont('helvetica','normal'); doc.setFontSize(7.6); }
      if(ri%2){ doc.setFillColor(250,250,249); doc.rect(MX,y,CW,h,'F'); }
      let x=MX; cols.forEach((c,i)=>{ doc.setTextColor(...((i===3||i===4)&&e.confidentiel&&!inclureConf?[100,116,139]:[30,41,59])); cells[i].forEach((ln,k)=>doc.text(ln,x+pad,y+pad+2.6+k*lh)); x+=c.w; });
      doc.setDrawColor(226,232,240); doc.setLineWidth(.2); doc.line(MX,y+h,MX+CW,y+h); y+=h;
    }); y+=6; }
  if(y>HP-40){ doc.addPage(); header(); }
  y+=4; const sx=W-MX-80;
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(26,26,46); txt(nom, sx, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(71,85,105);
  txt('Responsable du Système de Gestion de la Sécurité', sx, y+4.5); txt('Date : '+edit, sx, y+9);
  doc.setDrawColor(148,163,184); doc.setLineWidth(.3); doc.line(sx, y+22, sx+75, y+22); doc.setFontSize(7.5); txt('Signature', sx, y+26);
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(100,116,139); txt('Page '+i+' / '+n, W-MX, HP-6, {align:'right'}); }
  doc.save(ref+'.pdf'); return ref;
}

// Largeur d'écran : tablette paysage et PC à partir de 900 px
function useSgsWide(){
  const [w,setW]=useState(()=>typeof window!=="undefined"&&window.innerWidth>=900);
  useEffect(()=>{ const f=()=>setW(window.innerWidth>=900); window.addEventListener('resize',f); return ()=>window.removeEventListener('resize',f); },[]);
  return w;
}

// Frise de statut : étapes reliées, les étapes franchies en couleur ; touchable si onPick est fourni
function SgsStepper({ steps, value, onPick, color="#0F766E", compact }){
  const idx=Math.max(0,steps.findIndex(s=>s.k===value));
  return <div style={{display:"flex",gap:4}}>{steps.map((s,i)=>{ const done=i<=idx, cur=i===idx;
    return <div key={s.k} role={onPick?"button":undefined} onClick={onPick?()=>onPick(s.k):undefined} style={{flex:1,minWidth:0,...(onPick?TAP:{})}}>
      <div style={{height:compact?4:5,borderRadius:3,background:done?color:"#D5DDE7"}}/>
      <div style={{fontSize:compact?10:11,marginTop:4,textAlign:"center",color:cur?color:C.slate,fontWeight:cur?800:500,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.l}</div></div>; })}</div>;
}
// Date relative : « aujourd'hui », « hier », « il y a 5 jours », « dans 3 jours »
function sgsRel(d){
  if(!d) return '';
  const n=Math.round((new Date(String(d).slice(0,10)+'T12:00:00').getTime()-new Date(new Date().toISOString().slice(0,10)+'T12:00:00').getTime())/86400000);
  if(n===0) return "aujourd'hui"; if(n===-1) return 'hier'; if(n===1) return 'demain';
  return n<0?'il y a '+(-n)+' jours':'dans '+n+' jours';
}

// ── Bandeau de confirmation discret, avec « Annuler » (remplace les fenêtres OK) ──
function sgsToast(msg, undo){ try{ window.dispatchEvent(new CustomEvent('sgs-toast',{detail:{msg,undo,id:Date.now()}})); }catch(e){ logSilent(e); } }
function SgsToastHost(){
  const [t,setT]=useState(null);
  useEffect(()=>{ const f=e=>setT(e.detail); window.addEventListener('sgs-toast',f); return ()=>window.removeEventListener('sgs-toast',f); },[]);
  useEffect(()=>{ if(!t) return; const id=setTimeout(()=>setT(null),6000); return ()=>clearTimeout(id); },[t]);
  if(!t) return null;
  return <div role="status" style={{position:"fixed",left:"50%",bottom:"calc(18px + env(safe-area-inset-bottom,0px))",transform:"translateX(-50%)",zIndex:450,
    background:"#1a1a2e",color:"white",borderRadius:10,padding:"11px 14px",display:"flex",alignItems:"center",gap:14,fontSize:13,boxShadow:"0 6px 20px rgba(0,0,0,.25)",maxWidth:"92vw",minWidth:"min(320px,92vw)",boxSizing:"border-box"}}>
    <span style={{color:"#9FE1CB",fontWeight:800}}>✓</span><span style={{flex:1}}>{t.msg}</span>
    {t.undo&&<button onClick={()=>{ t.undo(); setT(null); }} style={{border:"none",background:"none",color:"#9FE1CB",fontWeight:800,fontSize:13,padding:0,...TAP}}>Annuler</button>}
  </div>;
}
// ── Indicateur : barre vers le seuil et mini-courbe sur 12 mois ──
function SgsSpiBar({ s, safety, taux }){
  const thr=(SGS_SPI[s.k]||{}).n||1, pct=Math.min(100,Math.round(s.n/thr*100));
  const col=s.alerte?"#DC2626":(s.n>0&&s.n>=thr-1)?"#B45309":"#1D9E75";
  const mois=[...Array(12)].map((_,i)=>{ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-11+i); return d.toISOString().slice(0,7); });
  const serie=mois.map(m=>(safety||[]).filter(e=>e[s.k]&&String(e.date).slice(0,7)===m).length), mx=Math.max(1,...serie);
  const fen=s.fenetre<=31?"30 derniers jours":s.fenetre<=92?"dernier trimestre":"12 derniers mois";
  return <div style={{padding:"9px 0",borderTop:"1px solid "+C.border}}>
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <div style={{flex:1,minWidth:0}}><div style={{fontSize:12.5,fontWeight:700,color:C.text,lineHeight:1.3}}>{s.l}{s.def?<span style={{fontWeight:400,color:C.slate}}> — {s.def.toLowerCase()}</span>:null}</div>
        <div style={{fontSize:10.5,color:C.slate,marginTop:1}}>{fen} · cible {s.cible} · analyse {s.seuil}</div></div>
      <svg width="54" height="20" viewBox="0 0 54 20" aria-label="Tendance sur 12 mois" style={{flex:"0 0 auto"}}>
        <polyline fill="none" stroke="#94A3B8" strokeWidth="1.5" strokeLinejoin="round" points={serie.map((v,i)=>(i*54/11).toFixed(1)+','+(18-v/mx*16).toFixed(1)).join(' ')}/></svg>
      <div style={{textAlign:"right",minWidth:46}}><div style={{fontSize:16,fontWeight:800,color:col,lineHeight:1.1}}>{s.k==='loadsheet'?taux+' %':s.n}</div>
        <div style={{fontSize:10,color:C.slate}}>{s.k==='loadsheet'?'conformité':'seuil '+thr}</div></div>
    </div>
    <div style={{height:6,borderRadius:3,background:"#EEF2F6",marginTop:7,overflow:"hidden"}}><div style={{height:"100%",width:Math.max(s.n?4:0,pct)+"%",background:col,borderRadius:3}}/></div>
  </div>;
}
// Mise en évidence des mentions « [à compléter] »
function sgsMarkTodo(txt){
  const parts=String(txt||'').split('[à compléter]');
  return parts.map((p,i)=><React.Fragment key={i}>{p}{i<parts.length-1&&<span style={{background:"#FAEEDA",color:"#633806",fontWeight:700,borderRadius:4,padding:"0 3px"}}>[à compléter]</span>}</React.Fragment>);
}

// Référence annuelle : PREFIXE-AAAA-NN
const sgsRefAn=(list,prefix,date)=>{ const y=String(date||new Date().toISOString()).slice(0,4);
  const n=1+Math.max(0,...(list||[]).filter(x=>String(x.ref||'').startsWith(prefix+'-'+y)).map(x=>parseInt(String(x.ref).split('-').pop(),10)||0));
  return prefix+'-'+y+'-'+String(n).padStart(2,'0'); };

function sgsPdfHeader(doc, { titre, ref, sous, MX=14, color=[139,0,0] }){
  const W=doc.internal.pageSize.getWidth(), lw=44;
  doc.addImage(LOGO_PDF,"JPEG",MX,4.2,lw,lw*LOGO_RATIO);

}

  "SMS-19":["Rapport de danger équipage","Crew Hazard Report"],

const SGS_FORM_VERSION={edition:"01",revision:"00",date:"30/05/2025"};   // Manuel SGS V03 ; surcharge possible par formulaire : SGS_FORM_CTRL[k][2..4]
function sgsCtrl(k){ const t=SGS_FORM_CTRL[k]; if(!t) return null; return {k,fr:t[0],en:t[1],ed:t[2]||SGS_FORM_VERSION.edition,rev:t[3]||SGS_FORM_VERSION.revision,date:t[4]||SGS_FORM_VERSION.date}; }
const SGS_CART_H=30;   // hauteur du cartouche (mm) ; le contenu commence dessous
// Dessine le cartouche et le pied de page d'un formulaire maîtrisé sur la page courante (i / n)
function sgsCartouche(doc, f, i, n, clean){
  const W=doc.internal.pageSize.getWidth(), HP=doc.internal.pageSize.getHeight(), MX=12, y0=7, H=SGS_CART_H-6, CW=W-2*MX;
  const cL=46, cR=48, cM=CW-cL-cR, xM=MX+cL, xR=MX+cL+cM, cl=clean||(s=>String(s));
  doc.setDrawColor(90,90,90); doc.setLineWidth(.35); doc.rect(MX,y0,CW,H); doc.line(xM,y0,xM,y0+H); doc.line(xR,y0,xR,y0+H);
  // gauche : service
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(26,26,46); doc.text(cl('SERVICE SÉCURITÉ'),MX+cL/2,y0+5,{align:'center'});
  doc.setFont('helvetica','italic'); doc.setFontSize(6.5); doc.setTextColor(120,120,120); doc.text('SAFETY DEPARTMENT',MX+cL/2,y0+8.3,{align:'center'});
  { const lw=36; doc.addImage(LOGO_PDF,"JPEG",MX+(cL-lw)/2,y0+10.3,lw,lw*LOGO_RATIO); }   // logo officiel
  doc.setFontSize(8.5); doc.setTextColor(26,26,46); doc.text('SGS',MX+cL/2-2,y0+21.5,{align:'right'}); doc.setTextColor(150,150,150); doc.text('| SMS',MX+cL/2-1,y0+21.5);
  // centre : titre français et anglais
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(26,26,46);
  const tl=doc.splitTextToSize(cl(f.fr),cM-6).slice(0,3); const ty=y0+H/2-(tl.length*4.4)/2+2.2;
  tl.forEach((l,k)=>doc.text(l,xM+cM/2,ty+k*4.4,{align:'center'}));
  doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(120,120,120); doc.text(cl(f.en),xM+cM/2,ty+tl.length*4.4+0.6,{align:'center'});
  // droite : édition, révision, page, date
  const rows=[["Édition","Edition",f.ed],["Révision","Revision",f.rev],["Page","Page",i+"/"+n],["Date","Date",f.date]], rh=H/4;
  rows.forEach(([fr,en,v],k)=>{ const yy=y0+rh*k; if(k) doc.line(xR,yy,MX+CW,yy);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.6); doc.setTextColor(26,26,46); doc.text(cl(fr),xR+2,yy+rh/2+1.2);
    doc.setFont('helvetica','italic'); doc.setFontSize(6); doc.setTextColor(140,140,140); doc.text('| '+en,xR+2+doc.getTextWidth(cl(fr))*(7.6/6)+1.2,yy+rh/2+1.2);
    doc.setFont('helvetica','bold'); doc.setFontSize(7.8); doc.setTextColor(26,26,46); doc.text(cl(v),MX+CW-2,yy+rh/2+1.2,{align:'right'}); });
  // pied de page
  doc.setDrawColor(90,90,90); doc.setLineWidth(.3); doc.line(MX,HP-15,MX+CW,HP-15);
  doc.setFont('helvetica','normal'); doc.setFontSize(7.2); doc.setTextColor(60,60,60);
  doc.text('ENR / SGS | FOR/'+f.k.replace('-',' -'),MX,HP-11);
  { let t=cl(f.fr)+' | '+cl(f.en); if(doc.getTextWidth(t)>96) t=cl(f.fr);
    while(doc.getTextWidth(t)>96&&t.length>10) t=t.replace(/\s+\S*$/,'')+'…';   // coupe au mot, jamais au milieu
    doc.text(t,W/2,HP-11,{align:'center'}); }
  doc.setFont('helvetica','bold'); doc.text('Afrijet Sahara',MX+CW,HP-11,{align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.text('Page '+i+'/'+n,W/2,HP-7.5,{align:'center'});
}

function sgsDocPDF(o){ auditLog("export PDF",o&&o.ref,"export",{document:[null,o&&o.titre]}); return sgsDocPDF_(o); }
function sgsDocPDF_({ ref, titre, sous, meta, blocs, nom, fonction, form }){
  const FC=form?sgsCtrl(form):null;   // formulaire maîtrisé : cartouche officiel à la place du bandeau
  const { jsPDF } = window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210, HP=297, MX=14, CW=W-2*MX; let y=0;
  const clean=s=>String(s==null?'':s).replace(/[→]/g,'->').replace(/[–—]/g,'-').replace(/[’]/g,"'").replace(/[^\x00-\xFF\u0152\u0153]/g,'');
  const edit=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  const header=()=>{ if(FC){ doc.setFont('helvetica','normal'); doc.setFontSize(7.2); doc.setTextColor(100,116,139);
      doc.text(clean('Enregistrement établi le '+edit+'  ·  réf. '+ref+'  ·  document interne - confidentiel SGS'),MX,SGS_CART_H+5); y=SGS_CART_H+13; return; }
    y=sgsPdfHeader(doc,{titre:clean(titre.toUpperCase()),ref:clean(ref),MX});
    doc.setFontSize(7.5); doc.setTextColor(100,116,139); doc.text(clean('Document interne - confidentiel SGS  ·  Édité le '+edit+'  ·  Manuel SGS V03'),MX,HP-7); };
  const need=h=>{ if(y+h>HP-(FC?20:16)){ doc.addPage(); header(); } };
  header();
  if(sous){ doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(26,26,46); doc.splitTextToSize(clean(sous),CW).forEach(l=>{ need(7); doc.text(l,MX,y); y+=6; }); y+=2; }
  (meta||[]).forEach(([k,v])=>{ need(6); doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(71,85,105);
    const kl=doc.splitTextToSize(clean(k+' :'),43); kl.forEach((l,i)=>doc.text(l,MX,y+i*4.3));   // libellé long : sur plusieurs lignes
    doc.setFont('helvetica','normal'); doc.setTextColor(30,41,59); const ls=doc.splitTextToSize(clean(v||'-'),CW-45); ls.forEach((l,i)=>{ doc.text(l,MX+45,y+i*4.3); });
    y+=Math.max(kl.length,ls.length)*4.3+0.9; });
  y+=3;
  (blocs||[]).forEach(b=>{
    need(14); doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(139,0,0); doc.text(clean(b.t),MX,y); y+=1.6;
    doc.setDrawColor(232,0,28); doc.setLineWidth(.4); doc.line(MX,y,MX+CW,y); y+=5;
    if(b.rows){ const cols=b.cols, pad=1.5, lh=3.4;
      const head=()=>{ doc.setFillColor(241,245,249); doc.rect(MX,y-3.6,CW,6,'F'); doc.setFont('helvetica','bold'); doc.setFontSize(7.8); doc.setTextColor(26,26,46);
        let x=MX; cols.forEach(c=>{ doc.text(clean(c.l),x+pad,y); x+=c.w; }); y+=4.5; };
      head();
      if(!b.rows.length){ doc.setFont('helvetica','italic'); doc.setFontSize(8.5); doc.setTextColor(100,116,139); doc.text('Aucun élément.',MX+pad,y+1); y+=7; }
      b.rows.forEach(r=>{ doc.setFont('helvetica','normal'); doc.setFontSize(8); const cells=cols.map((c,i)=>doc.splitTextToSize(clean(r[i]),c.w-2*pad));
        const h=Math.max(...cells.map(l=>l.length))*lh+2; if(y+h>HP-16){ doc.addPage(); header(); head(); doc.setFont('helvetica','normal'); doc.setFontSize(8); }
        let x=MX; doc.setTextColor(30,41,59); cols.forEach((c,i)=>{ cells[i].forEach((ln,k)=>doc.text(ln,x+pad,y+k*lh)); x+=c.w; });
        doc.setDrawColor(226,232,240); doc.setLineWidth(.2); doc.line(MX,y+h-2.6,MX+CW,y+h-2.6); y+=h; });
      y+=4; return; }
    doc.setFont('helvetica','normal'); doc.setFontSize(9.3); doc.setTextColor(30,41,59);
    String(b.txt||'-').split('\n').forEach(par=>{ doc.splitTextToSize(clean(par)||' ',CW).forEach(l=>{ need(5); doc.text(l,MX,y); y+=4.5; }); });
    y+=4;
  });
  need(34); y+=4; const sx=W-MX-78;
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(26,26,46); doc.text(clean(nom||SGS_RESP_DEFAUT),sx,y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(71,85,105); doc.text(clean(fonction||'Responsable du Système de Gestion de la Sécurité'),sx,y+4.5); doc.text('Date : '+edit,sx,y+9);
  doc.setDrawColor(148,163,184); doc.setLineWidth(.3); doc.line(sx,y+21,sx+74,y+21); doc.setFontSize(7.5); doc.text('Signature',sx,y+25);
  const n=doc.getNumberOfPages(); for(let i=1;i<=n;i++){ doc.setPage(i); if(FC){ sgsCartouche(doc,FC,i,n,clean); continue; } doc.setFontSize(7.5); doc.setTextColor(100,116,139); doc.text('Page '+i+' / '+n,W-MX,HP-7,{align:'right'}); }
  doc.save(ref+'.pdf'); return ref;
}

        {d.barrieres.map((b,i)=>(<div key={i} style={{border:"1px solid "+C.border,borderRadius:10,padding:10,display:"flex",flexDirection:"column",gap:7,background:"white"}}>
          <div style={{display:"flex",alignItems:"center"}}><b style={{flex:1,fontSize:12.5}}>Barrière {i+1}</b><span role="button" onClick={()=>up({barrieres:d.barrieres.filter((_,k)=>k!==i)})} style={{color:"#B91C1C",fontSize:12,...TAP}}>Retirer</span></div>
          <SgsPills value={b.type} onChange={v=>upB(i,{type:v})} options={SGS_BARR_T} color="#0F766E"/>
          <div style={{fontSize:10.5,color:C.slate}}>{(SGS_BARR_T.find(t=>t.k===b.type)||{}).d||'Choisissez le type de barrière.'}</div>
          <textarea rows={2} value={b.desc||''} onChange={x=>upB(i,{desc:x.target.value})} placeholder="Check-list avant décollage, alarme de configuration…" style={sgsInput}/>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{SGS_BARR_F.map(f=><button key={f.k} onClick={()=>upB(i,{fonct:f.k})} style={{padding:"6px 10px",borderRadius:8,fontSize:11.5,fontWeight:700,...TAP,
            border:"1.5px solid "+(b.fonct===f.k?f.c:C.border),background:b.fonct===f.k?f.c:"white",color:b.fonct===f.k?"white":C.slate}}>{f.l}</button>)}</div>
        </div>))}
        <SgsBtn l="+ Ajouter une barrière" onClick={()=>up({barrieres:[...d.barrieres,{type:'maitrise',desc:'',fonct:''}]})} full/>
      </>}
      {step===5&&<>
        <SgsField label="Causes possibles du mauvais fonctionnement des barrières">{txt('causes',4)}</SgsField>
        <SgsField label="Robustesse des barrières en place">{txt('robustesse',2)}</SgsField>
        <SgsField label="Recommandations, améliorations, actions correctives ou préventives">{txt('recommandations',3,"Les actions se créent ensuite depuis la fiche du danger (+ Action liée).")}</SgsField>
      </>}
      {step===6&&<>
        <SgsField label="Conclusions du responsable de l'évaluation">{txt('conclusion',3,"Danger ouvert (DG-…), ou événement isolé sans suite")}</SgsField>
        <SgsField label="Destinataires pour action">{inp('destAction')}</SgsField>
        <SgsField label="Copie pour information">{inp('copieInfo')}</SgsField>
        <div style={sgsH}>Retour d'information au déclarant (SGS 02-01 § 1.4)</div>
        {e.anonyme?<div style={{fontSize:12,color:C.slate}}>Rapport anonyme : aucun retour d'information n'est possible, comme le prévoit le manuel.</div>:<>
          <SgsField label="Le déclarant a-t-il demandé un retour ?"><SgsPills value={d.retourDemande} onChange={v=>up({retourDemande:v})} options={[{k:'oui',l:'Oui'},{k:'non',l:'Non'}]} color="#0F766E"/></SgsField>
          {d.retourDemande==='oui'&&<><SgsField label="Date du retour effectué">{inp('retourDate','','date')}</SgsField><SgsField label="Moyen (entretien, courriel, note…)">{inp('retourMoyen')}</SgsField></>}
        </>}
      </>}
    </div>
    <div style={{display:"flex",gap:8,marginTop:16}}>
      <SgsBtn l={step>1?'Précédent':'Annuler'} onClick={()=>step>1?setStep(step-1):onCancel()}/>
      {step<6&&<div style={{flex:1}}><SgsBtn l="Suivant" onClick={()=>setStep(step+1)} full/></div>}
      <div style={{flex:step<6?1:2}}><SgsBtn l="Enregistrer" onClick={save} prim full/></div>
    </div>
  </Card>);
}

// ── Revue de sécurité annuelle — SGS 03-04, formulaire ENR/SGS-FOR/SMS-01 ──
const SGS_RS_PARTICIPANTS=['Dirigeant Responsable (président)','Responsable SGS','RDOA — Opérations aériennes','RDFE — Formation des équipages','RDSV — Sécurité des vols','RDOS — Opérations sol','Responsable Qualité','RDSE — Maintien de navigabilité'];
const SGS_RS_SECTIONS=["Participants","Résultats des audits","Conclusions des inspections opérationnelles et des enquêtes","Retour d'expérience opérationnel","Rapports d'incidents et quasi-accidents",
  "Évolutions de la réglementation","Performance des processus, indicateurs et conformité","État des actions correctives et préventives","Plan d'intervention d'urgence (ERP)",
  "Suivi des revues précédentes","Retour d'expérience et recommandations d'amélioration","Violations","Décisions et actions (responsable, date butée)"];
function SgsRevue({ safety, ES, H, A, spi, reg, revues, setRevues, meetings, nomResp }){
  const yNow=new Date().getFullYear(), ans=[yNow,yNow-1,yNow-2];
  const [an,setAn]=useState(yNow), [kind,setKind]=useState('fascicule');
  const [part,setPart]=useState(['Dirigeant Responsable (président)','Responsable SGS','Responsable Qualité']);
  const [date,setDate]=useState(sgsToday()), [lieu,setLieu]=useState('Siège Afrijet Sahara, Dakhla');
  const [note,setNote]=useState(null), [busy,setBusy]=useState(false);
  const inY=d=>String(d||'').slice(0,4)===String(an);
  const generer=async()=>{
    const ev=(safety||[]).filter(e=>inY(e.date)), today=sgsToday();
    const anas=Object.values(ES||{}).map(x=>sgsAnaNorm(x.analyse)).filter(a=>a&&inY(a.dateReunion));
    const prev=(revues||[]).filter(r=>r.kind==='cr'&&Number(String(r.ref).split('-')[1])<an).sort((a,b)=>String(b.ref).localeCompare(String(a.ref)))[0];
    const data={ annee:an, type_document:kind==='cr'?'compte rendu':'fascicule préparatoire',
      comptes_rendus:{total:ev.length, par_type:SAFETY_EVENTS.map(x=>({type:(SAFETY_FLAGS.find(f=>f.k===x.k)||{}).l,n:ev.filter(e=>e[x.k]).length})).filter(x=>x.n), confidentiels:ev.filter(e=>e.confidentiel).length},
      analyses:{realisees:anas.length, barrieres_defaillantes:anas.reduce((s,a)=>s+a.barrieres.filter(b=>b.fonct&&b.fonct!=='ok').length,0)},
      dangers:H.map(h=>{const r=sgsRisqueCourant(h);return {ref:h.ref,intitule:h.titre,niveau:r?r.l+' ('+r.cell+')':'non évalué',statut:h.statut,origine:h.origine};}),
      actions:{ouvertes:A.filter(sgsActionOuverte).length,en_retard:A.filter(a=>sgsActionOuverte(a)&&a.echeance<today).length,closes_dans_annee:A.filter(a=>!sgsActionOuverte(a)&&inY(a.closedAt)).length,efficaces:A.filter(a=>a.statut==='efficace').length},
      audits:(reg.audits||[]).filter(a=>inY(a.date)).map(a=>({ref:a.ref,type:(SGS_AUD_TYPES.find(t=>t.k===a.type)||{}).l,statut:a.statut,ecarts:(a.constats||[]).filter(c=>c.niveau==='ecart').length,observations:(a.constats||[]).filter(c=>c.niveau!=='ecart').length})),
      changements:(reg.changes||[]).filter(c=>inY(c.createdAt||c.datePrevue)).map(c=>({ref:c.ref,objet:c.objet,statut:sgsChgStatut(c).l})),
      formations:{sessions:(reg.formations||[]).filter(f=>inY(f.date)).length,personnes:new Set((reg.formations||[]).filter(f=>inY(f.date)).flatMap(f=>sgsFormNoms(f))).size},
      frat:{evaluations:(reg.frat||[]).filter(f=>inY(f.date)).length,rouges:(reg.frat||[]).filter(f=>inY(f.date)&&f.couleur==='rouge').length,no_go:(reg.frat||[]).filter(f=>inY(f.date)&&f.decision==='nogo').length},
      fdm:{evenements:(reg.fdm||[]).filter(f=>inY(f.date)).length,rouges:(reg.fdm||[]).filter(f=>inY(f.date)&&f.niveau==='rouge').length},
      meda:{enquetes:(reg.meda||[]).filter(m=>inY(m.date)).length},
      safety_meetings_tenus:(meetings||[]).filter(m=>String(m.mois||'').slice(0,4)===String(an)).length,
      indicateurs_en_alerte:spi.filter(s=>s.alerte).map(s=>s.l),
      revue_precedente:prev?{ref:prev.ref,decisions:(prev.sections.find(s=>/Décisions/.test(s.title))||{}).content||''}:null };
    const system=`Tu es le responsable Qualité / SGS d'Afrijet Sahara (EMB-145, CTA marocain). Tu rédiges ${kind==='cr'?"le compte rendu de la Revue de Sécurité annuelle":"le fascicule préparatoire de la Revue de Sécurité annuelle, diffusé quelques jours avant la réunion pour que chacun la prépare"} prévue par le Manuel SGS (SGS 03-04), présidée par le Dirigeant Responsable.
Règles : français professionnel et factuel ; utilise UNIQUEMENT les données fournies ; n'invente aucun fait, chiffre, nom ni participant ; ne nomme aucune personne ; si une information manque, écris exactement "[à compléter]"${kind==='cr'?' ; les décisions et actions de séance sont "[à compléter]", sous la forme « Action — Responsable — Date butée »':' ; termine chaque section par les points que les participants doivent préparer'}.
Réponds UNIQUEMENT par un objet JSON : {"objet":"...","intro":"...","sections":[{"title":"...","content":"..."}],"closing":"..."}
Sections exactement dans cet ordre : ${SGS_RS_SECTIONS.map(s=>'"'+s+'"').join(', ')}.`;
    setBusy(true);
    try{ const j=await sgsCallAI(system,"Données de l'année :\n"+JSON.stringify(data,null,1));
      const pref=kind==='cr'?'RS':'FRS', ref=sgsRefAn(revues,pref,an+'-01-01');
      const secs=(j.sections||[]).map(s=>({title:s.title,content:s.content||''}));
      const ip=secs.findIndex(s=>/^Participants/.test(s.title)); if(ip>=0) secs[ip].content=part.join('\n')+(kind==='cr'?'\n[à compléter : autres participants éventuels]':'');
      setNote({kind, annee:an, ref, date:new Date(date).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}),
        from:(nomResp||SGS_RESP_DEFAUT)+' — Responsable SGS (organisateur)', to:part.join(' · '), objet:j.objet||('Revue de sécurité '+an),
        intro:(j.intro||'')+(lieu?'\nLieu : '+lieu+'.':''), sections:secs, closingText:j.closing||'',
        approbNom:nomResp||SGS_RESP_DEFAUT, approbFonction:'Responsable SGS — visa du Dirigeant Responsable', docType:kind==='cr'?'COMPTE RENDU REVUE DE SÉCURITÉ':'FASCICULE — REVUE DE SÉCURITÉ',
        classification:'Diffusion interne — confidentiel SGS', revision:'00'}); }
    catch(e){ uiAlert("❌ Génération impossible : "+(e.message||e)); }
    setBusy(false);
  };
  const pdf=n=>{ try{ ndsExportPDF(n&&n.kind==='cr'?{...n,form:'SMS-01'}:n); }catch(e){ uiAlert("❌ Erreur PDF : "+e.message); } };   // compte rendu : formulaire maîtrisé SMS-01
  const archiver=()=>{ const avant=revues||[]; setRevues(l=>[{...note,savedAt:new Date().toISOString()},...(l||[]).filter(x=>x.ref!==note.ref)]); sgsToast("Archivé · "+note.ref,()=>setRevues(avant)); };
  if(note) return <SgsDocPreview note={note} setNote={setNote} onBack={()=>setNote(null)} onPdf={pdf} onArchive={archiver}/>;
  const derniere=(revues||[]).filter(r=>r.kind==='cr').sort((a,b)=>String(b.ref).localeCompare(String(a.ref)))[0];
  return (<div style={{display:"flex",flexDirection:"column",gap:12}}>
    <SgsIntro titre="Revue de sécurité annuelle" refm="SGS 03-04 · formulaire ENR/SGS-FOR/SMS-01" txt={"Une fois par an, présidée par le Dirigeant Responsable et organisée par le responsable SGS. Préparez d'abord le fascicule à diffuser quelques jours avant la réunion, puis le compte rendu. "+(derniere?'Dernière revue : '+derniere.ref+'.':'Aucune revue archivée.')}/>
    <div style={sgsCard}>
      <SgsField label="1. Document"><SgsPills value={kind} onChange={setKind} options={[{k:'fascicule',l:'Fascicule préparatoire'},{k:'cr',l:'Compte rendu'}]} color="#0F766E"/></SgsField>
      <div style={{height:10}}/>
      <SgsField label="2. Année examinée"><SgsPills value={an} onChange={setAn} options={ans.map(y=>({k:y,l:String(y)}))} color="#0F766E"/></SgsField>
      <div style={{height:10}}/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        <SgsField label="3. Date de la revue"><DateField value={date} onChange={v=>setDate(v)} style={sgsInput}/></SgsField>
        <SgsField label="Lieu"><input value={lieu} onChange={e=>setLieu(e.target.value)} style={sgsInput}/></SgsField></div>
      <div style={sgsH}>4. Participants</div>
      <div style={{display:"flex",flexDirection:"column",gap:4}}>{SGS_RS_PARTICIPANTS.map(p=>{ const on=part.includes(p);
        return <label key={p} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,...TAP}}><input type="checkbox" checked={on} onChange={()=>setPart(on?part.filter(x=>x!==p):[...part,p])}/>{p}</label>; })}</div>
      <div style={{height:12}}/>
      <SgsBtn l={busy?'Rédaction en cours…':'5. Générer le '+(kind==='cr'?'compte rendu':'fascicule')} onClick={busy?undefined:generer} prim full/>
      <div style={{fontSize:10.5,color:C.slate,marginTop:6}}>L'IA reçoit uniquement des chiffres et des références : aucun nom, aucune description de compte rendu.</div>
    </div>
    {(revues||[]).length>0&&<div style={sgsCard}><div style={{...sgsH,marginTop:0}}>Archives</div>
      {(revues||[]).map(r=><div key={r.ref} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid "+C.border}}>
        <div style={{flex:1}}><b style={{fontSize:12.5,fontFamily:"monospace",color:"#DC2626"}}>{r.ref}</b><div style={{fontSize:11.5,color:C.slate}}>{r.kind==='cr'?'Compte rendu':'Fascicule'} · {r.annee}</div></div>
        <SgsBtn l="Ouvrir" onClick={()=>setNote(r)}/><SgsBtn l="PDF" onClick={()=>pdf(r)}/>
        <SgsBtn l="✕" danger onClick={async()=>{ if(await uiConfirm("Supprimer "+r.ref+" ?")) setRevues(l=>(l||[]).filter(x=>x.ref!==r.ref)); }}/></div>)}</div>}
  </div>);
}

// ── Gestion des changements — SGS 03-05, formulaire « Évaluation d'impact sur la sécurité » ENR/SGS-FOR/SMS-06 ──
const SGS_ENT_INT=['Encadrement','Opérations sol','Opérations vol','Système qualité','Programme de prévention des accidents et de sécurité des vols','Gestion du maintien de navigabilité'];
const SGS_ENT_EXT=['Circulation aérienne',"Exploitant d'aérodrome",'Assistant en escale','Sous-traitant entretien','Autre sous-traitant','Autre (client, etc.)'];
const SGS_AUTOR=['Contact autorité de tutelle','Contact autre autorité','Autorisations liées aux spécifications opérationnelles','Autorisations liées à la gestion de la navigabilité',"Autorisations liées à l'agrément de maintenance"];
const SGS_DOCS=[['manuelExpl',"Manuel d'exploitation"],['moe','MOE'],['mme','MME'],['procedures','Procédures'],['autres','Autres documents internes'],['contrats','Contrats, protocoles']];
function sgsChgStatut(c){
  if(c.approuve==='oui') return {k:'approuve',l:'Approuvé',bg:'#EAF3DE',fg:'#27500A'};
  if(c.approuve==='non') return {k:'refuse',l:'Refusé',bg:'#FCEBEB',fg:'#791F1F'};
  const ok=(c.eis||[]).length&&(c.eis||[]).every(x=>x.P&&x.G)&&(c.conclusion||'').trim();
  return ok?{k:'evalue',l:'Évalué — à approuver',bg:'#FAEEDA',fg:'#633806'}:{k:'etude',l:'En étude',bg:'#E1F5EE',fg:'#085041'};
}
const sgsChgAnalyse=c=>['evalue','approuve','refuse'].includes(sgsChgStatut(c).k);
function SgsChangesView({ items, setItems, nomResp, onDanger }){
  const [ed,setEd]=useState(null), [step,setStep]=useState(1);
  const list=[...(items||[])].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  const nouveau=()=>{ setStep(1); setEd({objet:'',responsable:nomResp,fonction:'Responsable SGS',datePrevue:'',nature:'permanent',description:'',raison:'',entitesInt:[],entitesExt:[],reglementation:'',autorisations:[],docs:{},justifDocs:'',
    autresEtudes:'non',actionsRealisees:'',actionsARealiser:'',participants:'',eis:[],miseEnOeuvre:[],conclusion:'',approuve:'',approuvePar:'Dirigeant Responsable',dateApprobation:'',destAction:'',copieInfo:''}); };
  if(ed){
    const up=p=>setEd({...ed,...p}), tog=(k,v)=>up({[k]:(ed[k]||[]).includes(v)?ed[k].filter(x=>x!==v):[...(ed[k]||[]),v]});
    const upEi=(i,p)=>up({eis:ed.eis.map((x,k)=>k===i?{...x,...p}:x)});
    const S=[{k:1,l:'Général'},{k:2,l:'Changement'},{k:3,l:'Impacts'},{k:4,l:'Risques'},{k:5,l:'Mise en œuvre'},{k:6,l:'Approbation'}];
    const inp=(k,ph,type)=><input type={type||'text'} value={ed[k]||''} onChange={x=>up({[k]:x.target.value})} placeholder={ph} style={sgsInput}/>;
    const txt=(k,r,ph)=><textarea rows={r||3} value={ed[k]||''} onChange={x=>up({[k]:x.target.value})} placeholder={ph} style={sgsInput}/>;
    const chk=(k,v)=><label key={v} style={{display:"flex",alignItems:"flex-start",gap:8,fontSize:12.5,...TAP}}><input type="checkbox" checked={(ed[k]||[]).includes(v)} onChange={()=>tog(k,v)} style={{marginTop:2}}/>{v}</label>;
    const save=()=>{ if(!(ed.objet||'').trim()){ uiAlert("⚠️ Indiquez l'objet du changement (étape Général)."); setStep(1); return; }
      const now=new Date().toISOString(); const it={...ed,updatedAt:now};
      if(ed.id) setItems(l=>(l||[]).map(x=>x.id===ed.id?it:x)); else setItems(l=>[...(l||[]),{...it,id:'CHG'+Date.now(),ref:sgsRefAn(items,'EIS'),createdAt:now}]);
      setEd(null); sgsToast("Évaluation d'impact enregistrée"); };
    return (<Card accent="#0F766E">
      <FHeader icon="🔀" title={ed.ref||"Nouvelle évaluation d'impact"} subtitle={"ENR/SGS-FOR/SMS-06 · étape "+step+" sur 6 — "+S[step-1].l} color="#0F766E"/>
      <div style={{marginBottom:14}}><SgsStepper steps={S} value={step} onPick={setStep}/></div>
      <div style={{display:"flex",flexDirection:"column",gap:11,minHeight:240}}>
        {step===1&&<>
          <SgsField label="I.1 Objet du changement">{inp('objet',"Ouverture de la ligne Dakhla – Nouakchott")}</SgsField>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}><SgsField label="I.2 Responsable de l'évaluation">{inp('responsable')}</SgsField><SgsField label="Fonction">{inp('fonction')}</SgsField></div>
          <SgsField label="Participants à l'évaluation (un par ligne)">{txt('participants',3)}</SgsField>
          <div style={{fontSize:11,color:C.slate}}>SGS 03-05 : chacun étudie le changement personnellement, puis le groupe met en commun lors d'une réunion organisée par le responsable SGS.</div>
        </>}
        {step===2&&<>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}><SgsField label="II.1 Date ou période prévue">{inp('datePrevue','','date')}</SgsField>
            <SgsField label="Nature"><SgsPills value={ed.nature} onChange={v=>up({nature:v})} options={[{k:'ponctuel',l:'Ponctuel'},{k:'permanent',l:'Permanent'}]} color="#0F766E"/></SgsField></div>
          <SgsField label="II.2 Description détaillée du changement">{txt('description',4)}</SgsField>
          <SgsField label="II.3 Raison de la décision">{txt('raison',2)}</SgsField>
        </>}
        {step===3&&<>
          <div style={sgsH}>III.1 Entités concernées — au sein de l'exploitant</div>{SGS_ENT_INT.map(v=>chk('entitesInt',v))}
          <div style={sgsH}>Au sein d'organismes tiers</div>{SGS_ENT_EXT.map(v=>chk('entitesExt',v))}
          <SgsField label="III.2 Réglementation applicable">{txt('reglementation',2)}</SgsField>
          <div style={sgsH}>III.3 Autorisations spécifiques</div>{SGS_AUTOR.map(v=>chk('autorisations',v))}
          <div style={sgsH}>III.4 Influence sur la documentation</div>
          {SGS_DOCS.map(([k,l])=><div key={k} style={{display:"flex",alignItems:"center",gap:8,fontSize:12.5}}><span style={{flex:1}}>{l}</span>
            <SgsPills value={(ed.docs||{})[k]||'non'} onChange={v=>up({docs:{...(ed.docs||{}),[k]:v}})} options={[{k:'oui',l:'Oui'},{k:'non',l:'Non'}]} color="#0F766E"/></div>)}
          <SgsField label="Précisions">{txt('justifDocs',2)}</SgsField>
          <SgsField label="III.5 Influence sur d'autres études d'impact existantes"><SgsPills value={ed.autresEtudes} onChange={v=>up({autresEtudes:v})} options={[{k:'oui',l:'Oui'},{k:'non',l:'Non'}]} color="#0F766E"/></SgsField>
        </>}
        {step===4&&<>
          <div style={{fontSize:12,color:C.text,lineHeight:1.5}}>VI à VIII — pour chaque événement indésirable que le changement pourrait provoquer : causes, fréquence et gravité justifiées, puis mesures d'atténuation et risque corrigé.</div>
          {ed.eis.map((x,i)=>{ const r1=sgsRisque(x.P,x.G), r2=sgsRisque(x.P2,x.G2);
            return <div key={i} style={{border:"1px solid "+C.border,borderRadius:10,padding:10,display:"flex",flexDirection:"column",gap:8,background:"white"}}>
              <div style={{display:"flex",alignItems:"center"}}><b style={{flex:1,fontSize:13}}>Risque n° {i+1}</b><span role="button" onClick={()=>up({eis:ed.eis.filter((_,k)=>k!==i)})} style={{color:"#B91C1C",fontSize:12,...TAP}}>Retirer</span></div>
              <input value={x.designation||''} onChange={e=>upEi(i,{designation:e.target.value})} placeholder="Désignation de l'événement indésirable" style={sgsInput}/>
              <textarea rows={2} value={x.causes||''} onChange={e=>upEi(i,{causes:e.target.value})} placeholder="Causes possibles" style={sgsInput}/>
              <textarea rows={2} value={x.consequences||''} onChange={e=>upEi(i,{consequences:e.target.value})} placeholder="Conséquences possibles" style={sgsInput}/>
              <div style={{fontSize:11.5,fontWeight:700,color:C.slate}}>Risque initial : fréquence (lignes) × gravité (colonnes)</div>
              <SgsMatrice P={x.P} G={x.G} onPick={(P,G)=>upEi(i,{P,G})} small/>
              {r1&&<div style={{fontSize:12}}><SgsBadge r={r1}/> · {SGS_FREQ.find(f=>f.k===x.P).l} × {SGS_GRAV6.find(g=>g.k===x.G).l} · acceptable avant atténuation : <b>{r1.niv==='acceptable'?'oui':'non'}</b></div>}
              <input value={x.justif||''} onChange={e=>upEi(i,{justif:e.target.value})} placeholder="Justification du classement" style={sgsInput}/>

            </div>; })}
          <SgsBtn l="+ Événement indésirable" onClick={()=>up({eis:[...ed.eis,{designation:'',mesures:[]}]})} full/>
        </>}
        {step===5&&<>
          <SgsField label="V. Actions réalisées">{txt('actionsRealisees',2)}</SgsField>

            <input value={m.entite||''} onChange={e=>up({miseEnOeuvre:ed.miseEnOeuvre.map((y,k)=>k===i?{...y,entite:e.target.value}:y)})} placeholder="Entité" style={sgsInput}/>
            <DateField value={m.echeance||''} onChange={v=>up({miseEnOeuvre:ed.miseEnOeuvre.map((y,k)=>k===i?{...y,echeance:v}:y)})} style={sgsInput}/>

          <SgsBtn l="+ Mesure à mettre en œuvre" onClick={()=>up({miseEnOeuvre:[...ed.miseEnOeuvre,{mesure:'',entite:'',echeance:''}]})} full/>
        </>}
        {step===6&&<>
          <SgsField label="X. Conclusion du responsable de l'évaluation">{txt('conclusion',3)}</SgsField>

        </>}

      <div style={{display:"flex",gap:8,marginTop:16}}>
        <SgsBtn l={step>1?'Précédent':'Annuler'} onClick={()=>step>1?setStep(step-1):setEd(null)}/>

  }
  const pdf=c=>{ try{ sgsDocPDF({ref:c.ref,form:'SMS-06',titre:"Évaluation d'impact sur la sécurité",sous:c.objet,nom:c.responsable,fonction:c.fonction,

      {t:'VI à VIII. Événements indésirables et évaluation des risques',cols:[{l:'Événement indésirable',w:58},{l:'Initial',w:22},{l:'Mesures',w:62},{l:'Corrigé',w:22},{l:'Registre',w:18}],

  return (<div style={{display:"flex",flexDirection:"column",gap:12}}>

  </div>);
}
