// ══ Enquête de satisfaction : saisie par le PNC auprès du client principal ══
// Une enquête par vol. Le choix du vol porte sur une fenêtre de 36 h en arrière et 12 h en avant
// (heures GMT), pour couvrir un vol de nuit renseigné le lendemain matin.
const SAT_SECTIONS=[
  {num:"1",title:"Embarquement & Enregistrement",color:"#0F1F3D",items:["Accueil au sol","Rapidité de l'enregistrement","Information sur le vol","Processus d'embarquement"]},
  {num:"2",title:"Confort à Bord",color:"#1D4ED8",items:["Confort du siège","Propreté de la cabine","Température & ventilation","Niveau sonore"]},
  {num:"3",title:"Service Cabin Crew",color:"#00936A",items:["Accueil à bord","Courtoisie & professionnalisme","Réactivité aux demandes","Qualité du service en vol","Annonces & communication"]},
  {num:"4",title:"Ponctualité & Opérations",color:"#7C3AED",items:["Respect de l'horaire","Communication en cas de retard"]},
];
const SAT_ITEMS=SAT_SECTIONS.flatMap(s=>s.items);
// Couleur d'une note : 1 et 2 en rouge, 3 en orange, 4 et 5 en vert
const SAT_COUL=v=>v<=2?"#DC2626":v===3?"#D97706":"#00936A";
// Toutes les notes sont exprimées sur 10
const sat10=m=>m==null?null:Math.round(m*2*10)/10;
const satMoyenne=n=>{ const v=Object.values(n||{}).map(Number).filter(x=>x>=1&&x<=5); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null; };
// Vols proposés : fenêtre glissante autour de l'heure courante, du plus récent au plus ancien
function satVols(flights, tous){
  const now=Date.now(), h=3600000;
  const t=f=>{ const d=String(f.date||"")+"T"+String(f.dep||"00:00")+":00Z"; const x=Date.parse(d); return isNaN(x)?Date.parse(String(f.date||"")+"T00:00:00Z"):x; };
  return (flights||[]).filter(f=>f.date&&["Planifie","En vol","Termine"].includes(f.status))
    .filter(f=>tous||(t(f)>=now-36*h&&t(f)<=now+12*h))
    .sort((a,b)=>t(b)-t(a));
}
const satKey=f=>[f.num,f.date,f.dep,f.from,f.to].map(x=>String(x||"")).join("|");   // numéro, date, heure et route : deux rotations du même jour restent distinctes
// L'enquête d'un vol, et la note sur 10 qui en découle (moyenne /5 × 2)
const satDuVol=(satis,f)=>(satis||[]).find(s=>s.flightKey===satKey(f));
const satNote10=s=>s&&s.moyenne!=null?Math.round(s.moyenne*2*10)/10:null;
const satMoyListe=L=>{ const v=(L||[]).map(s=>s.moyenne).filter(x=>x!=null); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null; };
function FormSatisfactionSaisie({ flights, items, setItems, onClose, onNoteVol }){
  // Fenêtre de 36 h en arrière et 12 h en avant ; si elle est vide, on élargit d'emblée à tous les vols
  const proches=satVols(flights,false);
  const [tous,setTous]=useState(proches.length===0);
  const vols=satVols(flights,tous);
  const [ed,setEd]=useState(()=>{ const v=proches.length?proches:satVols(flights,true); const now=Date.now();
    const passe=v.filter(f=>Date.parse(String(f.date)+"T"+String(f.dep||"00:00")+":00Z")<=now);
    const f=passe[0]||v[0]; return {notes:{},...(f?{flightKey:satKey(f),num:f.num,date:f.date,dep:f.dep,from:f.from,to:f.to,clientId:f.clientId}:{}),manuel:!f}; });
  const up=p=>setEd(o=>({...o,...p}));
  const moy=satMoyenne(ed.notes);
  const choisir=v=>{ const f=vols.find(x=>satKey(x)===v); up(f?{flightKey:v,num:f.num,date:f.date,dep:f.dep,from:f.from,to:f.to,clientId:f.clientId,manuel:false}:{flightKey:""}); };
  const save=()=>{
    const n=Object.keys(ed.notes||{}).length;
    // Les 15 rubriques sont obligatoires : une enquête partielle fausserait la note du vol et les indicateurs
    if(n<SAT_ITEMS.length){
      const manque=SAT_ITEMS.filter(i=>(ed.notes||{})[i]==null);
      uiAlert("⚠️ Enquête incomplète : "+n+" rubrique(s) sur "+SAT_ITEMS.length+".\n\nIl manque :\n· "+manque.slice(0,6).join("\n· ")+(manque.length>6?"\n· … et "+(manque.length-6)+" autre(s)":""));
      return;
    }
    if(!ed.flightKey&&!(ed.num||"").trim()){ uiAlert("⚠️ Indiquez le vol : choisissez-le dans la liste, ou saisissez son numéro et sa date."); return; }
    if((items||[]).some(x=>x.flightKey&&x.flightKey===ed.flightKey)){ uiAlert("⚠️ Une enquête existe déjà pour ce vol."); return; }
    const u=typeof sgsCurrentUser==="function"?sgsCurrentUser():null;
    // Note du vol : moyenne des 15 rubriques, ramenée sur 10
    if(onNoteVol) onNoteVol(ed.flightKey||satKey(ed),Math.round(moy*2*10)/10);
    setItems(l=>[...(l||[]),{...ed,id:"SAT"+Date.now(),flightKey:ed.flightKey||satKey(ed),moyenne:moy,repondues:n,
      auteur:userLabel(u)||"", createdAt:new Date().toISOString(),}]);
    sgsToast("Enquête enregistrée");
    setEd({notes:{},manuel:true,num:"",date:""});
  };
  const note=(item,v)=>setEd(o=>({...o,notes:{...(o.notes||{}),[item]:v}}));
  const inp={...sgsInput,padding:"9px 11px"};
  return (<Card accent="#D97706"><FHeader icon="⭐" title="Enquête de satisfaction" subtitle="Une enquête par vol · saisie après le vol, d'après le questionnaire rempli à bord" color="#D97706"/>
    <div style={{display:"flex",flexDirection:"column",gap:11}}>
      <SgsField label={"Vol (heures GMT)"+(tous?(proches.length?"":" · aucun vol récent, tous les vols affichés"):" · 36 h en arrière, 12 h en avant")}>
        <CustomSelect dense searchable value={ed.flightKey||""} placeholder="-- Choisir le vol --"
          onChange={choisir}
          options={vols.map(f=>({value:satKey(f),label:(f.num||"")+" · "+(f.from||"")+"→"+(f.to||""),sub:sgsFr(f.date)+(f.dep?" · "+f.dep+" GMT":"")}))}/>
      </SgsField>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",fontSize:11.5}}>
        <span role="button" onClick={()=>setTous(t=>!t)} style={{color:"#0369A1",textDecoration:"underline",...TAP}}>{tous?"Revenir aux vols récents":"Voir tous les vols"}</span>
        <span role="button" onClick={()=>up({manuel:!ed.manuel,flightKey:""})} style={{color:"#0369A1",textDecoration:"underline",...TAP}}>{ed.manuel?"Choisir dans la liste":"Le vol n'est pas dans la liste"}</span>
      </div>
      {ed.manuel&&<div style={{display:"grid",gridTemplateColumns:"1fr 118px",gap:8}}>
        <SgsField label="Numéro de vol"><input aria-label="Numéro de vol" value={ed.num||""} onChange={e=>up({num:e.target.value.toUpperCase()})} placeholder="AJS205" style={inp}/></SgsField>
        <SgsField label="Date"><DateField value={ed.date||""} onChange={v=>up({date:v})} style={inp}/></SgsField></div>}
      {SAT_SECTIONS.map(sec=><div key={sec.num} style={{border:"1px solid "+C.border,borderRadius:10,overflow:"hidden"}}>
        <div style={{background:sec.color,color:"white",padding:"7px 11px",fontWeight:700,fontSize:11.5}}>{sec.num}. {sec.title.toUpperCase()}</div>
        {sec.items.map(item=><div key={item} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,padding:"7px 10px",borderTop:"1px solid "+C.border}}>
          <span style={{fontSize:12,color:C.text,flex:1,minWidth:0}}>{item}</span>
          <div style={{display:"flex",gap:4,flexShrink:0}}>{[1,2,3,4,5].map(v=>{ const on=(ed.notes||{})[item]===v, col=SAT_COUL(v);
            return <button key={v} aria-label={item+" : "+v} onClick={()=>note(item,v)} style={{width:28,height:28,borderRadius:7,fontSize:12,fontWeight:700,...TAP,
              border:"1.5px solid "+(on?col:C.border),background:on?col:"white",color:on?"white":C.text}}>{v}</button>; })}</div>
        </div>)}
      </div>)}
      <SgsField label="Commentaire du client"><textarea aria-label="Commentaire du client" rows={3} value={ed.commentaire||""} onChange={e=>up({commentaire:e.target.value})} style={sgsInput}/></SgsField>
      <div style={{background:C.bg,borderRadius:9,padding:"9px 11px",fontSize:12.5,color:C.text}}>
        {(()=>{ const n=Object.keys(ed.notes||{}).length, complet=n===SAT_ITEMS.length;
          return <>Moyenne : <b style={{color:moy!=null&&complet?SAT_COUL(moy):C.slate}}>{complet?sat10(moy)+" / 10":"—"}</b>
            {" · "}<span style={{color:complet?"#047857":"#B45309",fontWeight:700}}>{n} / {SAT_ITEMS.length} rubriques notées</span>
            {!complet&&<span style={{color:C.slate}}> · toutes sont nécessaires pour enregistrer</span>}</>; })()}</div>
      <div style={{display:"grid",gridTemplateColumns:onClose?"1fr 1fr":"1fr",gap:8}}>
        {onClose&&<SgsBtn l="Fermer" onClick={onClose} full/>}
        <SgsBtn l="Enregistrer" onClick={save} prim full/></div>
      {(items||[]).length>0&&<div>
        <div style={{...sgsH,marginTop:4}}>Enquêtes saisies · moyenne {sat10(satMoyListe(items))}/10</div>
        <div style={sgsCard}>{[...(items||[])].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).slice(0,12).map(s=>
          <SgsRow key={s.id} color="#D97706" titre={(s.num||"")+" · "+(s.from||"")+"→"+(s.to||"")+" · "+sat10(s.moyenne)+"/10"}
            sub={sgsFr(s.date)+" · "+s.repondues+" rubriques"+(s.auteur?" · "+s.auteur:"")+(s.commentaire?" · « "+String(s.commentaire).slice(0,40)+" »":"")}
            onClick={()=>uiAlert(SAT_ITEMS.map(i=>i+" : "+((s.notes||{})[i]||"—")).join("\n"))}/>)}</div></div>}
    </div></Card>);
}

function ScreenForms({ sgs, satis, setSatis, onNoteVol, onSubmitVol, onSubmitMaint, onSubmitFin, onSubmitSafety, onReset, onRestore, onReport, onLogout, flights, crew, setCrew, maintData, finData, kpis, dismissed, safetyData, onImport, aircraft, onUpdateAircraft, melHist, setMelHist, lastBackup, setLastBackup, canForm, profileLabel, profileId, clients, setClients, ndsArchive, setNdsArchive }) {
  const isAdmin = profileId === "rdoa";
  const defaultForm = profileId==="maint"?"maint":profileId==="fin"?"fin":profileId==="ops"?"vol":profileId==="comm"?"clients":profileId==="eqp"?"secu":null;   // Équipage : arrive sur le compte rendu · SGS : sur la grille
  const [active,setActive]=useState(defaultForm);
  const [saved,setSaved]=useState(false);
  const [satSaisie,setSatSaisie]=useState(false);
  // Remplir une enquête : personnel de cabine (rôle CC) et Administrateur seulement.
  // Tant qu'un département n'a pas de comptes nominatifs, le rôle est inconnu : la saisie reste ouverte au profil Équipage.
  const satUser=typeof sgsCurrentUser==="function"?sgsCurrentUser():null;
  const satPeutRemplir=profileId==="rdoa"||(profileId==="eqp"&&(!satUser||!satUser.role||satUser.role==="CC"));
  const ok=fn=>d=>{fn(d);setSaved(true);setTimeout(()=>setSaved(false),2500);};

  const [progress,setProgress]=useState(null); // {title,icon,steps,currentStep,pct}
  const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));

  const doExport=async()=>{
    const steps=["Préparation des données","Envoi vers Supabase","Téléchargement local"];
    setProgress({title:"Sauvegarde en cours",icon:"📥",steps,currentStep:0,pct:10});
    await sleep(300);
    const data={
      version:"1.0",
      exportDate:new Date().toISOString(),
      flights,
      maintData,
      crew,
      finData,
      kpis,
      dismissed,
      safetyData,
      clients,
      ndsArchive,
      ...(sgs?{sgsHazards:sgs.hazards,sgsActions:sgs.actions,sgsEvStatus:sgs.evStatus,sgsManual:sgs.manual,sgsMeetings:sgs.meetings,sgsResponsable:sgs.responsable,sgsRevues:sgs.reg.revues,sgsChanges:sgs.reg.changes,sgsAudits:sgs.reg.audits,sgsFormations:sgs.reg.formations,sgsFrat:sgs.reg.frat,sgsMeda:sgs.reg.meda,satisfaction:satis,sgsFdm:sgs.reg.fdm,sgsItw:sgs.reg.itw,sgsReco:sgs.reg.reco,sgsPlan:sgs.reg.plan,sgsOsv:sgs.reg.osv}:{}),
    };
    setProgress(p=>({...p,currentStep:1,pct:40}));
    try{
      await sbSet(PFX+"lastBackupData", data);
      setLastBackup(data.exportDate);
    }catch(_e){ logSilent(_e); }
    setProgress(p=>({...p,currentStep:2,pct:75}));
    await sleep(300);
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="afrijet_backup_"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setProgress(p=>({...p,currentStep:3,pct:100}));
    await sleep(600);
    setProgress(null);
  };

  // Compute days since last backup
  const daysSince=lastBackup?(()=>{
    const today=new Date(); today.setHours(0,0,0,0);
    const backupDay=new Date(lastBackup); backupDay.setHours(0,0,0,0);
    return Math.floor((today.getTime()-backupDay.getTime())/(1000*60*60*24));
  })():null;



  const ALL_FORMS=[
    {id:"avion",    icon:"🛩",  label:"Avion",          color:"#0369A1"},
    {id:"crew",     icon:"👨‍✈️", label:"Equipage",       color:"#0369A1"},
    {id:"maint",    icon:"🔧",  label:"Maintenance",    color:"#00936A"},
    {id:"vol",      icon:"🛫",  label:"Vol",            color:"#0F1F3D"},
    {id:"frat",     icon:"🧭",  label:"FRAT",            color:"#0F766E"},
    {id:"sgs",      icon:"🛡",  label:"SGS",             color:"#0F766E"},
    {id:"secu",     icon:"🛡",  label:"Comptes rendus", color:"#DC2626"},
    {id:"docavion", icon:"📁",  label:"Doc Avion",      color:"#0369A1"},
    {id:"regl",     icon:"📋",  label:"Réglementation", color:"#B45309"},
    {id:"sat",      icon:"⭐",  label:"Satisfaction",   color:"#D97706"},
    {id:"clients",  icon:"🏢",  label:"Clients",         color:"#0891B2"},
    {id:"nds",      icon:"📋",  label:"Générateur IA",   color:"#0F1F3D"},
    {id:"rapport",  icon:"📊",  label:"Rapport",         color:"#00936A"},
    {id:"fin",      icon:"💰",  label:"Finances",       color:"#7C3AED"},
    {id:"journal",  icon:"🔏",  label:"Journal d'audit", color:"#1a1a2e"},
  ];
  const FORMS = ALL_FORMS; // Toujours afficher toutes les tuiles
  const canAccessForm = (id) => !canForm || canForm(id);
  // Reset active if current form is not allowed for this profile
  const activeAllowed = !active || canAccessForm(active);
  const effectiveActive = activeAllowed ? active : null;
  const f=FORMS.find(x=>x.id===effectiveActive);
  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {progress&&<ProgressModal title={progress.title} icon={progress.icon} steps={progress.steps} currentStep={progress.currentStep} pct={progress.pct}/>}
      <Card accent="#0F1F3D">
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:44,height:44,borderRadius:10,background:"#0F1F3D",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>📝</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:800,fontSize:15,color:C.navy}}>Formulaires de saisie</div>
            <div style={{fontSize:11,color:C.slate}}>Saisie par departement</div>
          </div>
        </div>
        <ActionBar isAdmin={isAdmin} doExport={doExport} onRestore={onRestore} onReset={onReset} onLogout={onLogout}/>
      </Card>
      {saved&&(
        <div style={{padding:"12px 16px",borderRadius:10,fontSize:13,fontWeight:700,textAlign:"center",background:"#D1FAE5",color:"#00936A",border:"1px solid #00936A"}}>
          ✅ Données enregistrées
        </div>
      )}
      {(()=>{
        if(daysSince===null) return (
          <div style={{padding:"10px 14px",borderRadius:10,fontSize:12,background:"#FEF3C7",border:"1px solid #D97706",color:"#92400E",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:16}}>💾</span>
            <span><b>Aucun backup effectué</b> — pensez à exporter vos données</span>
          </div>
        );
        if(daysSince===0) return (
          <div style={{padding:"10px 14px",borderRadius:10,fontSize:12,background:"#D1FAE5",border:"1px solid #00936A",color:"#065F46",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:16}}>✅</span>
            <span><b>Backup effectué le {new Date(lastBackup).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})} à {new Date(lastBackup).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</b> — données sécurisées</span>
          </div>
        );
        if(daysSince<=3) return (
          <div style={{padding:"10px 14px",borderRadius:10,fontSize:12,background:"#FEF3C7",border:"1px solid #D97706",color:"#92400E",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:16}}>⚠️</span>
            <span><b>Dernier backup il y a {daysSince} jour{daysSince>1?"s":""}</b> — pensez à exporter</span>
          </div>
        );
        return (
          <div style={{padding:"10px 14px",borderRadius:10,fontSize:12,background:"#FEE2E2",border:"1px solid #DC2626",color:"#991B1B",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:16}}>🚨</span>
            <span><b>Dernier backup il y a {daysSince} jours</b> — exportez vos données maintenant !</span>
          </div>
        );
      })()}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
        {FORMS.map(fm=>{
          const allowed = canAccessForm(fm.id);
          return (
          <button key={fm.id} onClick={()=>{
            if(!allowed){ return; }
            if(fm.id==="rapport"){ if(onReport) onReport(); return; }
            setActive(fm.id);
          }}
            style={{padding:"8px 4px",borderRadius:10,border:"1.5px solid",fontSize:9,fontWeight:700,...TAP,
              borderColor:effectiveActive===fm.id?fm.color:C.border,
              background:effectiveActive===fm.id?fm.color+"15":"white",
              color:effectiveActive===fm.id?fm.color:C.slate}}>
            <div style={{fontSize:16,marginBottom:2}}>{fm.icon}</div>
            <div>{fm.label}</div>
            {!allowed&&<div style={{fontSize:7,color:"#94A3B8"}}>🔒</div>}
          </button>
          );
        })}
        {effectiveActive==="sat"&&(
          <div style={{position:"fixed",inset:0,zIndex:500,display:"flex",flexDirection:"column",background:"#0F1F3D"}}>
            <div style={{padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,borderBottom:"2px solid #A0720A"}}>
              <div>
                <div style={{color:"white",fontWeight:800,fontSize:14}}>📋 Formulaire Satisfaction</div>
                <div style={{color:"#A0720A",fontSize:10}}>Afrijet Sahara</div>
              </div>
              <button onClick={()=>setActive(null)}
                style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:8,padding:"8px 16px",color:"white",fontSize:13,fontWeight:700,...TAP}}>
                Fermer
              </button>
            </div>
              {/* Saisie réservée au personnel de cabine (rôle CC) et à l'Administrateur ; les autres profils téléchargent seulement */}
              <div style={{padding:"10px 16px",background:"#0A1628",borderBottom:"1px solid rgba(255,255,255,.1)",flexShrink:0,display:"grid",gridTemplateColumns:satPeutRemplir?"1fr 1fr":"1fr",gap:8}}>
                {satPeutRemplir&&<button onClick={()=>setSatSaisie(s=>!s)}
                  style={{height:42,borderRadius:9,border:"none",background:satSaisie?"#475569":"#D97706",color:"white",fontWeight:700,fontSize:13,...TAP}}>{satSaisie?"📋 Questionnaire":"⭐ Remplir"+((satis||[]).length?" ("+(satis||[]).length+")":"")}</button>}
                <button onClick={()=>{
                  if(!window.jspdf){uiAlert("jsPDF non charge. Verifiez votre connexion.");return;}
                  try {
                    const {jsPDF} = window.jspdf;
                    const doc = new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
                    const W=210, H=297, M=15, CW=W-2*M;
                    const NAVY=[15,31,61], GOLD=[160,114,10], EMERALD=[0,147,106];
                    const SLATE=[100,116,139], RED=[220,38,38], BLUE=[29,78,216];
                    const PURPLE=[124,58,237], WHITE=[255,255,255], LIGHT=[238,242,248];
                    // Header
                    doc.setFillColor(...NAVY);doc.rect(0,0,W,28,"F");
                    doc.setFillColor(...GOLD);doc.rect(0,28,W,1.5,"F");
                    doc.addImage(LOGO_B64,"JPEG",M,4,30,10);
                    doc.setTextColor(...WHITE);doc.setFont("helvetica","bold");doc.setFontSize(14);
                    doc.text("Enquête de Satisfaction Passager",M+35,12);
                    doc.setFont("helvetica","normal");doc.setFontSize(8);
                    doc.setTextColor(148,163,184);
                    doc.text("EMB-140 LR  ·  CN-KTA  ·  Votre avis améliore nos services",M+35,18);
                    let y=36;
                    // Info row
                    doc.setFillColor(...LIGHT);doc.rect(M,y,CW,10,"F");
                    const fields=[["N° Vol",0.18],["Date",0.18],["Route",0.22],["Classe",0.15],["Siège",0.13],["CM1",0.14]];
                    let fx=M;
                    fields.forEach(([lbl,w])=>{
                      const fw=CW*w;
                      doc.setTextColor(...SLATE);doc.setFont("helvetica","bold");doc.setFontSize(6.5);
                      doc.text(lbl.toUpperCase(),fx+2,y+4);
                      doc.setDrawColor(148,163,184);doc.setLineWidth(0.3);
                      doc.line(fx+2,y+8,fx+fw-2,y+8);
                      fx+=fw;
                    });
                    y+=14;
                    // Section helper
                    const section=(title,r,g,b)=>{
                      if(y>260){doc.addPage();y=15;}
                      doc.setFillColor(r,g,b);doc.rect(M,y,CW,7,"F");
                      doc.setTextColor(...WHITE);doc.setFont("helvetica","bold");doc.setFontSize(8);
                      doc.text("  "+title.toUpperCase(),M+2,y+5);
                      y+=10;
                    };
                    const ratingRow=(label,sublabel="")=>{
                      if(y>268){doc.addPage();y=15;}
                      doc.setFillColor(248,250,252);doc.rect(M,y,CW,8,"F");
                      doc.setDrawColor(221,227,237);doc.setLineWidth(0.2);doc.rect(M,y,CW,8,"S");
                      doc.setTextColor(...NAVY);doc.setFont("helvetica","bold");doc.setFontSize(8.5);
                      doc.text(label,M+3,y+4);
                      if(sublabel){doc.setFont("helvetica","normal");doc.setFontSize(6.5);doc.setTextColor(...SLATE);doc.text(sublabel,M+3,y+7);}
                      for(let i=0;i<5;i++){
                        const bx=M+CW*0.62+i*13;
                        doc.setFillColor(...WHITE);doc.setDrawColor(...NAVY);doc.setLineWidth(0.6);
                        doc.rect(bx,y+2,4,4,"FD");
                        doc.setFillColor(...GOLD);doc.setFont("helvetica","normal");doc.setFontSize(6);
                        doc.text(String(i+1),bx+5,y+5.5);
                      }
                      y+=9;
                    };
                    const yesnoRow=(label)=>{
                      if(y>268){doc.addPage();y=15;}
                      doc.setFillColor(244,247,251);doc.rect(M,y,CW,7,"F");
                      doc.setDrawColor(221,227,237);doc.setLineWidth(0.2);doc.rect(M,y,CW,7,"S");
                      doc.setTextColor(...NAVY);doc.setFont("helvetica","bold");doc.setFontSize(8.5);
                      doc.text(label,M+3,y+4.5);
                      ["Oui","Non"].forEach((opt,i)=>{
                        const bx=M+CW*0.75+i*18;
                        doc.setFillColor(...WHITE);doc.setDrawColor(...NAVY);doc.setLineWidth(0.6);
                        doc.rect(bx,y+2,4,4,"FD");
                        doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setFillColor(...NAVY);
                        doc.text(opt,bx+5,y+5.5);
                      });
                      y+=8;
                    };
                    // Column headers
                    doc.setTextColor(...SLATE);doc.setFont("helvetica","bold");doc.setFontSize(6.5);
                    doc.text("CRITÈRE D'ÉVALUATION",M+2,y+3);
                    doc.text("NOTE (cochez une case)",M+CW*0.62,y+3);
                    y+=7;
                    section("1. Embarquement & Enregistrement",...NAVY);
                    ratingRow("Accueil au sol","Personnel au sol, check-in");
                    ratingRow("Rapidité de l'enregistrement","File d'attente, efficacité");
                    ratingRow("Information sur le vol","Affichages, annonces");
                    ratingRow("Processus d'embarquement","Organisation, fluidité");
                    y+=2;
                    section("2. Confort à Bord",...BLUE);
                    ratingRow("Confort du siège","Espace, rembourrage, tablette");
                    ratingRow("Propreté de la cabine","Siège, hublot, sol, toilettes");
                    ratingRow("Température & ventilation","Confort thermique");
                    ratingRow("Niveau sonore","Bruit moteurs, cabine");
                    y+=2;
                    section("3. Service Cabin Crew",...EMERALD);
                    ratingRow("Accueil à bord","Sourire, présentation");
                    ratingRow("Courtoisie & professionnalisme","Attitude, disponibilité");
                    ratingRow("Réactivité aux demandes","Temps de réponse");
                    ratingRow("Qualité du service en vol","Boissons, journaux, assistance");

function ScreenOps({ flights, satis, safetyData, aircraft, onUpdateFlight, onUpdateAircraft, canEdit, canClose, clients, crew, onDeleteFlight, isAdmin }) {
  // Clôture par le pilote : seulement ses propres vols en cours, du jour ou de la veille.
  // Il saisit les éléments réels et clôt ; il ne crée, ne replanifie ni ne rouvre aucun vol.
  const pilote=typeof sgsCurrentUser==="function"?sgsCurrentUser():null;
  const piloteNom=pilote?((pilote.prenom||"")+" "+(pilote.nom||"")).trim():"";
  const norm=s=>String(s||"").toUpperCase().replace(/\s+/g," ").trim();
  const hier=new Date(Date.now()-36*3600000).toISOString().slice(0,10);
  const aClore=f=>canClose&&f.status==="En vol"&&String(f.date||"")>=hier&&
    (!piloteNom||[f.cm1,f.cm2].map(norm).includes(norm(piloteNom))||[f.cm1,f.cm2].map(norm).includes(norm((pilote||{}).nom+" "+(pilote||{}).prenom)));
  const peutOuvrir=f=>canEdit!==false||aClore(f);
  const [edit,setEdit]=useState(null);
  const [origStatus,setOrigStatus]=useState(null);
  // Mode pilote : il clôture son vol en saisissant tous les éléments ; le statut passe à « Terminé » à l'enregistrement
  const modePilote=canEdit===false&&!!canClose&&origStatus==="En vol";
  const [opsSaved,setOpsSaved]=useState(false);
  const [search,setSearch]=useState("");
  const [filterStatus,setFilterStatus]=useState("Tous");
  const [filterPeriodOps,setFilterPeriodOps]=useState("Tout");
  const getSecEvents=(num,date)=>(safetyData||[]).filter(e=>e.num===num&&(!date||e.date===date));

  // Period cutoff for Ops filter
  const nowOps=new Date(); nowOps.setHours(0,0,0,0);
  const opsCutoff=new Date(nowOps);
  if(filterPeriodOps==="7j") opsCutoff.setDate(opsCutoff.getDate()-7);
  else if(filterPeriodOps==="30j") opsCutoff.setDate(opsCutoff.getDate()-30);
  else opsCutoff.setFullYear(2000);

  // Filter flights
  const filtered=flights.filter(f=>{
    const q=search.trim().toUpperCase();
    if(q){
      const dateFull=f.date?f.date.slice(8)+"/"+f.date.slice(5,7)+"/"+f.date.slice(0,4):"";
      const num=(f.num||"").toUpperCase();
      const terms=q.split(/\s+/);
      const match=terms.every(t=>num.includes(t)||dateFull.includes(t));
      if(!match)return false;
    }
    if(filterStatus!=="Tous"&&f.status!==filterStatus)return false;
    if(filterPeriodOps!=="Tout"&&f.date&&new Date(f.date)<opsCutoff)return false;
    return true;
  });

  const calcEdit=ef=>{
    if(!ef)return{};
    const toMin=(t)=>{ const[h,m]=t.split(":").map(Number); return h*60+m; };
    const diffMin=(a,b)=>{ let d=toMin(b)-toMin(a); if(d<0)d+=1440; return d; }; // +24h si minuit franchi

    // Retard basé sur Off Block vs heure planifiée
    let delayMin=0;
    if(ef.arr&&ef.arrReal){
      const diff=diffMin(ef.arr,ef.arrReal);
      if(diff>15)delayMin=diff;
    }

    // Block Time (Off Block → On Block)
    let dureeMin=0;
    const dep2=ef.depReal||ef.dep, arr2=ef.arrReal||ef.arr;
    if(dep2&&arr2) dureeMin=diffMin(dep2,arr2);

    // Flight Time (Take Off → Landing) — utilisé pour TTAF
    let flightMin=0;
    if(ef.takeOff&&ef.landing) flightMin=diffMin(ef.takeOff,ef.landing);

    // Consommation basée sur Flight Time si disponible, sinon Block Time
    let consomme=0,consoH=0,fuelPct=ef.fuelPct||0;
    if(ef.carbDep>0&&ef.carbArr>0){
      consomme=ef.carbDep-ef.carbArr;
      fuelPct=Math.round(ef.carbArr/5700*100);
      const h=(flightMin>0?flightMin:dureeMin)/60;
      if(h>0)consoH=Math.round(consomme/h);
    }

    return{delayMin,consomme,consoH,fuelPct,nps:(ef.nps===''||ef.nps===undefined||ef.nps===null)?null:Number(ef.nps),dureeMin,flightMin};
  };

  const doUpdate=()=>{
    if(!edit)return;
    // Clôture d'un vol : tous les éléments sont exigés, pour tout le monde.
    // Une correction ultérieure d'un vol déjà terminé reste libre (rattrapage d'un vol ancien).
    if(modePilote || (origStatus==="En vol" && edit.status==="Termine")){
      const manque=[];
      if(!edit.depReal) manque.push("Off Block Time");
      if(!edit.takeOff) manque.push("Take Off Time");
      if(!edit.landing) manque.push("Landing Time");
      if(!edit.arrReal) manque.push("On Block Time");
      if(!(Number(edit.carbDep)>0)) manque.push("Carburant départ");
      if(!(Number(edit.carbArr)>0)) manque.push("Carburant arrivée");
      if(edit.pax===""||edit.pax==null) manque.push("Passagers réels");
      const cc=calcEdit(edit);
      if((cc.delayMin||0)>0&&!edit.causeRetard) manque.push("Cause du retard ("+cc.delayMin+" min de retard)");
      if(manque.length){ uiAlert("⚠️ Clôture impossible : il manque\n· "+manque.join("\n· ")); return; }

    }

    // Validation des transitions de statut
    const orig = origStatus;   // statut d'origine du vol ouvert
    const next = modePilote ? "Termine" : edit.status;   // le pilote clôture : la cible est « Terminé »
    if(orig==="Planifie" && next!=="En vol" && next!=="Annule"){
      uiAlert("Transition invalide : un vol planifié ne peut passer qu'à « En vol » ou « Annulé ».");
      return;
    }
    if(orig==="En vol" && next!=="Termine" && !modePilote){   // le pilote clôture : le statut est posé à l'enregistrement
      uiAlert("Transition invalide : un vol en cours ne peut passer qu'à « Terminé ».");
      return;
    }
    if((orig==="Termine"||orig==="Annule") && next!==orig){
      uiAlert("Ce vol est dans un état final ("+orig+") et ne peut plus être modifié.");
      return;
    }

    // Vérification MEL expiré au décollage (toutes catégories)
    if(next==="En vol"){
      const ac = (aircraft||[]).find(a=>a.id===edit.acId);
      if(ac && ac.mels && ac.mels.length>0){
        const today = new Date(); today.setHours(0,0,0,0);
        const expired = ac.mels.filter(m=>{
          if(!m.exp) return false;
          const parts = m.exp.split("/");
          if(parts.length!==3) return false;
          const yr = parseInt(parts[2])<100 ? 2000+parseInt(parts[2]) : parseInt(parts[2]);
          const expDate = new Date(yr, parseInt(parts[1])-1, parseInt(parts[0]));
          return expDate < today;
        });
        if(expired.length>0){
          uiAlert("⛔ Vol non autorisé — MEL expiré sur "+ac.immat+" :\n"+expired.map(m=>"• Cat."+m.sev+" — "+m.sys+" ("+m.mel+", exp. "+m.exp+")").join("\n")+"\n\nRésolvez ou étendez ce MEL avant de mettre l'avion En vol.");
          return;
        }
      }
      // Équipage : réévalué au départ, car un titre a pu échoir depuis la planification.
      const nomComplet=m=>m.nom+" "+m.prenom;
      const inaptes=[];
      [edit.cm1,edit.cm2,edit.cc].filter(Boolean).forEach(n=>{
        const m=(crew||[]).find(x=>nomComplet(x)===n);
        if(!m) return;
        const echus=titresEchus(m);
        if(echus.length) inaptes.push("• "+n+" : "+echus.map(e=>e.label).join(", "));
      });
      if(inaptes.length){
        uiAlert("⛔ Vol non autorisé — titre équipage échu :\n"+inaptes.join("\n")
          +"\n\nMettez à jour les échéances dans Formulaires → Équipage, ou modifiez l'équipage de ce vol avant de le mettre En vol.");
        return;
      }
    }

    // Validation cohérence des 4 horaires GMT (avec correction minuit)
    if(edit.status==="Termine"){
      const toMin=t=>{ if(!t||!t.includes(":"))return null; const[h,m]=t.split(":").map(Number); return h*60+m; };
      const diffOk=(a,b)=>{ const ma=toMin(a),mb=toMin(b); if(ma===null||mb===null)return true; let d=mb-ma; if(d<0)d+=1440; return d>0&&d<720; };
      const ob=edit.depReal, to=edit.takeOff, ld=edit.landing, onb=edit.arrReal;
      if(ob&&to&&!diffOk(ob,to)){ uiAlert("⚠️ Take Off Time doit être après Off Block Time."); return; }
      if(to&&ld&&!diffOk(to,ld)){ uiAlert("⚠️ Landing Time doit être après Take Off Time."); return; }
      if(ld&&onb&&!diffOk(ld,onb)){ uiAlert("⚠️ On Block Time doit être après Landing Time."); return; }
      if(ob&&onb&&!diffOk(ob,onb)){ uiAlert("⚠️ On Block Time doit être après Off Block Time."); return; }
    }

    // Vérification fuel arrivée > fuel départ
    if(edit.carbDep>0 && edit.carbArr>0 && edit.carbArr>edit.carbDep){
      uiAlert("⚠️ Fuel arrivée ("+edit.carbArr+" kg) ne peut pas être supérieur au fuel départ ("+edit.carbDep+" kg). Vérifiez vos valeurs.");
      return;
    }
    // Bornes par appareil : carburant et passagers
    const acVol=(aircraft||[]).find(a=>a.id===edit.acId);
    const capaVol=acVol&&acVol.capa>0?acVol.capa:null, siegesVol=acVol&&acVol.sieges>0?acVol.sieges:18;
    if(capaVol && edit.carbDep>capaVol){ uiAlert("⚠️ Fuel départ ("+edit.carbDep+" kg) supérieur à la capacité de "+acVol.immat+" ("+capaVol+" kg)."); return; }
    if(Number(edit.carbDep)<0||Number(edit.carbArr)<0){ uiAlert("⚠️ Une quantité de carburant ne peut pas être négative."); return; }
    if(Number(edit.pax)>siegesVol){ uiAlert("⚠️ "+edit.pax+" passagers pour "+siegesVol+" sièges sur "+(acVol?acVol.immat:"cet appareil")+"."); return; }

    if(canEdit===false){
      if(!aClore(flights.find(f=>edit.id?f.id===edit.id:(f.num===edit.num&&f.date===edit.date&&f.dep===edit.dep))||edit)){ uiAlert("⚠️ Vous ne pouvez clôturer que vos propres vols en cours, du jour ou de la veille."); return; }
    }
    const c=calcEdit(edit);
    // Taux de remplissage sur le nombre de sièges réel de l'appareil (CN-KTB : 8)
    onUpdateFlight({...edit,...(modePilote?{status:"Termine"}:{}),load:Math.round((Number(edit.pax)||0)/siegesVol*100),...c});

    // Mise à jour automatique du TTAF et A/B/C-Check avec le Flight Time (Take Off → Landing)
    // Correction d'un vol déjà clôturé : on n'applique que l'écart, et le cycle n'est compté qu'une fois
    const volInit = flights.find(f=>edit.id?f.id===edit.id:(f.num===edit.num&&f.date===edit.date&&f.dep===edit.dep))||{};
    const dejaClos = volInit.status==="Termine";
    const ancienMin = dejaClos ? (volInit.flightMin||0) : 0;
    if((edit.status==="Termine"||modePilote) && edit.acId && (c.flightMin>0||dejaClos)){
      const flightH = Math.round((c.flightMin-ancienMin)/60*100)/100;
      if(typeof onUpdateAircraft==="function" && (flightH!==0 || !dejaClos)){
        onUpdateAircraft(prev => prev.map(a => {
          if(a.id!==edit.acId) return a;
          return {
            ...a,
            ttaf:     Math.round((a.ttaf+flightH)*10)/10,
            cycles:   (a.cycles||0)+(dejaClos?0:1),
            nextCheckH: a.nextCheckH!=null ? Math.round(Math.max(0,(a.nextCheckH-flightH))*100)/100 : null,
            bCheckH:    a.bCheckH!=null    ? Math.round(Math.max(0,(a.bCheckH-flightH))*100)/100    : null,
            cCheckH:    a.cCheckH!=null    ? Math.round(Math.max(0,(a.cCheckH-flightH))*100)/100    : null,
          };
        }));
      }
    }
    setOpsSaved(true);
    setTimeout(()=>{setOpsSaved(false);setEdit(null);},900);
  };

  const enVol=flights.filter(f=>f.status==="En vol");
  const done=flights.filter(f=>f.status==="Termine");
  const planned=flights.filter(f=>f.status==="Planifie");

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {canEdit===false&&(
        <div style={{background:"#FEF3C7",border:"1px solid #D97706",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#92400E",fontWeight:600,textAlign:"center",lineHeight:1.45}}>
          {canClose?"✈️ Vous pouvez clôturer vos vols en cours : touchez le vol, saisissez les éléments réels, puis Terminé.":"👁 Mode consultation — Modifications non autorisées"}
        </div>
      )}
      {edit&&(
        <div style={{position:"fixed",inset:0,zIndex:400,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"flex-end"}}>
          <div style={{background:"white",width:"100%",borderRadius:"20px 20px 0 0",padding:"20px 16px 36px",maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
              <div>
                <div style={{fontWeight:800,fontSize:17,color:C.navy}}>{edit.num}</div>
                <div style={{fontSize:12,color:C.slate}}>{edit.from} vers {edit.to} | {edit.dep} - {edit.arr}</div>
                {edit.clientId&&clients&&(()=>{const cl=clients.find(x=>x.id===edit.clientId);return cl?<div style={{fontSize:12,color:"#0891B2",fontWeight:600,marginTop:2}}>🏢 {cl.nom}</div>:null;})()}
              </div>
              <button onClick={()=>setEdit(null)} style={{background:"none",border:"none",fontSize:22,color:C.slate,cursor:"pointer"}}>x</button>
            </div>
            {modePilote
              ? <div style={{marginBottom:16,background:"#FEF3C7",border:"1px solid #D97706",borderRadius:10,padding:"10px 12px",fontSize:12,color:"#92400E",lineHeight:1.45}}>
                  Renseignez tous les éléments du vol, puis touchez <b>Clôturer le vol</b> : le statut passera à « Terminé ».</div>
              : <div style={{marginBottom:16}}>
              <FLabel>Statut</FLabel>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {(origStatus==="Planifie"?["En vol","Annule"]
                  :origStatus==="En vol"?["Termine"]
                  :[origStatus]).map(s=>(
                  <button key={s} onClick={()=>setEdit({...edit,status:s})}
                    style={{width:140,padding:"9px 4px",borderRadius:9,border:"1.5px solid",fontSize:11,fontWeight:700,...TAP,borderColor:edit.status===s?sTx(s):C.border,background:edit.status===s?sBg(s):"white",color:edit.status===s?sTx(s):C.slate}}>
                    {sIc(s)} {s==="Termine"?"Vol terminé":s==="Annule"?"Vol annulé":s}
                  </button>
                ))}
              </div>
            </div>}
            {(edit.status==="Termine"||modePilote)&&(
              <div>
                <div style={{fontSize:10,fontWeight:700,color:C.gold,textTransform:"uppercase",marginBottom:8}}>Heures</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
                  <div>
                    <FLabel>Off Block Time (GMT)</FLabel>
                    <TimeField value={edit.depReal||""} onChange={v=>setEdit({...edit,depReal:v})}/>
                  </div>
                  <div>
                    <FLabel>Take Off Time (GMT)</FLabel>
                    <TimeField value={edit.takeOff||""} onChange={v=>setEdit({...edit,takeOff:v})}/>
                  </div>
                  <div>
                    <FLabel>Landing Time (GMT)</FLabel>
                    <TimeField value={edit.landing||""} onChange={v=>setEdit({...edit,landing:v})}/>
                  </div>
                  <div>
                    <FLabel>On Block Time (GMT)</FLabel>
                    <TimeField value={edit.arrReal||""} onChange={v=>setEdit({...edit,arrReal:v})}/>
                  </div>
                </div>
                <div style={{fontSize:10,fontWeight:700,color:C.emerald,textTransform:"uppercase",marginBottom:8}}>Carburant</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
                  <div>
                    <FLabel>Fuel depart (kg)</FLabel>
                    <input type="number" min={0} max={5700} value={edit.carbDep||""}
                      onChange={e=>setEdit({...edit,carbDep:Math.max(0,Number(e.target.value)||0)})}
                      style={{width:"100%",height:48,borderRadius:10,border:"1.5px solid "+C.border,padding:"0 12px",fontSize:14,outline:"none",background:C.bg,boxSizing:"border-box"}}/>
                  </div>
                  <div>
                    <FLabel>Fuel arrivee (kg)</FLabel>
                    <input type="number" min={0} max={5700} value={edit.carbArr||""}
                      onChange={e=>setEdit({...edit,carbArr:Math.max(0,Number(e.target.value)||0)})}
                      style={{width:"100%",height:48,borderRadius:10,border:"1.5px solid "+C.border,padding:"0 12px",fontSize:14,outline:"none",background:C.bg,boxSizing:"border-box"}}/>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
                  <div>
                    <FLabel>PAX reels</FLabel>
                    <input type="number" min={0} max={18} value={edit.pax}
                      onChange={e=>setEdit({...edit,pax:Math.min(18,Math.max(0,Number(e.target.value)||0))})}
                      style={{width:"100%",height:48,borderRadius:10,border:"1.5px solid "+C.border,padding:"0 12px",fontSize:14,outline:"none",background:C.bg,boxSizing:"border-box"}}/>
                  </div>
                  <div>
                    <FLabel>Satisfaction client</FLabel>
                    {(()=>{ const s=satDuVol(satis,edit); return <div style={{height:48,borderRadius:10,border:"1.5px solid "+C.border,padding:"0 12px",display:"flex",alignItems:"center",background:"#EEF2F6",fontSize:13,color:s?C.text:C.slateL}}>
                      {s?<><b style={{color:SAT_COUL(s.moyenne)}}>{sat10(s.moyenne)} / 10</b><span style={{color:C.slate,marginLeft:6,fontSize:11.5}}>· {s.repondues} rubriques</span></>:"Aucune enquête saisie"}</div>; })()}
                  </div>
                  <div style={{gridColumn:"1 / -1"}}>
                    <FLabel>Cause du retard</FLabel>
                    <CustomSelect value={edit.causeRetard||''} onChange={v=>setEdit({...edit,causeRetard:v})} placeholder='-- Sélectionner --'
                      options={[{value:'Technique',label:'🔧 Technique'},{value:'Météo',label:'⛈ Météo'},{value:'ATC',label:'📡 ATC'},{value:'Commercial',label:'💼 Commercial'},{value:'Équipage',label:'👨‍✈️ Équipage'},{value:'Handling',label:'🛂 Handling'},{value:'Passagers',label:'🧳 Passagers'},{value:'Carburant',label:'⛽ Carburant'},{value:'Autre',label:'📋 Autre'}]}/>
                  </div>
                  {edit.causeRetard&&edit.delayMin>0&&(
                    <div style={{gridColumn:"1 / -1"}}>
                      <FLabel>Détail (optionnel)</FLabel>
                      <input value={edit.causeDetail||""} onChange={e=>setEdit({...edit,causeDetail:e.target.value})}
                        placeholder="Ex: défaut hydraulique, CAM MORA fermé..."
                        style={{width:"100%",height:44,borderRadius:10,border:"1.5px solid "+C.border,padding:"0 12px",fontSize:13,outline:"none",background:C.bg,boxSizing:"border-box",color:C.text}}/>
                    </div>
                  )}
                </div>
                {edit.carbDep>0&&edit.carbArr>0&&(()=>{
                  const c=calcEdit(edit);
                  return (
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
                      <div style={{background:"#D1FAE5",borderRadius:9,padding:"8px",textAlign:"center",border:"1px solid #00936A"}}>
                        <div style={{fontSize:9,color:C.slate,fontWeight:700,textTransform:"uppercase"}}>Consomme</div>
                        <div style={{fontSize:15,fontWeight:800,color:"#00936A"}}>{c.consomme} kg</div>
                      </div>
                      <div style={{background:C.bg,borderRadius:9,padding:"8px",textAlign:"center"}}>
                        <div style={{fontSize:9,color:C.slate,fontWeight:700,textTransform:"uppercase"}}>Conso/h</div>
                        <div style={{fontSize:15,fontWeight:800,color:C.navy}}>{c.consoH||"--"} kg</div>
                      </div>
                      <div style={{background:C.bg,borderRadius:9,padding:"8px",textAlign:"center"}}>
                        <div style={{fontSize:9,color:C.slate,fontWeight:700,textTransform:"uppercase"}}>Duree</div>
                        <div style={{fontSize:15,fontWeight:800,color:C.navy}}>{c.dureeMin>0?Math.floor(c.dureeMin/60)+"h"+String(c.dureeMin%60).padStart(2,"0"):"--"}</div>
                      </div>
                      <div style={{
                        background:c.delayMin<=0?"#D1FAE5":c.delayMin<=15?"#D1FAE5":c.delayMin<=30?"#FEF3C7":"#FEE2E2",
                        borderRadius:9,padding:"8px",textAlign:"center",
                        border:"1px solid "+(c.delayMin<=0?"#00936A":c.delayMin<=15?"#00936A":c.delayMin<=30?"#D97706":"#DC2626")}}>
                        <div style={{fontSize:9,color:C.slate,fontWeight:700,textTransform:"uppercase"}}>Retard</div>
                        <div style={{fontSize:15,fontWeight:800,
                          color:c.delayMin<=0?"#065F46":c.delayMin<=15?"#065F46":c.delayMin<=30?"#92400E":"#991B1B"}}>
                          {c.delayMin<=0?"Ponctuel":"+"+c.delayMin+" min"}
                        </div>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}
            {(()=>{
              const evts=getSecEvents(edit.num,edit.date);
              if(evts.length===0)return null;
              return (
                <div style={{background:"#FEF2F2",border:"1px solid #FCA5A5",borderRadius:10,padding:"10px 14px",marginBottom:4}}>
                  <div style={{fontWeight:700,fontSize:12,color:"#DC2626",marginBottom:8}}>🛡 Événements sécurité associés</div>
                  {evts.map((e,i)=>(
                    <div key={i} style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:i<evts.length-1?6:0}}>
                      {safetyChips(e).map(ch=>(<span key={ch.k} style={{background:ch.color+"18",color:ch.color,padding:"2px 8px",borderRadius:8,fontSize:10,fontWeight:600}}>{ch.l}</span>))}
                    </div>
                  ))}
                </div>
              );
            })()}
            <div style={{display:"flex",gap:10,justifyContent:"flex-start"}}>
              <button onClick={()=>setEdit(null)} style={{width:120,height:48,background:C.bg,border:"1.5px solid "+C.border,borderRadius:10,color:C.slate,fontSize:14,fontWeight:700,...TAP}}>Annuler</button>
              <button onClick={doUpdate} style={{width:modePilote?200:160,height:48,background:opsSaved?"#00936A":"#DC2626",border:"none",borderRadius:10,color:"white",fontSize:14,fontWeight:700,...TAP,transition:"background 0.3s"}}>{opsSaved?"✅ Enregistré":modePilote?"✈️ Clôturer le vol":"Enregistrer"}</button>
            </div>
            {isAdmin&&onDeleteFlight&&(
              <button onClick={async()=>{
                  const d=(edit.date||"").split("-").reverse().join("/");
                  if(!(await uiConfirm("⛔ "+"Supprimer définitivement le vol "+edit.num+" du "+d+" ("+edit.from+"→"+edit.to+") ?\n\nCette action est irréversible. Utilisez « Annulé » pour conserver la trace d'un vol qui n'a pas eu lieu."))) return;
                  onDeleteFlight(edit); setEdit(null);
                }}
                style={{marginTop:10,width:"100%",height:40,background:"white",border:"1.5px solid #DC2626",borderRadius:10,color:"#DC2626",fontSize:12,fontWeight:700,...TAP}}>
                🗑 Supprimer ce vol — saisie erronée
              </button>
            )}
          </div>
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
        {[["○",planned.length,"Planifies",C.slate],["✈",enVol.length,"En vol",C.gold],["✓",done.length,"Termines",C.emerald],["👥",fmtMAD(flights.reduce((s,f)=>s+f.pax,0)),"PAX",C.navy]].map(([ic,v,l,c])=>(
          <div key={l} style={{background:"white",borderRadius:10,border:"1px solid "+C.border,textAlign:"center",padding:"10px 4px"}}>
            <div style={{fontSize:16}}>{ic}</div>
            <div style={{fontSize:20,fontWeight:800,color:c}}>{v}</div>
            <div style={{fontSize:8,color:C.slate,fontWeight:700,textTransform:"uppercase"}}>{l}</div>
          </div>
        ))}
      </div>
      {enVol.length>0&&(
        <div style={{background:"linear-gradient(135deg,#0F1F3D,#1D3461)",borderRadius:12,padding:"14px 16px"}}>
          <div style={{color:C.gold,fontSize:10,fontWeight:700,textTransform:"uppercase",marginBottom:6}}>Vol en cours</div>
          <div style={{color:"white",fontWeight:800,fontSize:15}}>{enVol[0].num} — {enVol[0].from} vers {enVol[0].to}</div>
          <div style={{color:"#94A3B8",fontSize:11,marginTop:3}}>{enVol[0].dep} - {enVol[0].arr} · {enVol[0].pax} pax</div>
          <button onClick={()=>{setEdit({...enVol[0]});setOrigStatus(enVol[0].status);}}
            style={{marginTop:10,background:"rgba(255,255,255,0.15)",border:"1px solid rgba(255,255,255,0.3)",borderRadius:8,padding:"8px 16px",color:"white",fontSize:12,fontWeight:700,...TAP,display:canEdit===false?"none":"inline-block"}}>
            Mettre a jour
          </button>
        </div>
      )}
      <div style={{background:"white",borderRadius:12,border:"1px solid "+C.border,padding:"10px 12px",display:"flex",flexDirection:"column",gap:8}}>
        <input
          type="text"
          placeholder="🔍  CN-KTA  /  30/06/2026  /  CN-KTA 30/06/2026"
          value={search}
          onChange={e=>setSearch(e.target.value.toUpperCase())}
          style={{width:"100%",padding:"9px 12px",borderRadius:9,border:"1.5px solid "+C.border,fontSize:13,color:C.text,background:C.bg,outline:"none",textTransform:"uppercase"}}
        />
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {["Tous","Planifie","En vol","Termine","Annule"].map(s=>(
            <button key={s} onClick={()=>setFilterStatus(s)}
              style={{padding:"4px 10px",borderRadius:8,border:"1.5px solid "+(filterStatus===s?C.navy:C.border),background:filterStatus===s?C.navy:"white",color:filterStatus===s?"white":C.slate,fontSize:11,fontWeight:700,...TAP}}>
              {s}
            </button>
          ))}
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {["7j","30j","Tout"].map(p=>(
            <button key={p} onClick={()=>setFilterPeriodOps(p)}
              style={{padding:"4px 10px",borderRadius:8,border:"1.5px solid "+(filterPeriodOps===p?C.navy:C.border),background:filterPeriodOps===p?C.navy:"white",color:filterPeriodOps===p?"white":C.slate,fontSize:11,fontWeight:700,...TAP}}>
              {p}
            </button>
          ))}
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <span style={{background:"#00936A",color:"white",borderRadius:5,padding:"1px 6px",fontSize:9,fontWeight:800}}>COM</span><span style={{fontSize:10,color:C.slate}}>Commercial</span>
          <span style={{background:"#0369A1",color:"white",borderRadius:5,padding:"1px 6px",fontSize:9,fontWeight:800}}>FRY</span><span style={{fontSize:10,color:C.slate}}>Ferry</span>
          <span style={{background:"#D97706",color:"white",borderRadius:5,padding:"1px 6px",fontSize:9,fontWeight:800}}>POS</span><span style={{fontSize:10,color:C.slate}}>Positioning</span>
        </div>
      </div>
      <div style={{background:"white",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}}>
        <div style={{padding:"9px 14px",background:C.bg,borderBottom:"1px solid "+C.border,fontSize:10,fontWeight:700,color:C.slate,textTransform:"uppercase",display:"flex",justifyContent:"space-between"}}>
          <span>Rotations — appuyez pour modifier</span>
          <span style={{color:C.navy}}>{filtered.length}/{flights.length}</span>
        </div>
        {filtered.length===0&&<div style={{padding:20,textAlign:"center",color:C.slateL,fontSize:13}}>Aucun vol trouvé</div>}
        {filtered.map((f,i)=>(
          <FlightRow key={i} f={f} isLast={i===filtered.length-1} canEdit={peutOuvrir(f)}
            onOpen={v=>{setEdit({...v});setOrigStatus(v.status);}}
            secEvts={getSecEvents(f.num,f.date)}
            compromis={f.status==="Planifie" ? [...volCompromis(f, crew, aircraft), ...chevauchements(f, flights)] : []}
            clients={clients}/>
        ))}
      </div>
    </div>
  );
}


function ScreenAlertes({ sgsRed, kpis, flights, dismissed, setDismissed, maintData, alertHist, setAlertHist, aircraft, melHist, crew }) {
  const all=computeAlerts(kpis,flights,maintData,aircraft,crew,sgsRed);
  const active=all.filter(a=>!dismissed.includes(a.id));
  const colors={danger:{bg:"#FEE2E2",border:"#DC2626",text:"#DC2626"},warn:{bg:"#FEF3C7",border:"#D97706",text:"#D97706"}};
  const [melFilter,setMelFilter]=React.useState("Tout");
  const now=new Date();
  const filteredMelHist=(melHist||[]).filter(m=>{
    if(melFilter==="Tout") return true;
    const days=melFilter==="7j"?7:30;
    const d=new Date(m.resolvedAt||m.dateResolution);
    return (now-d)/(1000*60*60*24)<=days;
  });

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div style={{background:"white",borderRadius:12,border:"1px solid "+C.border,padding:14,textAlign:"center"}}>
          <div style={{fontSize:28,fontWeight:800,color:active.length>0?C.danger:C.emerald}}>{active.length}</div>
          <div style={{fontSize:10,color:C.slate,fontWeight:700,textTransform:"uppercase"}}>Alertes actives</div>
        </div>
        <div style={{background:"white",borderRadius:12,border:"1px solid "+C.border,padding:14,textAlign:"center"}}>
          <div style={{fontSize:28,fontWeight:800,color:C.emerald}}>{(melHist||[]).length}</div>
          <div style={{fontSize:10,color:C.slate,fontWeight:700,textTransform:"uppercase"}}>MEL Résolus</div>
        </div>
      </div>

      {/* Alertes actives */}
      <SectionTitle>🔔 Alertes actives</SectionTitle>
      {active.length===0?(
        <div style={{background:"#D1FAE5",border:"1px solid #00936A",borderRadius:12,padding:20,textAlign:"center"}}>
          <div style={{fontSize:32,marginBottom:8}}>✅</div>
          <div style={{fontWeight:700,color:"#065F46"}}>Aucune alerte active</div>
        </div>
      ):active.map(a=>{
        const cl=colors[a.sev]||colors.warn;
        const expiredStyle=a.expired?{bg:"#DC2626",border:"#DC2626",text:"white",sub:"white"}:cl;
        return (
          <div key={a.id} style={{background:expiredStyle.bg,border:"1.5px solid "+expiredStyle.border,borderRadius:12,padding:"14px 16px",display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontSize:24}}>{a.icon}</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:13,color:expiredStyle.text}}>{a.msg}</div>
              <div style={{fontSize:10,color:a.expired?"white":C.slate,marginTop:2}}>{a.expired?"MEL EXPIRÉ":a.sev==="danger"?"CRITIQUE":"ATTENTION"}</div>
            </div>
          </div>
        );
      })}

      {/* ── Historique MEL résolus ── */}
      <Card>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:C.slate,textTransform:"uppercase",letterSpacing:"0.08em"}}>🔧 MEL Résolus</div>
          <div style={{display:"flex",gap:6}}>
            {["7j","30j","Tout"].map(f=>(
              <button key={f} onClick={()=>setMelFilter(f)}
                style={{padding:"3px 10px",borderRadius:8,border:"1px solid "+C.border,
                  background:melFilter===f?C.navy:"white",color:melFilter===f?"white":C.slate,
                  fontSize:11,fontWeight:700,...TAP}}>
                {f}
              </button>
            ))}
          </div>
        </div>
        {filteredMelHist.length===0?(
          <div style={{textAlign:"center",color:C.slateL,fontSize:12,padding:"12px 0"}}>Aucun MEL résolu sur cette période</div>
        ):(

}

function LineChart({data, color, target, maxVal, minVal, unit, fmtVal}) {
  const fmt=fmtVal||(v=>v);
  const W=300, H=90, padL=28, padR=8, padT=10, padB=20;
  const cW=W-padL-padR, cH=H-padT-padB;
  const pts = data.filter(d=>d.val!==null);
  if(pts.length<2) return (
    <div style={{textAlign:"center",padding:"20px",color:C.slateL,fontSize:12}}>
      Donnees insuffisantes (min. 2 semaines)
    </div>
  );
  const vals = pts.map(p=>p.val);
  const lo = minVal!==undefined ? minVal : Math.max(0,Math.min(...vals)-10);
  const hi = maxVal!==undefined ? maxVal : Math.max(...vals)+10;
  const range = hi-lo||1;
  const xS = i => padL + (i/(pts.length-1))*cW;
  const yS = v => padT + cH - ((v-lo)/range)*cH;
  const pathD = pts.map((p,i)=>(i===0?"M":"L")+xS(i).toFixed(1)+","+yS(p.val).toFixed(1)).join(" ");
  const areaD = pathD+" L"+xS(pts.length-1).toFixed(1)+","+(padT+cH)+" L"+padL.toFixed(1)+","+(padT+cH)+" Z";
  const ty = target!==undefined ? yS(Math.min(hi,Math.max(lo,target))) : null;
  return (
    <svg width="100%" viewBox={"0 0 "+W+" "+H} style={{display:"block",overflow:"visible"}}>
      {[0,0.5,1].map((t,i)=>{
        const yy=padT+cH*t, lv=Math.round(hi-t*(hi-lo));
        return <g key={i}>
          <line x1={padL} y1={yy} x2={W-padR} y2={yy} stroke={C.border} strokeWidth={0.5} strokeDasharray="3,3"/>
          <text x={padL-3} y={yy+3} textAnchor="end" fontSize={7} fill={C.slateL}>{fmt(lv)}</text>
        </g>;
      })}
      {ty!=null && <g>
        <line x1={padL} y1={ty} x2={W-padR} y2={ty} stroke={color} strokeWidth={0.8} strokeDasharray="3,2" opacity={0.45}/>
        <text x={W-padR+2} y={ty+3} fontSize={6} fill={color} opacity={0.6}>Obj</text>
      </g>}
      <path d={areaD} fill={color} fillOpacity={0.07}/>
      <path d={pathD} fill="none" stroke={color} strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"/>
      {pts.map((p,i)=>{
        const isLast = i===pts.length-1;
        return <g key={i}>
          <circle cx={xS(i)} cy={yS(p.val)} r={isLast?4:2.5}
            fill={isLast?color:"white"} stroke={color} strokeWidth={isLast?0:1.5}/>
          {isLast && <text x={xS(i)} y={yS(p.val)-8} textAnchor="middle"
            fontSize={8} fontWeight="700" fill={color}>{fmt(p.val)}{unit}</text>}
        </g>;
      })}
      {pts.map((p,i)=>{
        if(pts.length<=7||i===0||i===pts.length-1||i%Math.ceil(pts.length/5)===0)
          return <text key={i} x={xS(i)} y={H-3} textAnchor="middle" fontSize={7} fill={C.slateL}>{p.label}</text>;
        return null;
      })}
    </svg>
  );
}

function ChartCard({title,icon,data,color,target,maxVal,minVal,unit,showTotal,fmtVal}) {
  const pts = data.filter(d=>d.val!==null);
  const avg = pts.length>0 ? Math.round(pts.reduce((s,p)=>s+p.val,0)/pts.length*10)/10 : null;
  const total = pts.reduce((s,p)=>s+p.val,0);
  const fmt=fmtVal||(v=>v);
  return (
    <Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:10,fontWeight:700,color:C.slate,textTransform:"uppercase",letterSpacing:"0.09em"}}>{icon} {title}</div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:16,fontWeight:800,color}}>{showTotal?total:(avg!==null?fmt(avg):"--")}{unit}</div>
          <div style={{fontSize:9,color:C.slateL}}>{showTotal?"Total — "+pts.length+" sem.":"Moyenne — "+pts.length+" semaine(s)"}</div>
        </div>
      </div>
      <LineChart data={data} color={color} target={target} maxVal={maxVal} minVal={minVal} unit={unit} fmtVal={fmtVal}/>
    </Card>
  );
}

          <ChartCard title="Conso. carburant moyenne" icon="⛽"
            data={consoData} color={C.gold} target={900} maxVal={1100} minVal={600} unit="kg/h"/>
          <ChartCard title="Satisfaction client" icon="⭐"
            data={npsData} color="#7C3AED" target={70} maxVal={100} minVal={40} unit="%"/>

      ) : (
        <Card>
          <div style={{textAlign:"center",padding:"20px 0",color:C.slateL}}>
            <div style={{fontSize:32,marginBottom:8}}>📊</div>
            <div style={{fontWeight:600,fontSize:13,color:C.slate}}>Graphiques disponibles</div>
            <div style={{fontSize:12,marginTop:4}}>apres 2 jours de vols enregistres</div>

      {/* Bar trends */}

        <Bar label="Load Factor" value={lfVal} max={100} unit="%" color={lfVal>=80?C.emerald:C.warn} sub="Objectif: 80%"/>

}


function ScreenMaint({ kpis, maintData, flights, aircraft }) {

  const acInfo=aircraft?.find(a=>a.id===selAc)||aircraft?.[0]||{};
  // Use per-aircraft data if available, fallback to global maintData
  const md=Object.keys(acInfo).length>0?acInfo:(maintData||{});
  const mels=md.mels||[];
  // Filter flights by selected aircraft - if only 1 aircraft or flights have no acId, use all flights
  const hasAcIds=flights.some(f=>f.acId);
  const acFlights=aircraft&&aircraft.length>1&&hasAcIds?flights.filter(f=>f.acId===selAc||!f.acId):flights;
  const isMelExpired=m=>{if(!m.exp)return false;const p=m.exp.split("/");if(p.length!==3)return false;const d=new Date(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));const t=new Date();t.setHours(0,0,0,0);return d<t;};
  // Calculate Tech Delay from flights
  const volsDone=acFlights.filter(f=>f.status==="Termine");
  const techVols=volsDone.filter(f=>f.causeRetard==="Technique");
  const techDelay=volsDone.length>0?Math.round((techVols.length/volsDone.length)*1000)/10:0;
  // Dispatch Reliability
  const volsPlanned=acFlights.filter(f=>f.status!=="Annule");
  const dispatchRel=volsPlanned.length>0?Math.round((volsDone.length/volsPlanned.length)*1000)/10:0;
  // Completion Factor
  const techCancels=acFlights.filter(f=>f.status==="Annule"&&f.causeRetard==="Technique");
  const compBase=volsPlanned.length-techCancels.length;
  const completionFactor=compBase>0?Math.round((volsDone.length/compBase)*1000)/10:0;
  const sevColor=s=>s==="A"?"#DC2626":s==="B"?"#D97706":"#64748B";
  const sevBg=s=>s==="A"?"#FEE2E2":s==="B"?"#FEF3C7":"#F1F5F9";
  return (

        <div>
          <CustomSelect value={selAc} onChange={setSelAc} icon='🛩'
            options={(aircraft||[]).map(a=>({value:a.id,label:a.immat+' · '+a.type,sub:'TTAF '+(a.ttaf||0).toFixed(1)+'h'}))}/>
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <KpiTile title="TTAF" value={(md.ttaf||0).toFixed(1)} unit="h" accent={C.navy} icon="⏱"/>
        <KpiTile title="Cycles" value={(md.cycles||0).toLocaleString()} unit="" accent={C.navy} icon="🔄"/>
        <KpiTile title="MEL actifs" value={mels.length} unit="" accent={mels.length>0?C.warn:C.emerald} icon="⚠"/>
      </div>
      <Card>
        <SectionTitle>Visites périodiques</SectionTitle>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
          {[
            {label:"A-Check",val:md.nextCheckH,warn:100,danger:50},
            {label:"B-Check",val:md.bCheckH,warn:300,danger:100},
            {label:"C-Check",val:md.cCheckH,warn:500,danger:200},
          ].map(({label,val,warn,danger})=>{
            const v=Number(val)||0;
            const color=!val||v===0?C.slate:v<danger?C.danger:v<warn?C.warn:C.emerald;
            const status=!val||v===0?"--":v<danger?"URGENT":v<warn?"Proche":"OK";
            return (
              <div key={label} style={{background:C.bg,borderRadius:10,padding:"10px 8px",textAlign:"center"}}>

                <div style={{fontSize:16,fontWeight:800,color:color}}>{val||"--"}{val?" h":""}</div>
                <div style={{fontSize:9,fontWeight:700,color:color,marginTop:2}}>{status}</div>
              </div>
            );
          })}
        </div>
      </Card>
      <Card>
        <SectionTitle>MEL actifs ({mels.length})</SectionTitle>
        {mels.length===0&&<div style={{textAlign:"center",color:C.slateL,fontSize:13,padding:"12px 0"}}>Aucun MEL actif</div>}
        {mels.map((m,i)=>(
          <div key={i} style={{background:isMelExpired(m)?"#DC2626":"transparent",border:isMelExpired(m)?"1.5px solid #DC2626":"none",borderRadius:isMelExpired(m)?8:0,padding:"10px 8px",marginBottom:i<mels.length-1?4:0,display:"flex",gap:10,alignItems:"center"}}>
            <span style={{background:sevBg(m.sev),color:sevColor(m.sev),padding:"2px 8px",borderRadius:8,fontSize:10,fontWeight:700,flexShrink:0}}>Cat.{m.sev}</span>
            <div style={{flex:1,minWidth:0}}>

              <div style={{fontSize:10,color:isMelExpired(m)?"rgba(255,255,255,0.8)":C.slate}}>{m.mel}{m.exp?" · Exp: "+m.exp:""}{isMelExpired(m)&&<span style={{fontWeight:700}}> ⚠️ EXPIRÉ</span>}</div>
              {(m.extensions||[]).length>0&&(
                <div style={{marginTop:6,borderTop:"1px solid "+C.border,paddingTop:6}}>
                  <div style={{fontSize:9,fontWeight:700,color:"#D97706",marginBottom:4}}>📋 HISTORIQUE EXTENSIONS</div>
                  {(m.extensions||[]).map((e,ei)=>(
                    <div key={ei} style={{fontSize:9,color:C.slate,background:"#FFFBEB",borderRadius:6,padding:"4px 8px",marginBottom:3}}>
                      <span style={{fontWeight:700,color:"#D97706"}}>{e.date}</span> · {e.oldExp} → <span style={{fontWeight:700,color:C.navy}}>{e.newExp}</span>
                      {e.motif!=="—"&&<span> · {e.motif}</span>}

                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        ))}
        <div style={{marginTop:10,fontSize:11,color:C.slateL,textAlign:"center"}}>
          Gérer les MEL dans Formulaires → Maintenance
        </div>
      </Card>
      <Card>
        <SectionTitle>Indicateurs CAMO</SectionTitle>
        <Bar label="Fiabilite moteurs" value={md.fiabMoteurs||0} max={100} unit="%" color={(md.fiabMoteurs||0)>=99.5?C.emerald:C.warn} sub="Objectif: 99.5%"/>
        <Bar label="Tech delay" value={techDelay} max={5} unit="%" color={techDelay<2?C.emerald:C.danger} sub="Seuil: 2%"/>
      </Card>
    </div>
  );
}

// ── Report ───────────────────────────────────────────────────────────────────
// Échappement des valeurs saisies avant insertion dans le HTML du rapport :
// une immatriculation ou un libellé ne doit jamais pouvoir être interprété comme du code.
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function buildReport(flights, kpis, now, finData, maintData, safetyData, aircraft) {
  const ds=now.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
  const G="#00936A",O="#D97706",N="#0F1F3D";

  // Filter to current week (Monday to Sunday)
  const getMonday=d=>{const day=d.getDay()||7;const mon=new Date(d);mon.setDate(d.getDate()-day+1);mon.setHours(0,0,0,0);return mon;};
  const monday=getMonday(now);
  const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);sunday.setHours(23,59,59,999);
  const weekFlights=flights.filter(f=>{
    if(!f.date)return false;
    const fd=new Date(f.date);
    return fd>=monday&&fd<=sunday;
  });
  const weekLabel=monday.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+" — "+sunday.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});

  // All terminated flights for global counters
  const allDone=flights.filter(f=>f.status==="Termine");
  const done=allDone.length;
  const tPax=allDone.reduce((s,f)=>s+f.pax,0);

  // Last 30 days for KPI performance
  const volsDoneR=allDone;

  // Use first aircraft data if available, fallback to maintData
  const acList=aircraft||[];
  const md=acList[0]||{};
  const mels=acList.reduce((all,ac)=>[...all,...(ac.mels||[])],[]);
  const fd=finData||[];
  const tRev=fd.reduce((s,f)=>s+f.revenus,0);
  const tCout=fd.reduce((s,f)=>s+f.couts,0);
  const marge=tRev>0?Math.round((1-tCout/tRev)*1000)/10:0;

  // Flight type breakdown
  const R_FTYPES=[{v:"Commercial",code:"COM",color:"#00936A"},{v:"Ferry",code:"FRY",color:"#0369A1"},{v:"Positioning",code:"POS",color:"#D97706"}];
  const rFTypeData=R_FTYPES.map(t=>({...t,n:allDone.filter(f=>(!f.flightType&&t.v==="Commercial")||f.flightType===t.v).length}));

  // Computed KPIs from flights
  const otpScoreR=f=>f.delayMin<=0?100:f.delayMin<=15?85:f.delayMin<=30?70:f.delayMin<=45?50:25;
  const rOtp=volsDoneR.length>0?Math.round(volsDoneR.reduce((s,f)=>s+otpScoreR(f),0)/volsDoneR.length):kpis.otp||0;
  const rLfCom=volsDoneR.filter(f=>!f.flightType||f.flightType==="Commercial");const rLf=rLfCom.length>0?Math.round(rLfCom.reduce((s,f)=>s+f.load,0)/rLfCom.length):kpis.loadFactor||0;
  const rDelayVols=volsDoneR.filter(f=>f.delayMin>0);
  const rDelay=rDelayVols.length>0?Math.round(rDelayVols.reduce((s,f)=>s+f.delayMin,0)/rDelayVols.length):kpis.delayMin||0;
  const rTechDelayVols=rDelayVols.filter(f=>f.causeRetard==="Technique");
  const rTechRate=volsDoneR.length>0?Math.round(rTechDelayVols.length/volsDoneR.length*100*10)/10:0;
  const R_CAUSES=["Technique","Météo","ATC","Commercial","Équipage","Handling","Passagers","Carburant","Autre"];
  const rDelayCauses=R_CAUSES.map(c=>({
    cause:c,
    count:rDelayVols.filter(f=>f.causeRetard===c).length,
    avgMin:rDelayVols.filter(f=>f.causeRetard===c).length>0?Math.round(rDelayVols.filter(f=>f.causeRetard===c).reduce((s,f)=>s+f.delayMin,0)/rDelayVols.filter(f=>f.causeRetard===c).length):0,
  })).filter(c=>c.count>0).sort((a,b)=>b.count-a.count);
  const rConsoVols=volsDoneR.filter(f=>f.consoH>0);
  const rConso=rConsoVols.length>0?Math.round(rConsoVols.reduce((s,f)=>s+f.consoH,0)/rConsoVols.length):kpis.consoH||0;
  const rNpsVols=volsDoneR.filter(f=>f.nps!==null);
  const rNps=rNpsVols.length>0?Math.round(rNpsVols.reduce((s,f)=>s+f.nps,0)/rNpsVols.length*10)/10:kpis.nps||0;

  const row=(v1,l1,c1,v2,l2,c2,v3,l3,c3)=>{
    const fs=n=>String(n).length>8?"13px":String(n).length>5?"16px":"20px";
    const fsSame=(a,b,c)=>{const s=[a,b,c].map(n=>String(n).length);const max=Math.max(...s);return max>8?"13px":max>5?"16px":"20px";};
    const f=fsSame(v1,v2,v3);
    return "<div style='display:grid;grid-template-columns:1fr 1fr 1fr'><div style='text-align:center;padding:10px 4px;border-right:1px solid #EEF2F8'><div style='font-size:"+f+";font-weight:800;color:"+c1+"'>"+v1+"</div><div style='font-size:9px;color:#64748B;font-weight:700;text-transform:uppercase'>"+l1+"</div></div><div style='text-align:center;padding:10px 4px;border-right:1px solid #EEF2F8'><div style='font-size:"+f+";font-weight:800;color:"+c2+"'>"+v2+"</div><div style='font-size:9px;color:#64748B;font-weight:700;text-transform:uppercase'>"+l2+"</div></div><div style='text-align:center;padding:10px 4px'><div style='font-size:"+f+";font-weight:800;color:"+c3+"'>"+v3+"</div><div style='font-size:9px;color:#64748B;font-weight:700;text-transform:uppercase'>"+l3+"</div></div></div>";
  };

  const kpiLine=(l,v,o,ok)=>
    "<div style='display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid #EEF2F8'><div style='flex:1;font-size:12px;color:#475569'>"+l+"<div style='font-size:10px;color:#94A3B8'>Objectif: "+o+"</div></div><div style='font-weight:800;font-size:13px;color:"+N+";padding-right:8px'>"+v+"</div><span style='background:"+(ok?"#D1FAE5":"#FEF3C7")+";color:"+(ok?"#065F46":"#92400E")+";padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700'>"+(ok?"OK":"Att.")+"</span></div>";

  const sec=(t,c)=>"<div style='background:"+c+";color:white;padding:7px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em'>"+t+"</div>";
  const card=c=>"<div style='background:white;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;margin:10px 0'>"+c+"</div>";

  const gridStyle="display:grid;grid-template-columns:1.8fr 1.6fr 1.8fr 1fr 0.9fr 0.6fr 1.2fr;align-items:center;padding:4px 6px;border-bottom:1px solid #EEF2F8;";
  const fHeader="<div style='"+gridStyle+"background:#EEF2F8;border-bottom:1px solid #DDE3ED'>"
    +"<div style='font-size:8px;font-weight:700;color:#64748B;text-transform:uppercase;padding-left:11px'>Vol</div>"
    +"<div style='font-size:8px;font-weight:700;color:#64748B;text-transform:uppercase;text-align:center'>Route</div>"
    +"<div style='font-size:8px;font-weight:700;color:#64748B;text-transform:uppercase;text-align:center'>BLK Time</div>"
    +"<div style='font-size:8px;font-weight:700;color:#64748B;text-transform:uppercase;text-align:center'>Date</div>"
    +"<div style='font-size:8px;font-weight:700;color:#64748B;text-transform:uppercase;text-align:center'>FLT</div>"
    +"<div style='font-size:8px;font-weight:700;color:#64748B;text-transform:uppercase;text-align:center'>Pax</div>"
    +"<div style='font-size:8px;font-weight:700;color:#64748B;text-transform:uppercase;text-align:right'>CM1</div>"
    +"</div>";
  const fRows=fHeader+weekFlights.map((f,i)=>{
    const dot=f.status==="Termine"?"#00936A":f.status==="En vol"?"#D97706":"#94A3B8";
    const isTermine=f.status==="Termine";
    let durVal="--";
    if(isTermine&&f.dureeMin>0){
      durVal=Math.floor(f.dureeMin/60)+"h"+String(f.dureeMin%60).padStart(2,"0");
    }
    const durColor=isTermine?"#00936A":"#94A3B8";
    const blkTime=isTermine&&f.depReal&&f.arrReal?(f.depReal+"-"+f.arrReal):"--";
    const dateShort=f.date?f.date.slice(8)+"/"+f.date.slice(5,7):"--";
    const cm1Last=(f.cm1||"--").split(" ")[0];
    return "<div style='"+gridStyle+"background:"+(i%2?"#F8FAFC":"white")+"'>"
      +"<div style='display:flex;align-items:center;gap:4px'><span style='width:7px;height:7px;border-radius:50%;background:"+dot+";display:inline-block;flex-shrink:0'></span><span style='font-weight:800;font-size:10px;color:#0F1F3D;white-space:nowrap'>"+esc(f.num)+"</span></div>"
      +"<div style='font-size:10px;font-weight:700;white-space:nowrap;text-align:center'>"+esc(f.from)+"→"+esc(f.to)+"</div>"
      +"<div style='font-size:8.5px;color:#64748B;white-space:nowrap;text-align:center'>"+blkTime+"</div>"
      +"<div style='font-size:8.5px;color:#94A3B8;white-space:nowrap'>"+dateShort+"</div>"
      +"<div style='font-size:10px;font-weight:700;color:"+durColor+";text-align:center'>"+durVal+"</div>"
      +"<div style='font-size:10px;text-align:center'>"+f.pax+"</div>"
      +"<div style='font-size:9px;color:#64748B;text-align:right'>"+cm1Last+"</div>"
      +"</div>";
  }).join("");

  const allMelsForReport=acList.reduce((all,ac)=>[...all,...(ac.mels||[]).map(m=>({...m,acImmat:acList.length>1?ac.immat:null}))],[]);

// Tant qu'aucun compte actif n'existe pour un profil, son mot de passe partagé reste valable (démarrage).

const USERS_KEY=PFX+"users";
async function sha256hex(s){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join(""); }
const userHash=(pwd,salt)=>sha256hex(salt+":"+pwd);
function randomToken(n,alpha){ const a=alpha||"ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789"; const r=new Uint32Array(n); crypto.getRandomValues(r); return Array.from(r).map(x=>a[x%a.length]).join(""); }
const userLabel=u=>u?((u.prenom||"")+" "+(u.nom||"")).trim():"";
// Liste des comptes : Supabase, avec copie locale pour pouvoir se connecter si le réseau est lent
async function usersLoad(){

  try{ return JSON.parse(localStorage.getItem(USERS_KEY+"_cache")||"[]")||[]; }catch(_e){ return []; }
}
